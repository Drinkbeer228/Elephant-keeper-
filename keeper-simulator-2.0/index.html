      function calculateShiftAssessment() {
        const clamp = n => Math.max(0, Math.min(100, Math.round(n)));
        const welfare = clamp(elephants.reduce((sum, el) => sum + el.satiety * 0.65 + (100 - el.thirst) * 0.35, 0) / elephants.length - stats.missedUrineSamples * 2 - stats.missedPedicures * 2);
        const hygiene = clamp(18 + Math.min(30, stats.manureCleanedKg * 0.75) + waterTrough.level * 0.22 + (waterTrough.isClean ? 18 : 0) - dungPiles.length * 2);
        const morning = ['morning-audrey','morning-margo','morning-pretty'].filter(taskComplete).length;
        const evening = ['evening-audrey','evening-margo','evening-pretty'].filter(taskComplete).length;
        const medical = clamp((morning + evening) / 6 * 40 + Math.min(30, stats.urineSamplesCollected * 30) + Math.min(30, stats.pedicuresDone * 30) + (stats.handoverCompleted ? 10 : 0));
        const done = shiftTaskDefinitions.filter(t => taskComplete(t.id)).length;
        const punctual = shiftTaskDefinitions.filter(t => taskComplete(t.id) && shiftTasks[t.id].completedAt <= t.deadline).length;
        const schedule = clamp(done / shiftTaskDefinitions.length * 70 + punctual / shiftTaskDefinitions.length * 30);
        return [
          { label: 'Благополучие животных', value: welfare, detail: welfare >= 75 ? 'Сытость и жажда в приемлемом диапазоне.' : 'Проверьте потребности и индивидуальные показатели слоних.', color: '#4fba83' },
          { label: 'Чистота и водоснабжение', value: hygiene, detail: waterTrough.isClean && waterTrough.level >= 50 ? 'Оценены уборка, чистота чаши и запас воды.' : 'Поилка загрязнена или уровень воды низкий; уборку стоит улучшить.', color: '#58b8e8' },
          { label: 'Медицинский уход и журнал', value: medical, detail: medical >= 70 ? 'Плановые осмотры, процедуры и передача журнала учтены.' : 'Не все плановые осмотры, процедуры или передача журнала завершены.', color: '#b59ae9' },
          { label: 'Выполнение регламента', value: schedule, detail: schedule >= 70 ? 'Большинство задач выполнено, значимые этапы не сорваны.' : 'Есть незавершенные задачи или заметные задержки по расписанию.', color: '#e6b85c' }
        ];
      }

        const summaryRows = [
          { label: 'Убрано навоза', val: `${Math.round(stats.manureCleanedKg)} кг` },
          { label: 'Раздано порций корма', val: `${stats.foodDelivered}` },
          { label: 'Успешно собрано проб', val: `${stats.urineSamplesCollected} (пропущено ${stats.missedUrineSamples})` },
          { label: 'Проведено расчисток стоп', val: `${stats.pedicuresDone} (пропущено ${stats.missedPedicures})` },
          { label: 'Записано осмотров', val: `${stats.inspectionsDone}` },
          { label: 'Задач смены выполнено', val: `${shiftTaskDefinitions.filter(t => taskComplete(t.id)).length}/${shiftTaskDefinitions.length}` }
        ];
        summaryRows.forEach((r, i) => {
          const y = 105 + i * 20;
          ctx.fillStyle = '#cbbda6'; ctx.fillText(r.label, 150, y);
          ctx.textAlign = 'right'; ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 12px monospace'; ctx.fillText(r.val, 850, y);
          ctx.textAlign = 'left'; ctx.font = '12px "Segoe UI", sans-serif';
        });

        const assessment = calculateShiftAssessment();
        ctx.fillStyle = '#e8d8b8'; ctx.font = 'bold 13px monospace'; ctx.fillText('ОЦЕНКА ПО ЧЕТЫРЕМ НАПРАВЛЕНИЯМ', 150, 238);
        assessment.forEach((a, i) => {
          const y = 258 + i * 52;
          ctx.fillStyle = '#d6cbb8'; ctx.font = 'bold 12px "Segoe UI", sans-serif'; ctx.fillText(a.label, 150, y);
          ctx.fillStyle = '#3d3329'; ctx.fillRect(150, y + 8, 360, 10);
          ctx.fillStyle = a.color; ctx.fillRect(150, y + 8, 360 * a.value / 100, 10);
          ctx.fillStyle = '#f5eedb'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'right'; ctx.fillText(`${a.value}/100`, 520, y + 17);
          ctx.textAlign = 'left'; ctx.fillStyle = '#c0b6a4'; ctx.font = '10px "Segoe UI", sans-serif';
          ctx.fillText(a.detail, 535, y + 7, 315);
        });

        const overall = Math.round(assessment.reduce((sum, a) => sum + a.value, 0) / assessment.length);
        const grade = overall >= 88 ? 'S' : (overall >= 75 ? 'A' : (overall >= 58 ? 'B' : (overall >= 40 ? 'C' : 'D')));
        const medalTitle = overall >= 88 ? 'Образцовая смена' : (overall >= 75 ? 'Квалифицированный дежурный' : (overall >= 58 ? 'Добросовестная работа' : (overall >= 40 ? 'Есть важные упущения' : 'Смена требует разбора')));
        ctx.fillStyle = '#18120e'; ctx.fillRect(150, 485, 700, 67);
        ctx.strokeStyle = overall >= 75 ? '#d4af37' : '#8d7659'; ctx.lineWidth = 2; ctx.strokeRect(150, 485, 700, 67);
        ctx.textAlign = 'center'; ctx.fillStyle = overall >= 75 ? '#f1c40f' : '#d6b589'; ctx.font = 'bold 40px monospace'; ctx.fillText(grade, 200, 531);
        ctx.textAlign = 'left'; ctx.fillStyle = '#f5eedb'; ctx.font = 'bold 18px "Segoe UI", sans-serif'; ctx.fillText(medalTitle, 245, 513);
        ctx.fillStyle = '#d6cbb8'; ctx.font = '12px monospace'; ctx.fillText(`Итог: ${overall}/100 · игровые очки: ${stats.totalScore}`, 245, 536);

        const recommendations = [];
        if (assessment[0].value < 70) recommendations.push('проверьте сытость и жажду всех слоних');
        if (assessment[1].value < 70) recommendations.push('улучшите уборку и обслуживание поилки');
        if (assessment[2].value < 70) recommendations.push('завершите процедуры и передачу журнала');
        if (assessment[3].value < 70) recommendations.push('сверяйтесь с планшетом в каждой фазе смены');
        ctx.fillStyle = '#e5d7bd'; ctx.font = '11px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(recommendations.length ? `Рекомендация: ${recommendations.join('; ')}.` : 'Все ключевые направления работы на хорошем уровне.', 500, 573, 690);

        ctx.fillStyle = '#27ae60'; ctx.fillRect(360, 595, 280, 42);
        ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 2; ctx.strokeRect(360, 595, 280, 42);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px "Segoe UI", sans-serif';
        ctx.fillText('НАЧАТЬ НОВУЮ СМЕНУ [SPACE]', 500, 621);
        ctx.textAlign = 'left';
      }

      // ==========================================
      // 8. ЗАПУСК ИГРОВОГО ЦИКЛА
      // ==========================================
      function gameLoop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;

        update(dt);
        render();

        requestAnimationFrame(gameLoop);
      }

      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
