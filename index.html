            el.statusText = 'Обходит грязную зону вольера';
          } else if (ev.type === 'tool_misplaced') {
            el.statusText = 'Разглядывает ведро на проходе';
            misplacedTool = { active: true, x: 490, y: 320, name: 'Лабораторное ведро' };
          } else if (ev.type === 'scattered_hay') {
            el.statusText = 'Ковыряется в сене у кормушки';
            scatteredHay = { active: true, x: 740, y: 310, kg: 8 };
          } else if (ev.type === 'feeder_crust') {
            el.statusText = 'Принюхивается к засохшей кормушке';
            feederCrust = { active: true, feederId: 'audrey', progress: 0 };
          } else if (ev.type === 'vet_followup_check') {
            el.statusText = 'Ждёт повторного осмотра [F]';
          }
        }

        addLog(`⚡ [Событие смены] ${ev.title}: ${ev.desc}`);
        showToast(`⚡ Ситуация: «${ev.title}»! Подробности в планшете [Tab]`, '#f39c12');
      }

      function checkAndTriggerSituationalEvents(dt) {
        if (eventCooldownTimer > 0) {
          eventCooldownTimer -= dt;
          return;
        }

        if (activeSituationalEvent && activeSituationalEvent.status === 'active') {
          return;
        }

        const curH = gameTime.hour + gameTime.minute / 60;

        // 1. Событие: «Забытый/смещённый инвентарь на проходе вольера» (08:35 - 10:45)
        if (curH >= 8.55 && curH < 10.75 && !situationalEvents.some(e => e.type === 'tool_misplaced')) {
          startSituationalEvent({
            id: 'event_tool_misplaced_' + Math.floor(curH),
            type: 'tool_misplaced',
            title: 'Смещённый инвентарь на проходе',
            desc: 'Лабораторное ведро забыто на полу в вольере. Верните его на стойку [Space/E] или завершите срочные дела.',
            elephantId: 'margo',
            startHour: curH,
            expireHour: curH + 2.2,
            status: 'active',
            noticed: false,
            actionDone: false,
            followUpReady: false,
            followUpDone: false,
            pointsAwarded: 0
          });
          eventCooldownTimer = 75;
          return;
        }

        // 2. Событие: «Низкий уровень воды и жажда Одри» (09:15 - 12:00)
        if (curH >= 9.25 && curH < 12.0 && !situationalEvents.some(e => e.type === 'trough_low_thirst')) {
          if (waterTrough.water < 45) {
            startSituationalEvent({
              id: 'event_trough_' + Math.floor(curH),
              type: 'trough_low_thirst',
              title: 'Низкий уровень воды в поилке',
              desc: 'Одри томится у автопоилки: уровень воды упал ниже 45%. Требуется долив из крана.',
              elephantId: 'audrey',
              startHour: curH,
              expireHour: curH + 2.2,
              status: 'active',
              noticed: false,
              actionDone: false,
              followUpReady: false,
              followUpDone: false,
              pointsAwarded: 0
            });
            eventCooldownTimer = 75;
            return;
          }
        }

        // 3. Событие: «Рассыпанный фураж у кормушки Претти» (10:15 - 13:00)
        if (curH >= 10.25 && curH < 13.0 && !situationalEvents.some(e => e.type === 'scattered_hay')) {
          startSituationalEvent({
            id: 'event_scattered_hay_' + Math.floor(curH),
            type: 'scattered_hay',
            title: 'Рассыпанный фураж у кормушки',
            desc: 'Претти вытащила пучок сена из кормушки на настил вольера. Соберите его лопатой/руками [Space/E].',
            elephantId: 'pretty',
            startHour: curH,
            expireHour: curH + 2.2,
            status: 'active',
            noticed: false,
            actionDone: false,
            followUpReady: false,
            followUpDone: false,
            pointsAwarded: 0
          });
          eventCooldownTimer = 75;
          return;
        }

        // 4. Событие: «Снижение активности и аппетита Претти» (11:30 - 15:00)
        if (curH >= 11.5 && curH < 15.0 && !situationalEvents.some(e => e.type === 'pretty_low_activity')) {
          const pretty = elephants.find(e => e.id === 'pretty');
          if (pretty && (pretty.state === 'REST' || pretty.energy < 75)) {
            startSituationalEvent({
              id: 'event_pretty_activity_' + Math.floor(curH),
              type: 'pretty_low_activity',
              title: 'Снижение тонуса и аппетита Претти',
              desc: 'Претти долго отдыхает в углу вольера и пропускает кормление. Требуется осмотр [F] и порция каши.',
              elephantId: 'pretty',
              startHour: curH,
              expireHour: curH + 2.5,
              status: 'active',
              noticed: false,
              actionDone: false,
              followUpReady: false,
              followUpDone: false,
              pointsAwarded: 0
            });
            eventCooldownTimer = 80;
            return;
          }
        }

        // 5. Событие: «Очистка бортика кормушки от засохшей каши» (13:15 - 16:15)
        if (curH >= 13.25 && curH < 16.25 && !situationalEvents.some(e => e.type === 'feeder_crust')) {
          startSituationalEvent({
            id: 'event_feeder_crust_' + Math.floor(curH),
            type: 'feeder_crust',
            title: 'Очистка бортика кормушки',
            desc: 'На бортике кормушки Одри засохли остатки влажной каши. Проведите зачистку [удерживать Space/E].',
            elephantId: 'audrey',
            startHour: curH,
            expireHour: curH + 2.2,
            status: 'active',
            noticed: false,
            actionDone: false,
            followUpReady: false,
            followUpDone: false,
            pointsAwarded: 0
          });
          eventCooldownTimer = 75;
          return;
        }

        // 6. Событие: «Марго меняет планы и отвлеклась от корма» (14:30 - 17:30)
        if (curH >= 14.5 && curH < 17.5 && !situationalEvents.some(e => e.type === 'margo_distracted')) {
          startSituationalEvent({
            id: 'event_margo_distracted_' + Math.floor(curH),
            type: 'margo_distracted',
            title: 'Марго отвлеклась от кормления',
            desc: 'Марго передумала идти к кормушке, чешет бок о брус и пропускает рацион. Рекомендуется проверить или поднести сено.',
            elephantId: 'margo',
            startHour: curH,
            expireHour: curH + 2.0,
            status: 'active',
            noticed: false,
            actionDone: false,
            followUpReady: false,
            followUpDone: false,
            pointsAwarded: 0
          });
          eventCooldownTimer = 75;
          return;
        }

        // 7. Событие: «Повторный ветеринарный контроль состояния» (15:30 - 18:00)
        if (curH >= 15.5 && curH < 18.0 && !situationalEvents.some(e => e.type === 'vet_followup_check')) {
          startSituationalEvent({
            id: 'event_vet_followup_' + Math.floor(curH),
            type: 'vet_followup_check',
            title: 'Повторный клинический контроль',
            desc: 'Ветеринарная служба запросила повторный осмотр [F] дыхания и стоп Марго после дневной активности.',
            elephantId: 'margo',
            startHour: curH,
            expireHour: curH + 2.2,
            status: 'active',
            noticed: false,
            actionDone: false,
            followUpReady: false,
            followUpDone: false,
            pointsAwarded: 0
          });
          eventCooldownTimer = 80;
          return;
        }

        // 8. Событие: «Одри обнаружила загрязнение зоны отдыха» (17:00 - 19:30)
        if (curH >= 17.0 && curH < 19.5 && !situationalEvents.some(e => e.type === 'sanitation_cluster')) {
          if (dungPiles.length >= 2) {
            startSituationalEvent({
              id: 'event_sanitation_' + Math.floor(curH),
              type: 'sanitation_cluster',
              title: 'Загрязнение зоны отдыха вольера',
              desc: 'Одри настороженно обходит скопление навоза. Требуется санитарная уборка перед сдачей смены.',
              elephantId: 'audrey',
              startHour: curH,
              expireHour: curH + 2.0,
              status: 'active',
              noticed: false,
              actionDone: false,
              followUpReady: false,
              followUpDone: false,
              pointsAwarded: 0
            });
            eventCooldownTimer = 85;
            return;
          }
        }
      }

      function updateSituationalEvents(dt) {
        checkAndTriggerSituationalEvents(dt);

        if (!activeSituationalEvent || activeSituationalEvent.status !== 'active') return;

        const ev = activeSituationalEvent;
        const curH = gameTime.hour + gameTime.minute / 60;
        const el = elephants.find(e => e.id === ev.elephantId);

        // 1. Проверка обнаружения кипером (Notice)
        if (!ev.noticed) {
          let keeperIsClose = false;
          if (el) {
            keeperIsClose = Math.hypot(player.x - el.x, player.y - el.y) < el.radius + 60;
          }
          if (ev.type === 'trough_low_thirst') {
            keeperIsClose = keeperIsClose || Math.hypot(player.x - waterTrough.valveX, player.y - waterTrough.valveY) < 70;
          } else if (ev.type === 'tool_misplaced' && misplacedTool) {
            keeperIsClose = keeperIsClose || Math.hypot(player.x - misplacedTool.x, player.y - misplacedTool.y) < 65;
          } else if (ev.type === 'scattered_hay' && scatteredHay) {
            keeperIsClose = keeperIsClose || Math.hypot(player.x - scatteredHay.x, player.y - scatteredHay.y) < 65;
          } else if (ev.type === 'feeder_crust') {
            const f = feeders.find(fd => fd.id === 'audrey');
            if (f) keeperIsClose = keeperIsClose || Math.hypot(player.x - (f.x + f.w / 2), player.y - (f.y + f.h / 2)) < 70;
          }

          if (keeperIsClose || (inspectingElephant && inspectingElephant.id === ev.elephantId)) {
            ev.noticed = true;
            stats.situationalEventsNoticed++;
            stats.totalScore += 15;
            ev.pointsAwarded += 15;
            sfx.playSuccess();
            showToast(`👁️ Ситуация «${ev.title}» замечена кипером! (+15 очк.)`, '#3498db');
            addLog(`Кипер обратил внимание на ситуацию: «${ev.title}». Требуется действие.`);
          }
        }

        // 2. Проверка действия кипера (Action Done)
        if (!ev.actionDone) {
          if (ev.type === 'trough_low_thirst') {
            if (waterTrough.water >= 70) {
              ev.actionDone = true;
              ev.followUpReady = true;
              stats.totalScore += 25;
              ev.pointsAwarded += 25;
              sfx.playSuccess();
              if (el) {
                el.statusText = 'С удовольствием пьет чистую воду';
                el.thirst = Math.max(0, el.thirst - 30);
              }
              showToast(`💧 Поилка наполнена! Проведите контрольную проверку [F] (+25 очк.)`, '#2ecc71');
              addLog(`Водный баланс восстановлен. Одри утоляет жажду. Доступна контрольная проверка.`);
            }
          } else if (ev.type === 'pretty_low_activity') {
            const myFeeder = feeders.find(f => f.id === 'pretty');
            const hasObservation = el && el.observations.some(obs => obs.hourRecorded === Math.floor(curH) && (obs.category === 'Тонус и активность' || obs.category === 'Аппетит и питание'));
            const hasFood = myFeeder && myFeeder.food >= 25;

            if (hasObservation || hasFood) {
              ev.actionDone = true;
              ev.followUpReady = true;
              stats.totalScore += 25;
              ev.pointsAwarded += 25;
              sfx.playSuccess();
              if (el) {
                el.energy = Math.min(100, el.energy + 20);
                el.statusText = 'Тонус восстановился, готова к корму';
              }
              showToast(`🥕 Претти получила внимание! Проведите контрольную проверку [F] (+25 очк.)`, '#2ecc71');
              addLog(`Кипер оказал внимание Претти. Состояние нормализовалось. Проведите повторный осмотр.`);
            }
          } else if (ev.type === 'margo_distracted') {
            const mFeeder = feeders.find(f => f.id === 'margo');
            const hasFood = mFeeder && mFeeder.food >= 25;
            const dist = el ? Math.hypot(player.x - el.x, player.y - el.y) : 999;

            if (hasFood || (dist < el.radius + 45 && (keys['Space'] || virtualKeys.action))) {
              ev.actionDone = true;
              ev.followUpReady = true;
              stats.totalScore += 20;
              ev.pointsAwarded += 20;
              sfx.playSuccess();
              if (el) {
                el.statusText = 'Охотно направляется к кормушке';
                el.targetX = mFeeder ? mFeeder.x + mFeeder.w / 2 : el.x;
                el.targetY = mFeeder ? mFeeder.y + 70 : el.y;
                el.state = 'WANDER';
              }
              showToast(`🌾 Марго вернулась к кормушке! Проведите контрольную проверку [F] (+20 очк.)`, '#2ecc71');
              addLog(`Марго вернулась к кормлению. Проведите контрольный осмотр.`);
            }
          } else if (ev.type === 'sanitation_cluster') {
            if (dungPiles.length <= 1) {
              ev.actionDone = true;
              ev.followUpReady = true;
              stats.totalScore += 25;
              ev.pointsAwarded += 25;
              sfx.playSuccess();
              if (el) {
                el.statusText = 'Спокойно обходит чистый вольер';
              }
              showToast(`🧹 Сектор очищен! Проведите контрольную проверку вольера (+25 очк.)`, '#2ecc71');
              addLog(`Загрязнение устранено. Одри свободно гуляет по вольеру. Доступна контрольная проверка.`);
            }
          } else if (ev.type === 'tool_misplaced') {
            if (!misplacedTool || !misplacedTool.active) {
              ev.actionDone = true;
              ev.followUpReady = true;
              if (el) el.statusText = 'Свободно гуляет по чистому проходу';
            }
          } else if (ev.type === 'scattered_hay') {
            if (!scatteredHay || !scatteredHay.active) {
              ev.actionDone = true;
              ev.followUpReady = true;
              if (el) el.statusText = 'Спокойно жуёт сено из кормушки';
            }
          } else if (ev.type === 'feeder_crust') {
            if (!feederCrust || !feederCrust.active) {
              ev.actionDone = true;
              ev.followUpReady = true;
              if (el) el.statusText = 'С аппетитом ест из чистой кормушки';
            }
          } else if (ev.type === 'vet_followup_check') {
            const hasFollowupObs = el && el.observations.some(obs => obs.hourRecorded === Math.floor(curH));
            if (hasFollowupObs) {
              ev.actionDone = true;
              ev.followUpReady = true;
              stats.totalScore += 25;
              ev.pointsAwarded += 25;
              sfx.playSuccess();
              if (el) el.statusText = 'Повторный осмотр завершен, стабильна';
              showToast(`📝 Повторный осмотр зафиксирован! Проведите контроль [F] (+25 очк.)`, '#2ecc71');
              addLog(`Повторный ветеринарный контроль ${el.name} успешно внесен в карту.`);
            }
          }
        }

        // 3. Проверка дедлайна ситуации (с защитой от вечной блокировки активного события)
        if (curH >= ev.expireHour) {
          if (!ev.actionDone) {
            ev.status = 'expired';
            activeSituationalEvent = null;
            if (misplacedTool && misplacedTool.active) misplacedTool.active = false;
            if (scatteredHay && scatteredHay.active) scatteredHay.active = false;
            if (feederCrust && feederCrust.active) feederCrust.active = false;
            addLog(`⚠️ Время реакции на ситуацию «${ev.title}» истекло. Животные справились своими силами.`);
            if (el) {
              el.statusText = 'Осматривается';
              if (ev.type === 'trough_low_thirst') el.thirst = Math.min(100, el.thirst + 20);
              if (ev.type === 'pretty_low_activity') el.energy = Math.max(15, el.energy - 15);
            }
          } else if (!ev.followUpDone) {
            // Первичное действие выполнено успешно, автозакрытие при переходе к следующему этапу дня
            ev.status = 'resolved';
            activeSituationalEvent = null;
            addLog(`Ситуация «${ev.title}» завершена по истечении времени окна.`);
          }
        }
      }

      function completeSituationalEventFollowUp(ev) {
        if (!ev || ev.followUpDone || !ev.followUpReady) return;

        ev.followUpDone = true;
        ev.status = 'resolved';
        stats.situationalEventsResolved++;
        stats.followUpChecksDone++;

        const bonusScore = 25;
        stats.totalScore += bonusScore;
        ev.pointsAwarded += bonusScore;

        const timeStr = `${String(gameTime.hour).padStart(2, '0')}:${String(Math.floor(gameTime.minute)).padStart(2, '0')}`;
        const el = elephants.find(e => e.id === ev.elephantId);
        if (el) {
          el.observations.unshift({
            time: timeStr,
            hourRecorded: gameTime.hour,
            category: 'Контроль ситуации',
            text: `Контрольная проверка успешна: ситуация «${ev.title}» полностью разрешена`,
            keeper: 'Дежурный кипер',
            ok: true,
            snapshot: {
              time: timeStr,
              satiety: Math.round(el.satiety),
              thirst: Math.round(el.thirst),
              energy: Math.round(el.energy)
            }
          });
          if (el.observations.length > 6) el.observations.pop();
          el.statusText = 'Состояние стабильное, ухожена';
        }

        sfx.playSuccess();
        showToast(`🔍 Контрольная проверка завершена! Ситуация закрыта (+${bonusScore} очк.)`, '#2ecc71');
        addLog(`[Контроль] Ситуация «${ev.title}» успешно закрыта и занесена в протокол (+${bonusScore} очков).`);
        activeSituationalEvent = null;
      }

      // Категории клинических наблюдений дежурного кипера за слонихой (Этап 05–10)
      function getElephantObservationOptions(el) {
        if (!el) return [];
        const isEventActive = activeSituationalEvent && activeSituationalEvent.status === 'active' && activeSituationalEvent.elephantId === el.id;
        const ev = isEventActive ? activeSituationalEvent : null;

        let behaviorText = 'Штатное, уравновешенное; естественные позы, активный контакт с кипером';
        if (ev && ev.type === 'trough_low_thirst') {
          behaviorText = ev.actionDone ? 'Водный баланс в норме: слониха напилась свежей воды, спокойна' : 'Повышенная жажда: слониха томится у пустой автопоилки';
        } else if (ev && ev.type === 'margo_distracted') {
          behaviorText = ev.actionDone ? 'Поведение штатное: вернулась к привычному кормлению' : 'Отвлеклась на почесывание о брусья ограды, пропустила подход к корму';
        } else if (ev && ev.type === 'tool_misplaced') {
          behaviorText = ev.actionDone ? 'Проход вольера свободен: инвентарь убран, движение раскованное' : 'С любопытством разглядывает постороннее ведро на проходе вольера';
        } else if (ev && ev.type === 'vet_followup_check') {
          behaviorText = ev.actionDone ? 'Контрольный осмотр подтвержден: дыхание ровное, реакции адекватные' : 'Повторный ветеринарный контроль: спокойный контакт, симптомов нет';
        } else if (el.id === 'audrey' && el.state === 'WANDER') {
          behaviorText = 'Исследовательский интерес: матриарх изучает предметы обогащения и порядок в вольере';
        } else if (el.id === 'margo' && (el.state === 'IDLE' || el.statusText.includes('чешет'))) {
          behaviorText = 'Переменчивое внимание: периодически отвлекается на окружающие звуки и чешет бок';
        } else if (el.id === 'pretty' && (el.state === 'REST' || el.energy < 55)) {
          behaviorText = 'Склонность к покою: глубокий длительный отдых на мягком настиле, сохранение сил';
        } else if (el.state === 'REST') {
          behaviorText = 'Спокойное, глубокий физиологический отдых; дыхание мерное, стресс отсутствует';
        } else if (el.state === 'EAT') {
          behaviorText = 'Естественное кормовое поведение; спокойно поедает рацион, контактная и дружелюбная';
        } else if (el.thirst > 60) {
          behaviorText = 'Повышенная настороженность и беспокойство: частый поиск воды у автопоилки';
        }

        let appetiteText = el.satiety < 40
          ? `Аппетит снижен: уровень сытости ${Math.round(el.satiety)}%, кормушка пустует, требуется раздача корма`
          : `Аппетит отличный: сытость ${Math.round(el.satiety)}%, охотно поедает предложенные сено и кашу`;
        if (el.id === 'pretty' && el.satiety < 55) {
          appetiteText = `Аппетит умеренный (${Math.round(el.satiety)}%): чутка к свежести корма, ожидает теплую кашу и морковь`;
        }
        if (ev && ev.type === 'pretty_low_activity') {
          appetiteText = ev.actionDone ? 'Аппетит сохранен: охотно принимает предложенную кашу и морковь' : 'Аппетит вялый: требуется свежая раздача и контроль поедаемости корма';
        } else if (ev && ev.type === 'scattered_hay') {
          appetiteText = ev.actionDone ? 'Кормовая зона в порядке: сено в кормушке, рацион усваивается' : 'Игривое кормовое поведение: вытаскивает сено из кормушки на настил';
        } else if (ev && ev.type === 'feeder_crust') {
          appetiteText = ev.actionDone ? 'Гигиена кормления соблюдена: бортик кормушки очищен от засохшей каши' : 'Осторожничает у кормушки: требуется санитарная очистка бортика';
        }

        return [
          {
            category: 'Поведение и покой',
            text: behaviorText,
            ok: el.thirst <= 60 && (!ev || (ev.type !== 'trough_low_thirst' && ev.type !== 'tool_misplaced') || ev.actionDone)
          },
          {
            category: 'Аппетит и питание',
            text: appetiteText,
            ok: el.satiety >= 40 && (!ev || (ev.type !== 'pretty_low_activity' && ev.type !== 'scattered_hay' && ev.type !== 'feeder_crust') || ev.actionDone)
          },
          {
            category: 'Опора и стопы',
            text: ev && ev.type === 'sanitation_cluster'
              ? (ev.actionDone ? 'Чистый настил: сектор прибран, походка уверенная, опора на 4 конечности' : 'Осторожная поступь: избегает наступать на загрязненный участок настила')
              : (el.pedicureDone
                ? 'Стопы в отличном состоянии: ногти и подошвы расчищены, трещин и наминов нет'
                : (el.isWantingPedicure
                  ? 'Осторожное наступание: отросли роговые пластины ногтей, показана плановая расчистка'
                  : 'Походка ровная, опора на все 4 конечности, подошвенный слой без признаков деформаций')),
            ok: !el.isWantingPedicure || el.pedicureDone
          },
          {
            category: 'Глаза, уши и хобот',
            text: el.age >= 40
              ? 'Возрастные особенности: умеренное слезоотделение, ушные раковины эластичные, хобот влажный'
              : 'Взгляд ясный, роговица чистая, дыхание ровное, хобот подвижный без повреждений',
            ok: true
          },
          {
            category: 'Тонус и активность',
            text: ev && ev.type === 'pretty_low_activity'
              ? (ev.actionDone ? 'Тонус нормализовался: животное поднялось и реагирует на кипера' : 'Сниженная активность: долгий отдых в углу, замедленные реакции')
              : (el.energy < 35
                ? `Сниженная активность: бодрость ${Math.round(el.energy)}%, преобладает статический отдых`
                : `Тонус высокий: бодрость ${Math.round(el.energy)}%, энергично исследует вольер и окружение`),
            ok: el.energy >= 35 && (!ev || ev.type !== 'pretty_low_activity' || ev.actionDone)
          }
        ];
      }

      // Фиксация наблюдения в журнал
      function recordObservationForElephant(el) {
        if (!el) return;
        const timeStr = `${String(gameTime.hour).padStart(2, '0')}:${String(Math.floor(gameTime.minute)).padStart(2, '0')}`;
        const options = getElephantObservationOptions(el);
        const catIdx = el.selectedObsCategory || 0;
        const selected = options[catIdx] || options[0];

        // Защита от дубликатов: не более одного наблюдения той же категории в текущий час
        const alreadyDoneThisHour = el.observations.some(obs => obs.category === selected.category && obs.hourRecorded === gameTime.hour);
        if (alreadyDoneThisHour) {
          showToast(`⚠️ Наблюдение «${selected.category}» для ${el.name} уже внесено в этом часу!`, '#f39c12');
          sfx.playAlert();
          return;
        }

        const record = {
          time: timeStr,
          hourRecorded: gameTime.hour,
          category: selected.category,
          text: selected.text,
          keeper: 'Дежурный кипер',
          ok: selected.ok,
          snapshot: {
            time: timeStr,
            satiety: Math.round(el.satiety),
            thirst: Math.round(el.thirst),
            energy: Math.round(el.energy)
          }
        };

        el.observations.unshift(record);
        if (el.observations.length > 6) el.observations.pop();

        el.lastInspectionSnapshot = record.snapshot;
        el.lastInspected = timeStr;
        stats.observationsRecorded = (stats.observationsRecorded || 0) + 1;

        // Фиксация наблюдения поощряется очками за бдительность (+25 очков)
        const bonusPoints = 25;
        stats.totalScore += bonusPoints;

        sfx.playSuccess();
        showToast(`📝 Наблюдение «${selected.category}» занесено в журнал (+${bonusPoints} очк.)`, '#2ecc71');
        addLog(`[Журнал кипера · ${el.name}] ${selected.category}: ${selected.text}. (+${bonusPoints} очков).`);
      }

      // Выполнение процедуры педикюра (расчистки стоп)
      function performPedicureProcedure(el) {
        if (!el) return;
        if (el.pedicureDone) {
          showToast(`ℹ️ Стопы слонихи ${el.name} уже расчищены, повторный уход не требуется.`, '#3498db');
          return;
        }
        if (player.carrying !== 'none') {
          showToast('⚠️ Сначала освободите руки от переносимого инвентаря на стойке!', '#e67e22');
          sfx.playAlert();
          return;
        }
        if (el.state === 'REST') {
          showToast(`⚠️ Слониха ${el.name} сейчас спит! Не тревожьте животное во время глубокого отдыха.`, '#f39c12');
          sfx.playAlert();
          return;
        }

        const timeStr = `${String(gameTime.hour).padStart(2, '0')}:${String(Math.floor(gameTime.minute)).padStart(2, '0')}`;
        el.pedicureDone = true;
        el.isWantingPedicure = false;
        el.feetStatus = 'Отлично (расчищены)';
        stats.pedicuresDone++;
        stats.totalScore += 80;
        sfx.playSuccess();

        el.observations.unshift({
          time: timeStr,
          hourRecorded: gameTime.hour,
          category: 'Процедура',
          text: 'Выполнена ветеринарная расчистка стоп и подошв (педикюр)',
          keeper: 'Дежурный кипер',
          ok: true,
          snapshot: {
            time: timeStr,
            satiety: Math.round(el.satiety),
            thirst: Math.round(el.thirst),
            energy: Math.round(el.energy)
          }
        });
        if (el.observations.length > 6) el.observations.pop();

        addLog(`💅 Проведен педикюр слонихе ${el.name}! Стопы обработаны. +80 очков.`);
        showToast(`💅 Педикюр для ${el.name} успешно завершён! (+80 очк.)`, '#2ecc71');
      }

      // Проверка осмотра слонихи (F)
      function tryInspectElephant() {
        if (gameState === 'INSPECTION_MODAL') {
          gameState = 'PLAYING';
          inspectingElephant = null;
          sfx.playSuccess();
          return;
        }
        if (gameState !== 'PLAYING') return;

        for (const el of elephants) {
          const dist = Math.hypot(player.x - el.x, player.y - el.y);
          if (dist < el.radius + 45) {
            inspectingElephant = el;
            gameState = 'INSPECTION_MODAL';
            const curPh = getCurrentPhase();
            const timeStr = `${String(gameTime.hour).padStart(2, '0')}:${String(Math.floor(gameTime.minute)).padStart(2, '0')}`;
            el.lastInspected = timeStr;

            // Реакция на повторный осмотр после зафиксированного наблюдения (Этап 10)
            if (el.observations && el.observations.length > 0) {
              if (el.id === 'audrey') el.statusText = 'Спокойно воспринимает повторный осмотр кипера';
              else if (el.id === 'margo') el.statusText = 'Узнала кипера, дружелюбно тянется хоботом';
              else if (el.id === 'pretty') el.statusText = 'Доверчиво воспринимает контрольный осмотр';
            }

            // Начисление очков только один раз за фазу дня для этой слонихи (защита от спама)
            if (el.inspectedInPhase !== curPh.id) {
              el.inspectedInPhase = curPh.id;
              stats.inspectionsDone++;
              stats.totalScore += 30;
              sfx.playSuccess();
              addLog(`Проведен ветеринарный осмотр слонихи ${el.name} (${curPh.title.split(' · ')[1] || 'Смена'}). +30 очков.`);
            } else {
              sfx.playSuccess();
            }
            return;
          }
        }
      }

      // Запуск ловли анализа (QTE)
      function triggerUrineEvent(elephant) {
        elephant.isWantingPee = true;
        // ЭТАП 27: окно реакции зависит от наполнения мочевого пузыря (60..22 сек):
        // чем сильнее позыв, тем меньше времени на подготовку ведра.
        const fillFrac = Math.max(0, Math.min(1, (elephant.bladder - 55) / 45));
        elephant.peeUrgencyTimer = Math.round(60 - 38 * fillFrac);
        sfx.playAlert();
        addLog(`⚠️ Внимание! ${elephant.name} хочет в туалет! Подбегите с ведром для анализа!`);
      }

      function startUrineQTE(elephant) {
        gameState = 'QTE_URINE';
        qteState.active = true;
        qteState.elephant = elephant;
        qteState.sliderPos = 10;
        qteState.sliderDir = 1;
        qteState.result = null;
        clearUrineQtEResultTimeout(); // на случай повторного запуска — старый отложенный таймер не нужен
        qteState.endTimer = 0; // экран результата ещё не показывается
        qteState.returnState = 'PLAYING'; // QTE запускается только из режима игры
        sfx.playAlert();
      }

      // Завершение мини-игры: возврат в то состояние, куда игрок перешёл после показа результата
      function closeUrineQTE() {
        clearUrineQtEResultTimeout(); // экран результата закрывается — отложенный таймер больше не нужен
        const targetState = ['PAUSED', 'SHIFT_TABLET', 'INSPECTION_MODAL', 'TITLE', 'SHIFT_REPORT'].includes(qteState.returnState)
          ? qteState.returnState
          : 'PLAYING';
        qteState.active = false;
        qteState.result = null;
        qteState.elephant = null;
        qteState.endTimer = 0;
        qteState.returnState = 'PLAYING';
        if (gameState === 'QTE_URINE') gameState = targetState;
      }

      function finishUrineQTE() {
        if (!qteState.active || qteState.result !== null) return;
        const pos = qteState.sliderPos;
        const isPerfect = pos >= qteState.targetMin + 5 && pos <= qteState.targetMax - 5;
        const isGood = pos >= qteState.targetMin && pos <= qteState.targetMax;

        if (isPerfect) {
          qteState.result = 'perfect';
          stats.urineSamplesCollected++;
          stats.totalScore += 100;
          qteState.elephant.urineSampleDone = true;
          const timeStr = `${String(gameTime.hour).padStart(2, '0')}:${String(Math.floor(gameTime.minute)).padStart(2, '0')}`;
          const snap = {
            time: timeStr,
            satiety: Math.round(qteState.elephant.satiety),
            thirst: Math.round(qteState.elephant.thirst),
            energy: Math.round(qteState.elephant.energy)
          };
          qteState.elephant.observations.unshift({
            time: timeStr,
            hourRecorded: gameTime.hour,
            category: 'Процедура',
            text: 'Отобрана плановая проба мочи в лабораторию (чистая средняя фракция)',
            keeper: 'Дежурный кипер',
            ok: true,
            snapshot: snap
          });
          qteState.elephant.lastInspectionSnapshot = snap;
          if (qteState.elephant.observations.length > 6) qteState.elephant.observations.pop();
          sfx.playSplash();
          sfx.playSuccess();
          addLog(`✨ Идеально! Взята чистая проба мочи (${qteState.elephant.name}). +100 очков!`);
        } else if (isGood) {
          qteState.result = 'good';
          stats.urineSamplesCollected++;
          stats.totalScore += 50;
          qteState.elephant.urineSampleDone = true;
          const timeStr = `${String(gameTime.hour).padStart(2, '0')}:${String(Math.floor(gameTime.minute)).padStart(2, '0')}`;
          const snap = {
            time: timeStr,
            satiety: Math.round(qteState.elephant.satiety),
            thirst: Math.round(qteState.elephant.thirst),
            energy: Math.round(qteState.elephant.energy)
          };
          qteState.elephant.observations.unshift({
            time: timeStr,
            hourRecorded: gameTime.hour,
            category: 'Процедура',
            text: 'Отобрана проба мочи в лабораторное ведро для биохимического анализа',
            keeper: 'Дежурный кипер',
            ok: true,
            snapshot: snap
          });
          qteState.elephant.lastInspectionSnapshot = snap;
          if (qteState.elephant.observations.length > 6) qteState.elephant.observations.pop();
          sfx.playSplash();
          addLog(`👍 Проба мочи успешно собрана (${qteState.elephant.name}). +50 очков!`);
        } else {
          qteState.result = 'miss';
          addLog(`💦 Не успели точно подставить ведро для ${qteState.elephant.name}. Проба утеряна.`);
        }

        qteState.elephant.isWantingPee = false;
        qteState.elephant.peeUrgencyTimer = 0; // согласованный сброс таймера предупреждения (успех и промах)
        // ЭТАП 27: успешно собранная проба опорожняет мочевой пузырь; следующий
        // позыв рассчитывается из индивидуального темпа наполнения слонихи.
        qteState.elephant.bladder = 8;
        qteState.elephant.peeTimer = estimateNextPeeDelay(qteState.elephant);

        // Экран результата живёт на реальном времени (wall-clock), чтобы не зависать
        // при паузе/планшете/модалке. По истечении 1.1 сек он закрывается только если
        // игра вернулась в PLAYING; иначе — при следующем возврате в PLAYING (см. update())
        // или через closeUrineQTE() при рестарте смены. gameState здесь не меняется.
        qteState.endTimer = performance.now() + 1100;
        clearUrineQtEResultTimeout();
        urineQtEResultTimeoutId = setTimeout(() => {
          urineQtEResultTimeoutId = null;
          if (gameState === 'PLAYING') closeUrineQTE();
        }, 1100);
      }

      // ==========================================
      // 4. ГЛАВНЫЙ ИГРОВОЙ ЦИКЛ ОБНОВЛЕНИЯ
      // ==========================================
      let lastTime = performance.now();
      let stepSoundTimer = 0;
      let worldAnimTime = 0;

      function update(dt) {
        // При показе заставки «Поверните устройство» симуляция мира остановлена на паузу
        if (isRotateOverlayActive) return;

        // 0. Мини-игра на реакцию (ловля анализа мочи в ведро):
        // Работает только бегунок, мир, время смены и слонихи полностью заморожены
        if (gameState === 'QTE_URINE') {
          if (qteState.active && qteState.result === null) {
            qteState.sliderPos += qteState.sliderDir * qteState.speed * dt;
            if (qteState.sliderPos >= 96) {
              qteState.sliderPos = 96;
              qteState.sliderDir = -1;
            } else if (qteState.sliderPos <= 4) {
              qteState.sliderPos = 4;
              qteState.sliderDir = 1;
            }
          } else if (qteState.endTimer > 0 && performance.now() >= qteState.endTimer) {
            // Отсчёт показа результата идёт по реальному времени и не зависит от
            // игрового dt; при рестарте смены сбрасывается через closeUrineQTE()
            closeUrineQTE();
          }
          return;
        }

        // Экран результата мог быть прерван переходом в паузу/планшет/модалку/табель.
        // Если к моменту возврата в PLAYING отведённое время истекло — закрываем его сразу.
        if (qteState.active && qteState.result !== null && gameState === 'PLAYING') {
          closeUrineQTE();
        }

        // Если активна заставка поворота устройства на смартфоне, мир честно заморожен
        if (isRotateOverlayActive) return;

        // Централизованная пауза: при открытых модальных окнах, планшете, паузе,
        // титульном экране или итоговом табеле симуляция мира остановлена
        if (gameState !== 'PLAYING') return;

        worldAnimTime += dt;

        // 1. Обновление игрового времени (Неспешная смена ~8-10 минут: 1 минута игры = 0.8 сек реального времени)
        gameTime.secondAccum += dt;
        if (gameTime.secondAccum >= 0.8) {
          gameTime.secondAccum -= 0.8;
          gameTime.minute += 1;
          if (gameTime.minute >= 60) {
            gameTime.minute = 0;
            gameTime.hour += 1;

            // Ежечасный слоновий трубный рев
            if (gameTime.hour < 20) {
              sfx.playElephantTrumpet();
              addLog(`Часы слоновника: ${String(gameTime.hour).padStart(2, '0')}:00. Проверьте кормушки и чистоту.`);
            }
          }


          // Завершение смены в 20:00
          if (gameTime.hour >= 20 && !gameTime.isShiftEnded) {
            gameTime.isShiftEnded = true;
            gameState = 'SHIFT_REPORT';
            sfx.playSuccess();
            sfx.playElephantTrumpet();
            return;
          }
        }

        // Обновление всплывающего уведомления и проверка задач смены
        if (notificationToast.timer > 0) {
          notificationToast.timer -= dt;
        }
        updateShiftTasks();
        updateSituationalEvents(dt);

        // 2. Управление движением кипера (Клавиатура WASD/Стрелки + Сенсорный стик)
        let moveX = 0;
        let moveY = 0;
        if (keys['KeyW'] || keys['ArrowUp'] || virtualKeys.up) moveY -= 1;
        if (keys['KeyS'] || keys['ArrowDown'] || virtualKeys.down) moveY += 1;
        if (keys['KeyA'] || keys['ArrowLeft'] || virtualKeys.left) moveX -= 1;
        if (keys['KeyD'] || keys['ArrowRight'] || virtualKeys.right) moveX += 1;

        if (moveX !== 0 && moveY !== 0) {
          // Нормализация вектора при диагонали
          moveX *= 0.7071;
          moveY *= 0.7071;
        }

        player.isMoving = moveX !== 0 || moveY !== 0;

        if (player.isMoving) {
          if (Math.abs(moveX) > Math.abs(moveY)) {
            player.dir = moveX > 0 ? 'right' : 'left';
          } else {
            player.dir = moveY > 0 ? 'down' : 'up';
          }

          player.walkAnim += dt * 8;
          stepSoundTimer += dt;
          if (stepSoundTimer > 0.3) {
            sfx.playStep();
            stepSoundTimer = 0;
          }

          // Скольжение по осям X и Y строго с учетом dt (player.speed в px/сек)
          const moveDist = player.speed * dt;
          const newX = player.x + moveX * moveDist;
          if (!checkCollision(newX, player.y, player.radius)) {
            player.x = newX;
          }

          const newY = player.y + moveY * moveDist;
          if (!checkCollision(player.x, newY, player.radius)) {
            player.y = newY;
          }

          // Этап 26: если шаг всё же привёл к перекрытию со слоном (например, слон
          // одновременно подошёл навстречу), немедленно корректируем позицию.
          resolveKeeperCollisions();
        } else {
          player.walkAnim = 0;
          // Этап 26: выталкивание при стоянии на месте — защита от застревания,
          // когда слон сам наступил на персонажа (управление не блокируется).
          resolveKeeperCollisions();
        }

        // Этап 26: если во время копания лопатой или педикюра слон вошёл в персонажа,
        // разблокируем действие после выталкивания — иначе игрок «застревает» в анимации.
        if ((player.isShoveling || player.isDoingPedicure) && checkCollision(player.x, player.y, player.radius)) {
          resolveKeeperCollisions();
          if (!checkCollision(player.x, player.y, player.radius)) {
            player.isShoveling = false;
            player.shovelProgress = 0;
            player.isDoingPedicure = false;
            player.pedicureProgress = 0;
          }
        }

        // 3. Взаимодействия игрока по клавишам Space / E / Сенсорной кнопке действия
        const actionDown = keys['Space'] || keys['KeyE'] || virtualKeys.action;
        // Флаг «нажатия» устанавливается в обработчике keydown/touchstart и гасится
        // здесь после обработки кадра — одно нажатие не срабатывает несколько раз.
        const actionPressed = player.actionQueued === true;
        const actionHeld = actionDown;
        player.actionQueued = false;

        if (player.fullBarrowAlertTimer > 0) player.fullBarrowAlertTimer -= dt;
        if (player.rackDebounceTimer > 0) player.rackDebounceTimer -= dt;
        if (player.forageDebounce > 0) player.forageDebounce -= dt;
        if (player.treatDebounceTimer > 0) player.treatDebounceTimer -= dt;
        if (player.washHintDebounce > 0) player.washHintDebounce -= dt;
        if (keeperState.washDebounceTimer > 0) keeperState.washDebounceTimer -= dt;

        // А) Уборка навоза лопатой в тачку с честной частичной загрузкой (лимит 60 кг)
        let nearPile = null;
        for (const pile of dungPiles) {
          const dist = Math.hypot(player.x - pile.x, player.y - pile.y);
          if (dist < 46) {
            nearPile = pile;
            break;
          }
        }

        // ЭТАП 28 FIX: уборка лопатой — НЕПРЕРЫВНОЕ действие. Прогресс
        // накапливается при удержании Space / сенсорной кнопки (actionHeld),
        // а не по однопиксельному флагу actionPressed (из-за чего уборка была
        // невозможна: флаг живёт один кадр, else-ветка сбрасывала прогресс).
        // Старт разрешён и при пустых руках, и с ведром в руке (ведро просто
        // остаётся при кипере); начинать нельзя во время мойки/педикюра.
        const shovelCanStart = !player.isDoingPedicure && !player.isWashing;
        if (nearPile && (actionHeld || player.isShoveling) && shovelCanStart) {
          // Если тачка уже заполнена до отказа (60/60 кг)
          if (player.wheelbarrowKg >= player.wheelbarrowMaxKg) {
            player.isShoveling = false;
            player.shovelProgress = 0;
            if (player.fullBarrowAlertTimer <= 0) {
              sfx.playAlert();
              addLog(`⚠️ Тачка заполнена (60/60 кг)! Отвезите навоз в зеленый контейнер утилизации.`);
              player.fullBarrowAlertTimer = 2.0;
            }
          } else {
            // Набираем навоз лопатой
            player.isShoveling = true;
            player.shovelProgress += dt * 1.5;
            if (Math.random() < 0.2) sfx.playShovel();

            // Создаем частички разлетающейся соломы/грязи
            if (Math.random() < 0.4) {
              particles.push({
                x: nearPile.x + (Math.random() - 0.5) * 16,
                y: nearPile.y + (Math.random() - 0.5) * 16,
                vx: (Math.random() - 0.5) * 40,
                vy: -20 - Math.random() * 30,
                life: 0.4,
                maxLife: 0.4,
                color: '#8b5a2b',
                size: 3
              });
            }

            if (player.shovelProgress >= 1) {
              const freeCap = Math.max(0, player.wheelbarrowMaxKg - player.wheelbarrowKg);
              const loadedKg = Math.min(freeCap, nearPile.kg);
              const remainingKg = Math.max(0, nearPile.kg - loadedKg);

              player.wheelbarrowKg += loadedKg;
              stats.manureCleanedKg += loadedKg;
              stats.totalScore += loadedKg * 2;

              if (remainingKg <= 0.01) {
                dungPiles = dungPiles.filter(p => p.id !== nearPile.id);
              } else {
                nearPile.kg = remainingKg;
              }

              // Реакция слоних на уборку зоны отдыха (Этап 10)
              elephants.forEach(el => {
                const distToCleaned = Math.hypot(el.x - nearPile.x, el.y - nearPile.y);
                if (distToCleaned < 160 || dungPiles.length <= 2) {
                  if (el.mood !== 'Спокойная' && el.mood !== 'Бодрая') el.mood = 'Спокойная';
                  if (el.state === 'IDLE' || el.state === 'REST') {
                    if (el.id === 'audrey') el.statusText = 'Одобряет чистоту и порядок в вольере';
                    else if (el.id === 'pretty') el.statusText = 'Довольна чистым настилом в зоне отдыха';
                    else if (el.id === 'margo') el.statusText = 'Наблюдает за уборкой, обмахивается ушами';
                  }
                }
              });

              player.isShoveling = false;
              player.shovelProgress = 0;
              sfx.playThud();

              if (remainingKg > 0.01) {
                addLog(`В тачку загружено ${loadedKg} кг (до максимума 60 кг). В куче осталось ${remainingKg} кг!`);
              } else {
                addLog(`Убрано ${loadedKg} кг навоза (в тачке: ${player.wheelbarrowKg}/${player.wheelbarrowMaxKg} кг).`);
              }
            }
          }
        } else {
          player.isShoveling = false;
          player.shovelProgress = 0;
        }

        // Б) Разгрузка тачки в большой контейнер утиля (срабатывает слева, снизу и вплотную)
        const nearDumpster = player.x >= 780 && player.x <= 975 && player.y >= 50 && player.y <= 175;
        if (nearDumpster && actionPressed && player.wheelbarrowKg > 0) {
          const unloadedKg = player.wheelbarrowKg;
          sfx.playThud();
          addLog(`Выгружено ${unloadedKg} кг навоза в контейнер утиля. Тачка полностью свободна (0/${player.wheelbarrowMaxKg} кг).`);
          stats.totalScore += 25;
          player.wheelbarrowKg = 0;
        }

        // В) Интерактивная стойка чистых лабораторных ведер для проб мочи
        const nearBucketRack = player.x >= 705 && player.x <= 820 && player.y >= 50 && player.y <= 160;
        if (nearBucketRack && actionPressed && !player.isShoveling && !player.isDoingPedicure) {
          if (player.rackDebounceTimer <= 0) {
            if (player.carrying === 'none') {
              player.carrying = 'bucket';
              sfx.playThud();
              addLog('Взято чистое лабораторное ведро со стойки. Теперь можно подойти к слонихе для отбора пробы.');
              player.rackDebounceTimer = 0.5;
            } else if (player.carrying === 'bucket') {
              player.carrying = 'none';
              sfx.playThud();
              addLog('Лабораторное ведро возвращено на стойку инвентаря.');
              player.rackDebounceTimer = 0.5;
            } else {
              addLog('Руки заняты кормом! Сначала отнесите его в кормушку слоних.');
              player.rackDebounceTimer = 0.5;
            }
          }
        }

        // Г0) Стол с лакомствами — взять банан для ведения слона (Этап 27)
        const nearTreatTable = Math.hypot(player.x - treatTable.x, player.y - treatTable.y) < 55;
        if (nearTreatTable && actionPressed && !player.isShoveling && !player.isDoingPedicure && !player.isWashing) {
          if (player.carrying === 'none') {
            if (keeperState.treatsStock > 0) {
              player.carrying = 'treat';
              keeperState.treatsStock--;
              sfx.playThud();
              addLog('🍌 Взято лакомство (банан) со стола. Покажите его слонихе, чтобы повести её за собой.');
            } else if (player.treatDebounceTimer <= 0) {
              addLog('На столе лакомства закончились! Дождитесь пополнения или используйте стойку ведер.');
              player.treatDebounceTimer = 2.0;
            }
          } else if (player.carrying === 'treat') {
            player.carrying = 'none';
            keeperState.treatsStock++;
            sfx.playThud();
            addLog('Банан возвращён на стол с лакомствами.');
          }
        }

        // Г1) Стойка вил — взять/вернуть вилы для уборки мокрого сена (Этап 27R)
        const nearForkRack = Math.hypot(player.x - forkRack.x, player.y - forkRack.y) < 55;
        if (nearForkRack && actionPressed && !player.isShoveling && !player.isDoingPedicure && !player.isWashing) {
          if (player.rackDebounceTimer <= 0) {
            if (player.hasPitchfork) {
              player.hasPitchfork = false;
              player.forkProgress = 0;
              sfx.playThud();
              addLog('Вилы возвращены на стойку садового инвентаря.');
            } else if (player.carrying === 'none') {
              player.hasPitchfork = true;
              sfx.playThud();
              addLog('🛠️ Взяты вилы со стойки. Ими убираются мокрые участки настила в вольере.');
            } else {
              addLog('Руки заняты! Освободите их, чтобы взять вилы.');
            }
            player.rackDebounceTimer = 0.5;
          }
        }

        // Г2) Уборка мокрого сена вилами — только удержанием действия рядом с участком
        let nearWetSpot = null;
        for (const w of wetSpots) {
          if (Math.hypot(player.x - w.x, player.y - w.y) < w.r + 34) {
            nearWetSpot = w;
            break;
          }
        }
        if (nearWetSpot && player.hasPitchfork && actionHeld && !player.isShoveling && !player.isDoingPedicure && !player.isWashing) {
          if (player.wheelbarrowKg >= player.wheelbarrowMaxKg) {
            player.forkProgress = 0;
            if (player.fullBarrowAlertTimer <= 0) {
              sfx.playAlert();
              addLog('⚠️ Тачка заполнена (60/60 кг)! Выгрузите содержимое в контейнер утиля, затем продолжайте уборку мокрого сена.');
              player.fullBarrowAlertTimer = 2.0;
            }
          } else {
            player.forkProgress += dt * 1.1;
            if (Math.random() < 0.25) sfx.playShovel();
            if (Math.random() < 0.35) {
              particles.push({
                x: nearWetSpot.x + (Math.random() - 0.5) * 26,
                y: nearWetSpot.y + (Math.random() - 0.5) * 18,
                vx: (Math.random() - 0.5) * 40,
                vy: -20 - Math.random() * 25,
                life: 0.45,
                maxLife: 0.45,
                color: '#7fa8d9',
                size: 2.5
              });
            }
            if (player.forkProgress >= 1) {
              player.forkProgress = 0;
              const freeCap = Math.max(0, player.wheelbarrowMaxKg - player.wheelbarrowKg);
              const loadedKg = Math.min(freeCap, nearWetSpot.amount);
              const remainingKg = Math.max(0, nearWetSpot.amount - loadedKg);
              player.wheelbarrowKg += loadedKg;
              stats.wetHayCleanedKg += loadedKg;
              stats.totalScore += loadedKg * 2;
              if (remainingKg <= 0.01) {
                wetSpots = wetSpots.filter(w => w.id !== nearWetSpot.id);
                addLog(`🍀 Мокрое сено убрано вилами: ${loadedKg} кг в тачке (${player.wheelbarrowKg}/${player.wheelbarrowMaxKg} кг). Участок настила сух!`);
              } else {
                nearWetSpot.amount = remainingKg;
                addLog(`В тачку загружено ${loadedKg} кг мокрого сена. На участке осталось ${remainingKg} кг — продолжайте уборку.`);
              }
              sfx.playThud();
            }
          }
        } else {
          player.forkProgress = 0;
        }

        // Г) Взятие корма на складе фуража (Сено / Каша)
        const nearHay = Math.hypot(player.x - 80, player.y - 120) < 55;
        const nearMash = Math.hypot(player.x - 190, player.y - 120) < 55;

        if (actionPressed && !player.isShoveling && !player.isDoingPedicure) {
          if (nearHay) {
            if (player.carrying === 'none') {
              player.carrying = 'hay';
              sfx.playThud();
              addLog('Кипер взял тюк отборного лугового сена.');
            } else if (player.carrying === 'bucket') {
              if (player.forageDebounce <= 0) {
                addLog('В руках лабораторное ведро! Сначала верните его на стойку.');
                player.forageDebounce = 1.5;
              }
            }
          } else if (nearMash) {
            if (player.carrying === 'none') {
              player.carrying = 'mash';
              sfx.playThud();
              addLog('Кипер взял таз с теплой кашей и морковью.');
            } else if (player.carrying === 'bucket') {
              if (player.forageDebounce <= 0) {
                addLog('В руках лабораторное ведро! Сначала верните его на стойку.');
                player.forageDebounce = 1.5;
              }
            }
          }
        }

        // Д) Раскладка корма в кормушки слонов
        for (const feeder of feeders) {
          const dist = Math.hypot(player.x - (feeder.x + feeder.w / 2), player.y - (feeder.y + feeder.h / 2));
          if (dist < 55 && actionPressed) {
            if (player.carrying === 'hay' || player.carrying === 'mash') {
              const amount = player.carrying === 'hay' ? 35 : 45;
              feeder.food = Math.min(feeder.maxFood, feeder.food + amount);
              stats.foodDelivered += 1;
              stats.totalScore += 30;
              sfx.playThud();
              addLog(`Корм доставлен в ${feeder.name} (+${amount}%).`);
              player.carrying = 'none';

              // Реакция слоних на раздачу корма (Этап 10)
              const targetEl = elephants.find(e => e.id === feeder.id);
              if (targetEl) {
                targetEl.trunkAngle = 0.25;
                targetEl.earAngle = 0.2;
                if (targetEl.id === 'audrey') {
                  targetEl.statusText = 'Почувствовала запах свежего корма в кормушке';
                } else if (targetEl.id === 'margo') {
                  targetEl.statusText = 'Заметила раздачу корма и спешит полакомиться!';
                } else if (targetEl.id === 'pretty') {
                  targetEl.statusText = 'Проявила аппетит: подошла к свежей порции';
                }
                if (targetEl.state === 'IDLE' || targetEl.state === 'WANDER' || targetEl.satiety < 75) {
                  targetEl.state = 'WANDER';
                  targetEl.targetX = feeder.x + feeder.w / 2;
                  targetEl.targetY = feeder.y + 70;
                  targetEl.stateTimer = 11;
                }
              }
              break;
            }
          }
        }

        // Д1) Интерактивные внеплановые действия в вольере (Этап 09)
        // 1. Уборка забытого ведра на полу
        if (misplacedTool && misplacedTool.active && !player.isShoveling && !player.isDoingPedicure) {
          const distTool = Math.hypot(player.x - misplacedTool.x, player.y - misplacedTool.y);
          if (distTool < 48 && actionPressed) {
            misplacedTool.active = false;
            sfx.playThud();
            sfx.playSuccess();
            stats.totalScore += 25;
            if (activeSituationalEvent && activeSituationalEvent.type === 'tool_misplaced') {
              activeSituationalEvent.actionDone = true;
              activeSituationalEvent.followUpReady = true;
              activeSituationalEvent.pointsAwarded += 25;
            }
            showToast('🪣 Ведро убрано с прохода на стойку! (+25 очк.)', '#2ecc71');
            addLog('Забытое ведро убрано с прохода вольера на стойку инвентаря.');
          }
        }

        // 2. Сбор рассыпанного сена у кормушки
        if (scatteredHay && scatteredHay.active && !player.isShoveling && !player.isDoingPedicure) {
          const distHay = Math.hypot(player.x - scatteredHay.x, player.y - scatteredHay.y);
          if (distHay < 48 && actionPressed) {
            scatteredHay.active = false;
            sfx.playShovel();
            sfx.playSuccess();
            const fPretty = feeders.find(f => f.id === 'pretty');
            if (fPretty) fPretty.food = Math.min(100, fPretty.food + 15);
            stats.totalScore += 25;
            if (activeSituationalEvent && activeSituationalEvent.type === 'scattered_hay') {
              activeSituationalEvent.actionDone = true;
              activeSituationalEvent.followUpReady = true;
              activeSituationalEvent.pointsAwarded += 25;
            }
            showToast('🌾 Сено собрано обратно в кормушку! (+25 очк.)', '#2ecc71');
            addLog('Рассыпанный фураж собран в кормушку. Вольер приведен в порядок.');
          }
        }

        // 3. Санитарная очистка бортика кормушки от засохшей каши
        if (feederCrust && feederCrust.active && !player.isShoveling && !player.isDoingPedicure) {
          const fAudrey = feeders.find(f => f.id === feederCrust.feederId);
          if (fAudrey) {
            const distCrust = Math.hypot(player.x - (fAudrey.x + fAudrey.w / 2), player.y - (fAudrey.y + fAudrey.h / 2));
            if (distCrust < 55 && actionPressed) {
              feederCrust.progress += dt * 1.2;
              if (Math.random() < 0.25) sfx.playShovel();
              if (feederCrust.progress >= 1.0) {
                feederCrust.active = false;
                feederCrust.progress = 0;
                sfx.playSuccess();
                stats.totalScore += 25;
                if (activeSituationalEvent && activeSituationalEvent.type === 'feeder_crust') {
                  activeSituationalEvent.actionDone = true;
                  activeSituationalEvent.followUpReady = true;
                  activeSituationalEvent.pointsAwarded += 25;
                }
                showToast('🧼 Бортик кормушки вычищен щеткой! (+25 очк.)', '#2ecc71');
                addLog('Санитарная очистка бортика кормушки завершена (+25 очков).');
              }
            } else {
              feederCrust.progress = 0;
            }
          }
        }

        // Е) Водяной вентиль автопоилки слонов (постепенное пополнение чистой водой)
        const nearWaterValve = Math.hypot(player.x - waterTrough.valveX, player.y - waterTrough.valveY) < 60 ||
                               (player.x >= waterTrough.x - 45 && player.x <= waterTrough.x + waterTrough.w + 20 &&
                                player.y >= waterTrough.y - 45 && player.y <= waterTrough.y + waterTrough.h + 20);

        if (nearWaterValve && actionPressed && !player.isShoveling && !player.isDoingPedicure && player.carrying === 'none') {
          if (waterTrough.water < 100) {
            waterTrough.isRefilling = true;
            waterTrough.water = Math.min(100, waterTrough.water + waterTrough.refillRate * dt);

            // Реакция слоних на наполнение автопоилки (Этап 10)
            elephants.forEach(el => {
              if (el.thirst > 35 && el.state !== 'DRINK') {
                if (el.state === 'IDLE') {
                  if (el.id === 'audrey') el.statusText = 'Слышит плеск свежей воды в автопоилке';
                  else if (el.id === 'margo') el.statusText = 'Заинтересовалась шумом воды, поворачивается к поилке';
                  else if (el.id === 'pretty') el.statusText = 'Оживилась на звук наполняющейся поилки';
                }
                el.earAngle = Math.sin(worldAnimTime * 3) * 0.15;
              }
            });

            // Звук струи воды
            waterTrough.refillSoundTimer -= dt;
            if (waterTrough.refillSoundTimer <= 0) {
              sfx.playWaterFlow();
              waterTrough.refillSoundTimer = 0.22;
            }

            // Брызги воды из вентиля/трубы в поилку
            particles.push({
              x: waterTrough.valveX + 10 + Math.random() * 8,
              y: waterTrough.valveY + Math.random() * 6,
              vx: 25 + Math.random() * 30,
              vy: 10 + Math.random() * 20,
              life: 0.35,
              maxLife: 0.35,
              color: '#3498db',
              size: 2.5
            });

            if (waterTrough.water >= 100) {
              waterTrough.water = 100;
              waterTrough.isRefilling = false;
              sfx.playSuccess();
              stats.totalScore += 25;
              addLog('Автопоилка наполнена чистой свежей водой до 100% (+25 очков)!');

              // Слонихи с выраженной жаждой направляются к полной поилке
              elephants.forEach(el => {
                if (el.thirst > 40 && el.state === 'IDLE') {
                  el.state = 'WANDER';
                  el.targetX = 475 + (Math.random() - 0.5) * 40;
                  el.targetY = 535 + (Math.random() - 0.5) * 15;
                  el.stateTimer = 10;
                  el.statusText = 'Идёт к свеженаполненной поилке';
                }
              });
            }
          } else {
            waterTrough.isRefilling = false;
          }
        } else {
          waterTrough.isRefilling = false;
        }

        // Ж) Проверка ловли мочи (требуется обязательное лабораторное ведро в руках!)
        for (const el of elephants) {
          if (el.missingBucketAlertTimer > 0) el.missingBucketAlertTimer -= dt;
          if (el.isWantingPee) {
            const dist = Math.hypot(player.x - el.x, player.y - el.y);
            if (dist < el.radius + 55 && actionPressed && gameState === 'PLAYING') {
              if (player.carrying !== 'bucket') {
                if (el.missingBucketAlertTimer <= 0) {
                  sfx.playAlert();
                  addLog(`⚠️ Для отбора пробы у ${el.name} нужно взять чистое лабораторное ведро на стойке (возле ворот)!`);
                  el.missingBucketAlertTimer = 2.0;
                }
              } else {
                startUrineQTE(el);
                break;
              }
            }
          }
        }

        // Ж1) Ведение слона за лакомством (Этап 27): показать лакомство -> вести -> дать лакомство
        if (player.carrying === 'treat' && actionPressed && gameState === 'PLAYING' && !player.isShoveling && !player.isDoingPedicure && !player.isWashing) {
          if (keeperState.leadingElephantId) {
            // Слон уже ведом — даём лакомство и завершаем сопровождение
            const led = elephants.find(e => e.id === keeperState.leadingElephantId);
            if (led && Math.hypot(player.x - led.x, player.y - led.y) < led.radius + 60) {
              keeperState.leadingElephantId = null;
              player.carrying = 'none';
              stats.treatsUsed++;
              led.state = 'IDLE';
              led.stateTimer = 3.0;
              led.satiety = Math.min(100, led.satiety + 8);
              led.statusText = 'Съела лакомый банан и довольна';
              sfx.playSuccess();
              addLog(`🍌 Слониха ${led.name} съела лакомство! Сопровождение завершено.`);
            } else if (led) {
              if (player.treatDebounceTimer <= 0) {
                addLog(`Подойдите ближе к ${led.name}, чтобы дать лакомство.`);
                player.treatDebounceTimer = 1.2;
              }
            } else {
              keeperState.leadingElephantId = null;
            }
          } else {
            // Выбираем цель сопровождения — не более одного слона одновременно
            for (const el of elephants) {
              if (el.state === 'REST') continue;
              if (Math.hypot(player.x - el.x, player.y - el.y) < el.radius + 55) {
                keeperState.leadingElephantId = el.id;
                el.state = 'FOLLOW';
                el.followPause = 0;
                el.statusText = 'Идёт за кипером за лакомством';
                sfx.playSuccess();
                addLog(`🍌 ${el.name} заметила лакомство и следует за вами. Доведите её до нужного места и нажмите «Дать лакомство».`);
                break;
              }
            }
          }
        }

        // Ж2) Начало мойки в зоне мойки (Этап 27): удержание действия, пока слон в зоне
        const nearWashZone = Math.hypot(player.x - washZone.x, player.y - washZone.y) < washZone.r + 45;
        let washTarget = null;
        for (const el of elephants) {
          if (Math.hypot(el.x - washZone.x, el.y - washZone.y) < washZone.r && el.footDirt >= 25) {
            washTarget = el;
            break;
          }
        }
        if (actionHeld && nearWashZone && washTarget && gameState === 'PLAYING' &&
            !player.isShoveling && !player.isDoingPedicure && player.carrying === 'none' &&
            keeperState.leadingElephantId !== washTarget.id) {
          if (keeperState.washingElephant && keeperState.washingElephant !== washTarget) {
            stopWashing(false);
          }
          keeperState.washingElephant = washTarget;
        }
        if (keeperState.washingElephant) {
          const wel = keeperState.washingElephant;
          // ЭТАП 27R.2: если кипер вытолкнут коллизией за границу зоны, мойка
          // должна останавливаться немедленно — иначе состояние washingElephant
          // «висяло» бы до тех пор, пока игрок снова не оказался в зоне.
          const washBlocked = checkCollision(player.x, player.y, player.radius);
          const keeperStillHere = nearWashZone && !washBlocked;
          const elStillHere = Math.hypot(wel.x - washZone.x, wel.y - washZone.y) < washZone.r + 25;
          if (!keeperStillHere || !elStillHere || !actionHeld || wel.state === 'REST') {
            // Прерывание без зависания: кипер отошёл / животное ушло / действие отпущено
            stopWashing(true);
            if (!keeperStillHere && player.washHintDebounce <= 0) {
              addLog('🚿 Мойка остановлена: кипер вышел из зоны мойки или отпустил кнопку действия.');
              player.washHintDebounce = 2.0;
            }
          } else {
            player.isWashing = true;
            keeperState.washProgress += dt * 0.22; // ~4.5 сек непрерывной мойки
            wel.footDirt = Math.max(0, wel.footDirt - dt * 22);
            wel.bodyDirtVisual = Math.max(0, (wel.bodyDirtVisual === undefined ? 1 : wel.bodyDirtVisual) - dt * 0.22);
            wel.statusText = 'Стоит под мойкой, смывается грязь с ног';
            // Брызги воды над слоном
            if (Math.random() < 0.6) {
              particles.push({
                x: wel.x + (Math.random() - 0.5) * 60,
                y: wel.y - wel.radius * 0.9,
                vx: (Math.random() - 0.5) * 30,
                vy: 40 + Math.random() * 40,
                life: 0.5,
                maxLife: 0.5,
                color: '#68c5ff',
                size: 2.5
              });
            }
            if (Math.random() < 0.1) sfx.playWaterFlow();
            if (keeperState.washProgress >= 1) {
              wel.footDirt = 0;
              wel.feetStatus = 'Чистые после мойки';
              keeperState.washingElephant = null;
              keeperState.washProgress = 0;
              wel.state = 'IDLE';
              wel.stateTimer = 3.0;
              wel.statusText = 'Чистая и посвежевшая после мойки';
              stats.washesDone++;
              stats.totalScore += 70;
              sfx.playSuccess();
              addLog(`🚿 Мойка завершена: ${wel.name} чиста! Ноги вымыты. +70 очков.`);
              showToast(`🚿 ${wel.name} вымыта! (+70 очк.)`, '#3498db');
            }
          }
        } else {
          player.isWashing = false;
        }

        // З) Расчистка ногтей (Педикюр по зажатию Space / E)
        let targetPedicureEl = null;
        for (const el of elephants) {
          if (el.isWantingPedicure && Math.hypot(player.x - el.x, player.y - el.y) < el.radius + 55) {
            targetPedicureEl = el;
            break;
          }
        }
        if (targetPedicureEl && actionPressed && gameState === 'PLAYING' && !player.isShoveling && player.carrying === 'none' && targetPedicureEl.state !== 'REST') {
          player.isDoingPedicure = true;
          player.pedicureProgress += dt * 0.6; // ~1.7 сек на расчистку
          if (Math.random() < 0.25) sfx.playShovel();
          if (player.pedicureProgress >= 1) {
            targetPedicureEl.isWantingPedicure = false;
            targetPedicureEl.pedicureTimer = 65 + Math.random() * 40;
            targetPedicureEl.feetStatus = 'Отлично (расчищены)';
            targetPedicureEl.pedicureDone = true;
            const timeStr = `${String(gameTime.hour).padStart(2, '0')}:${String(Math.floor(gameTime.minute)).padStart(2, '0')}`;
            const snap = {
              time: timeStr,
              satiety: Math.round(targetPedicureEl.satiety),
              thirst: Math.round(targetPedicureEl.thirst),
              energy: Math.round(targetPedicureEl.energy)
            };
            targetPedicureEl.observations.unshift({
              time: timeStr,
              hourRecorded: gameTime.hour,
              category: 'Процедура',
              text: 'Выполнена ветеринарная расчистка стоп и подошв (педикюр)',
              keeper: 'Дежурный кипер',
              ok: true,
              snapshot: snap
            });
            targetPedicureEl.lastInspectionSnapshot = snap;
            if (targetPedicureEl.observations.length > 6) targetPedicureEl.observations.pop();
            player.isDoingPedicure = false;
            player.pedicureProgress = 0;
            stats.pedicuresDone++;
            stats.totalScore += 80;
            sfx.playSuccess();
            addLog(`💅 Проведен педикюр слонихе ${targetPedicureEl.name}! +80 очков.`);
          }
        } else {
          player.isDoingPedicure = false;
          player.pedicureProgress = 0;
        }

        // Мягкое взаимное расталкивание слоних (защита от взаимоблокировок при случайном сближении)
        for (let i = 0; i < elephants.length; i++) {
          for (let j = i + 1; j < elephants.length; j++) {
            const e1 = elephants[i];
            const e2 = elephants[j];
            const d = Math.hypot(e1.x - e2.x, e1.y - e2.y);
            const minDist = (e1.radius + e2.radius) * 0.72;
            if (d < minDist && d > 0.01) {
              const push = (minDist - d) * 0.5 * dt * 4;
              const angle = Math.atan2(e2.y - e1.y, e2.x - e1.x);
              const e1nx = e1.x - Math.cos(angle) * push;
              const e1ny = e1.y - Math.sin(angle) * push;
              const e2nx = e2.x + Math.cos(angle) * push;
              const e2ny = e2.y + Math.sin(angle) * push;
              if (e1nx > 60 && e1nx < CANVAS_WIDTH - 60 && e1ny > 240 && e1ny < 580) { e1.x = e1nx; e1.y = e1ny; }
              if (e2nx > 60 && e2nx < CANVAS_WIDTH - 60 && e2ny > 240 && e2ny < 580) { e2.x = e2nx; e2.y = e2ny; }
            }
          }
        }

        // Этап 26: после перемещения слоних корректируем положение кипера, если слон
        // вошёл в персонажа (застревание внутри модели). Управление не блокируется.
        resolveKeeperCollisions();

        // 4. Индивидуальное поведение трех слоних (FSM конечный автомат)
        elephants.forEach(el => {
          // ЭТАП 27R: естественное высыхание грязи на ногах между процедурами
          if (el.footDirt > 0 && el.state !== 'REST') {
            el.footDirt = Math.max(0, el.footDirt - dt * 0.1);
          }

          // Покачивание ушей, хобота и хвоста (привязано к worldAnimTime для паузы во время модалок)
          const animSpeed = el.state === 'REST' ? 1.5 : (el.state === 'DRINK' ? 2.0 : 3.0);
          el.earAngle = Math.sin(worldAnimTime * animSpeed + el.age) * 0.32;
          el.trunkAngle = Math.sin(worldAnimTime * (animSpeed * 0.7) + el.age * 2) * 0.38;
          el.tailWiggle = Math.sin(worldAnimTime * (animSpeed * 1.2) + el.age) * 0.45;

          // ЭТАП 27: кишечник накапливается от кормления (EAT) и со временем;
          // куча навоза появляется при полном наполнении, затем показатель сбрасывается.
          el.bowel = Math.min(100, el.bowel + 0.28 * dt);
          el.pooTimer -= dt;
          if (el.pooTimer <= 0 || el.bowel >= 100) {
            el.pooTimer = 40 + Math.random() * 35;
            el.bowel = 10;
            if (dungPiles.length < 8) {
              const pileX = el.x + (Math.random() - 0.5) * 50;
              const pileY = el.y + 35 + Math.random() * 20;
              dungPiles.push({
                id: nextPileId++,
                x: Math.max(50, Math.min(CANVAS_WIDTH - 50, pileX)),
                y: Math.max(220, Math.min(CANVAS_HEIGHT - 50, pileY)),
                kg: 12 + Math.floor(Math.random() * 8),
                rot: Math.random() * Math.PI
              });
              addLog(`Слониха ${el.name} оставила свежую кучу навоза.`);
            }
          }

          // ЭТАП 27: физиология мочеиспускания. Мочевой пузырь накапливается со
          // временем и от питья (DRINK). Позыв возникает только при достижении
          // порога — событие не повторяется каждый кадр.
          if (!el.isWantingPee) {
            el.bladder = Math.min(100, el.bladder + el.bladderRate * dt);
            el.peeTimer -= dt;
            if (el.bladder >= 92 || el.peeTimer <= 0) {
              if (el.state === 'REST' && el.stateTimer > 4 && el.bladder < 97) {
                // Спящая слониха терпит до критического наполнения или конца сна
                el.peeTimer = 3;
              } else {
                triggerUrineEvent(el);
              }
            }
          } else {
            el.peeUrgencyTimer -= dt;
            if (el.peeUrgencyTimer <= 0) {
              el.isWantingPee = false;
              el.peeUrgencyTimer = 0; // согласованный сброс при пропущенном позыве (как при успехе в finishUrineQTE)
              el.bladder = 5;
              el.peeTimer = estimateNextPeeDelay(el);
              stats.missedPeeEvents++;
              spawnWetSpot(el, 16 + Math.floor(Math.random() * 8));
              sfx.playSplash();
              addLog(`💧 Слониха ${el.name} намочила мягкий настил. Проба упущена — участок мокрого сена требует уборки вилами!`);
            }
          }

          // Таймер педикюра (расчистки ногтей)
          if (!el.isWantingPedicure) {
            el.pedicureTimer -= dt;
            if (el.pedicureTimer <= 0 && !el.isWantingPee) {
              el.isWantingPedicure = true;
              el.pedicureUrgencyTimer = 28;
              sfx.playAlert();
              addLog(`🦶 У слонихи ${el.name} отросли ногти! Нужен педикюр.`);
            }
          } else {
            el.pedicureUrgencyTimer -= dt;
            if (el.pedicureUrgencyTimer <= 0) {
              el.isWantingPedicure = false;
              el.pedicureTimer = 55 + Math.random() * 35;
              addLog(`⚠️ Время педикюра для ${el.name} упущено.`);
            }
          }

          // Взаимосвязь физиологических показателей и последствия бездействия (Этап 10):
          // 1. Длительное отсутствие воды (жажда > 60%) снижает общий тонус и активность
          const isWaterScarce = waterTrough.water <= 15;
          const isWaterEmpty = waterTrough.water <= 0;
          const effectiveThirstRate = isWaterEmpty ? el.thirstRate * 1.85 : (isWaterScarce ? el.thirstRate * 1.45 : el.thirstRate);
          el.thirst = Math.min(100, el.thirst + effectiveThirstRate * dt * 0.22);

          if (el.thirst > 60) {
            const thirstStrain = ((el.thirst - 60) / 40) * 0.35;
            el.energy = Math.max(12, el.energy - dt * (0.16 + thirstStrain));
          }

          // 2. Дефицит корма стимулирует поиск еды и истощает силы при пустой кормушке
          const myFeeder = feeders.find(f => f.id === el.id);
          const isFeederEmpty = myFeeder && myFeeder.food <= 10;
          const effectiveHungerRate = isFeederEmpty ? el.hungerRate * 1.48 : el.hungerRate;
          el.satiety = Math.max(10, el.satiety - effectiveHungerRate * dt * 0.15);

          if (el.satiety < 35 && isFeederEmpty) {
            el.energy = Math.max(15, el.energy - dt * 0.26);
          }

          // 3. Неубранный навоз (>=4 куч) вынуждает слонов двигаться осторожно и медленнее
          const isManureHigh = dungPiles.length >= 4;
          const effectiveSpeed = isManureHigh ? el.speed * 0.76 : el.speed;

          // Обновление состояний конечного автомата (FSM)
          switch (el.state) {
            // ЭТАП 27R.2: ведение слона за лакомством. Слониха плавно идёт к точке
            // позади кипера (безопасная дистанция), используя штатную проверку
            // коллизий canElephantMoveTo — без телепортаций и прохода сквозь
            // препятствия. Если маршрут заблокирован — ждёт, не дёргаясь.
            case 'FOLLOW': {
              if (keeperState.leadingElephantId !== el.id) {
                // Цель ведения снята (отмена/рестарт) — возвращаемся к обычной жизни
                el.state = 'IDLE';
                el.stateTimer = 2.5;
                break;
              }
              const behindAngle = Math.atan2(el.y - player.y, el.x - player.x);
              const followDist = el.radius + 42;
              el.targetX = player.x + Math.cos(behindAngle) * followDist;
              el.targetY = player.y + Math.sin(behindAngle) * followDist;
              el.followPause = Math.max(0, (el.followPause || 0) - dt);

              const distToKeeper = Math.hypot(player.x - el.x, player.y - el.y);
              if (distToKeeper > followDist + 18 && el.followPause <= 0) {
                const angle = Math.atan2(el.targetY - el.y, el.targetX - el.x);
                const step = Math.min(distToKeeper, effectiveSpeed * 1.15 * dt);
                const nextX = el.x + Math.cos(angle) * step;
                const nextY = el.y + Math.sin(angle) * step;
                if (canElephantMoveTo(nextX, nextY, el.radius, el.id)) {
                  el.x = nextX;
                  el.y = nextY;
                } else if (canElephantMoveTo(nextX, el.y, el.radius, el.id)) {
                  el.x = nextX;
                } else if (canElephantMoveTo(el.x, nextY, el.radius, el.id)) {
                  el.y = nextY;
                } else {
                  el.followPause = 0.6; // маршрут перекрыт — короткая пауза вместо дёрганья
                }
                el.walkCycle += dt * (effectiveSpeed / 9);
                el.energy = Math.max(12, el.energy - el.energyDrainRate * dt * 0.7);
                el.statusText = 'Идёт за кипером за лакомством';
              } else if (distToKeeper <= followDist + 18) {
                el.statusText = 'Следует за вами в ожидании лакомства';
              }
              break;
            }

            case 'IDLE': {
              el.stateTimer -= dt;
              el.energy = Math.min(100, el.energy + el.energyRecoveryRate * dt * 0.5);

              // Интерес к киперу, если тот находится в вольере поблизости (Этап 09)
              const distToKeeper = Math.hypot(player.x - el.x, player.y - el.y);
              const keeperInsidePen = player.y > 200 && player.x > 30 && player.x < 970;

              if (keeperInsidePen && distToKeeper < 125 && distToKeeper > 45) {
                // Плавное обращение хобота в сторону кипера
                const toKeeperAngle = Math.atan2(player.y - el.y, player.x - el.x);
                el.trunkAngle = Math.sin(worldAnimTime * 2.5) * 0.15 + (toKeeperAngle * 0.22);

                if (player.carrying === 'hay' || player.carrying === 'mash') {
                  el.statusText = 'Тянется хоботом к корму у кипера';
                } else if (player.wheelbarrowKg > 0) {
                  el.statusText = 'Любопытно обнюхивает тачку кипера';
                } else {
                  el.statusText = 'Дружелюбно наблюдает за кипером';
                }
              } else if (isWaterEmpty && el.thirst > 60) {
                el.statusText = 'Томится от жажды (поилка пуста)';
              } else if (isFeederEmpty && el.satiety < 40) {
                el.statusText = 'Голодна, ждёт корм в кормушке';
              } else if (isManureHigh && dungPiles.length >= 6) {
                el.statusText = 'Осторожно обходит навоз';
