              } else {
                el.statusText = 'Наблюдает за окружением';
              }
              if (el.stateTimer <= 0) {
                chooseNextElephantState(el);
              }
              break;
            }

            case 'REST': {
              el.stateTimer -= dt;
              // ЭТАП 27: весь пол слоновника покрыт мягким настилом — спать можно
              // в любом свободном месте. Бонус только за чистоту настила вокруг.
              const nearWetHere = wetSpots.some(w => Math.hypot(el.x - w.x, el.y - w.y) < w.r + 40);
              const cleanBeddingBonus = dungPiles.length <= 2 ? 1.25 : (dungPiles.length >= 5 ? 0.75 : 1.0);
              const softBedBonus = nearWetHere ? 0.6 : 1.1;
              el.energy = Math.min(100, el.energy + el.energyRecoveryRate * dt * cleanBeddingBonus * softBedBonus);

              if (el.stateTimer > 0) {
                if (el.id === 'pretty') {
                  el.statusText = 'Спокойный глубокий отдых на мягком настиле';
                } else if (dungPiles.length >= 5) {
                  el.statusText = 'Беспокойный отдых из-за загрязнения вольера';
                } else {
                  el.statusText = 'Спокойно отдыхает, восстанавливает силы';
                }
              }

              // Завершение длительного отдыха с реакцией на восстановление сил (Этап 10)
              // ЭТАП 27: очень глубокий сон при переполненном мочевом пузыре —
              // слониха не просыпается и мочится прямо на настил (мокрое сено).
              if (el.stateTimer > 0 && el.bladder >= 97 && !el.isWantingPee) {
                performSleepUrination(el);
              }

              // ЭТАП 28 FIX: раньше выход был по `el.energy >= 96` — слониха
              // просыпалась сразу после восстановления сил, не доживая до конца
              // таймера отдыха. Теперь будит только истёкший stateTimer;
              // энергия лишь ограничивает сверху (не глубже 100). Принудительные
              // пробуждения при физиологических событиях сохранены выше по коду
              // (мочеиспускание во сне обрабатывается отдельно).
              if (el.stateTimer <= 0) {
                el.state = 'IDLE';
                el.stateTimer = el.idleDurationMin;
                el.trunkAngle = 0.22;
                el.earAngle = 0.18;
                if (el.id === 'pretty') {
                  el.statusText = 'Приятно потягивается хоботом после долгого сна';
                  el.mood = 'Бодрая';
                } else if (el.id === 'audrey') {
                  el.statusText = 'Завершила отдых, расправила уши и осматривает группу';
                  el.mood = 'Спокойная';
                } else {
                  el.statusText = 'Проснулась бодрой, готова к движению';
                  el.mood = 'Игривая';
                }
                chooseNextElephantState(el);
              }
              break;
            }

            case 'WANDER': {
              const distToTarget = Math.hypot(el.x - el.targetX, el.y - el.targetY);
              const distToTrough = Math.hypot(el.x - (waterTrough.x + waterTrough.w / 2), el.y - (waterTrough.y + 10));
              const distToFeeder = myFeeder ? Math.hypot(el.x - (myFeeder.x + myFeeder.w / 2), el.y - (myFeeder.y + 65)) : 999;

              // Если цель была подойти к поилке
              if (distToTrough < 75 && el.thirst > 35) {
                if (waterTrough.water > 0) {
                  el.state = 'DRINK';
                  el.stateTimer = 4.5 + Math.random() * 3.5;
                  el.statusText = 'Пьёт воду';
                  sfx.playWaterFlow();
                  addLog(`Слониха ${el.name} подошла к поилке и пьёт чистую воду.`);
                  break;
                } else {
                  el.state = 'IDLE';
                  el.stateTimer = 3.0;
                  el.statusText = 'Поилка пуста!';
                  addLog(`Слониха ${el.name} хотела попить, но в поилке нет воды!`);
                  break;
                }
              }

              // Если цель была подойти к кормушке
              if (distToFeeder < 70 && el.satiety < 85) {
                if (myFeeder && myFeeder.food > 0) {
                  el.state = 'EAT';
                  el.stateTimer = 5.0 + Math.random() * 4.0;
                  el.statusText = 'Ест корм';
                  break;
                } else {
                  el.state = 'IDLE';
                  el.stateTimer = 3.0;
                  el.statusText = 'Кормушка пуста!';
                  break;
                }
              }

              // Прибытие к обычной целевой точке
              if (distToTarget <= 14) {
                el.state = Math.random() < el.restChance ? 'REST' : 'IDLE';
                // ЭТАП 28 FIX: при переходе в REST таймер обязан быть длительностью
                // отдыха, а не случайной idle-паузой (3..12 с) — иначе слониха
                // «просыпалась» почти сразу. fatigueBonus сохранён как в основном
                // пути выбора состояния.
                if (el.state === 'REST') {
                  const fatigueBonus = el.energy < 45 ? 6 : 0;
                  el.stateTimer = el.restDurationMin + fatigueBonus + Math.random() * (el.restDurationMax - el.restDurationMin);
                  el.statusText = 'Устроилась на мягком настиле';
                } else {
                  el.stateTimer = el.idleDurationMin + Math.random() * (el.idleDurationMax - el.idleDurationMin);
                  el.statusText = 'Осматривается';
                }
              } else {
                // ЭТАП 27: прохождение по мокрому участку настила постепенно пачкает ноги
                const wetUnder = wetSpots.find(w => Math.hypot(el.x - w.x, el.y - w.y) < w.r + el.radius * 0.4);
                if (wetUnder) {
                  el.footDirt = Math.min(100, el.footDirt + dt * 6);
                  if (el.footDirt > 55 && el.id !== 'audrey') el.statusText = 'Идёт по мокрому настилу, пачкает ноги';
                }

                // Обход свежего навоза в реальном времени: если на пути куча навоза, мягко огибаем
                const nearDung = dungPiles.find(p => Math.hypot(el.x - p.x, el.y - p.y) < 52);
                if (nearDung) {
                  el.statusText = 'Осторожно обходит навоз';
                  const repAngle = Math.atan2(el.y - nearDung.y, el.x - nearDung.x);
                  const repStep = 20 * dt;
                  const dodgeX = el.x + Math.cos(repAngle) * repStep;
                  const dodgeY = el.y + Math.sin(repAngle) * repStep;
                  if (canElephantMoveTo(dodgeX, dodgeY, el.radius, el.id)) {
                    el.x = dodgeX;
                    el.y = dodgeY;
                  }
                }

                // Плавный шаг к цели с учетом замедления при загрязненном вольере
                const angle = Math.atan2(el.targetY - el.y, el.targetX - el.x);
                const step = Math.min(distToTarget, effectiveSpeed * dt);
                const nextX = el.x + Math.cos(angle) * step;
                const nextY = el.y + Math.sin(angle) * step;

                if (canElephantMoveTo(nextX, nextY, el.radius, el.id)) {
                  el.x = nextX;
                  el.y = nextY;
                } else if (canElephantMoveTo(nextX, el.y, el.radius, el.id)) {
                  el.x = nextX;
                } else if (canElephantMoveTo(el.x, nextY, el.radius, el.id)) {
                  el.y = nextY;
                } else {
                  // Препятствие на пути — выбираем новую точку
                  chooseNextElephantState(el);
                }

                el.walkCycle += dt * (effectiveSpeed / 10);
                // Длительная активность повышает потребность в отдыхе
                el.energy = Math.max(12, el.energy - el.energyDrainRate * dt);
              }

              el.stateTimer -= dt;
              if (el.stateTimer <= 0) {
                chooseNextElephantState(el);
              }
              break;
            }

            case 'DRINK': {
              el.stateTimer -= dt;
              el.statusText = 'Пьёт воду';

              if (waterTrough.water > 0) {
                const drinkAmount = dt * 3.8;
                waterTrough.water = Math.max(0, waterTrough.water - drinkAmount);
                el.thirst = Math.max(0, el.thirst - drinkAmount * 2.8);
                // ЭТАП 27: питьё постепенно наполняет мочевой пузырь (без мгновенного события)
                el.bladder = Math.min(100, el.bladder + drinkAmount * 1.9);
                // Утоление жажды чистой водой восстанавливает общий тонус слонихи (Этап 10)
                el.energy = Math.min(100, el.energy + dt * 1.6);

                // Периодические брызги воды при питье
                if (Math.random() < 0.2) {
                  particles.push({
                    x: waterTrough.x + 20 + Math.random() * 45,
                    y: waterTrough.y + 15 + Math.random() * 30,
                    vx: (Math.random() - 0.5) * 10,
                    vy: -Math.random() * 15,
                    life: 0.4,
                    maxLife: 0.4,
                    color: '#68c5ff',
                    size: 2
                  });
                }

                if (waterTrough.water <= 0) {
                  el.state = 'IDLE';
                  el.stateTimer = 2.5;
                  el.statusText = 'Вода закончилась';
                  addLog(`Вода в поилке иссякла. Слониха ${el.name} прекратила пить.`);
                  break;
                }
              } else {
                el.state = 'IDLE';
                el.stateTimer = 2.0;
                break;
              }

              if (el.stateTimer <= 0 || el.thirst <= 5) {
                el.state = 'IDLE';
                el.stateTimer = el.idleDurationMin;
                el.statusText = 'Утолила жажду';
              }
              break;
            }

            case 'EAT': {
              el.stateTimer -= dt;
              el.statusText = 'Лакомится кормом';

              if (myFeeder && myFeeder.food > 0) {
                const eatAmount = dt * 4.2;
                myFeeder.food = Math.max(0, myFeeder.food - eatAmount);
                el.satiety = Math.min(100, el.satiety + eatAmount * 1.4);
                // ЭТАП 27: питание постепенно наполняет кишечник (без мгновенного события)
                el.bowel = Math.min(100, el.bowel + eatAmount * 1.5);
                // Поедание корма восстанавливает сытость и придаёт сил (Этап 10)
                const foodEnergyBonus = el.id === 'pretty' ? 1.4 : 1.1;
                el.energy = Math.min(100, el.energy + dt * 1.2 * foodEnergyBonus);

                if (Math.random() < 0.08) {
                  particles.push({
                    x: myFeeder.x + Math.random() * myFeeder.w,
                    y: myFeeder.y + Math.random() * myFeeder.h,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 0.6,
                    maxLife: 0.6,
                    color: '#e6c86e',
                    size: 2.5
                  });
                }

                if (myFeeder.food <= 0) {
                  el.state = 'IDLE';
                  el.stateTimer = 2.5;
                  el.statusText = 'Кормушка пуста';
                  addLog(`Кормушка слонихи ${el.name} опустела.`);
                  break;
                }
              } else {
                el.state = 'IDLE';
                el.stateTimer = 2.0;
                break;
              }

              if (el.stateTimer <= 0 || el.satiety >= 98) {
                el.state = 'IDLE';
                el.stateTimer = el.idleDurationMin;
                el.statusText = 'Сыта и довольна';
              }
              break;
            }
          }
        });

        // Этап 26: финальная коррекция после движения слоних (FSM-шаги и расталкивание),
        // чтобы кипер никогда не оставался внутри коллайдера слона в конце кадра.
        resolveKeeperCollisions();

        // 5. Обновление частиц
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      // ==========================================
      // 5. ГРАФИЧЕСКИЙ РЕНДЕР (CANVAS 2D PIXEL-ART)
      // ==========================================
      function render() {
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // А) Пол слоновника
        renderFloor();

        // Б) Разметка зон и оборудование
        renderEnvironmentObjects();

        // В) Кучи навоза
        renderDungPiles();

        // В0) ЭТАП 27R.2: мокрые участки настила, зона мойки, стол лакомств и стойка вил
        renderWetSpots();
        renderCareStations();

        // В1) Внеплановые интерактивные объекты вольера (Этап 09)
        renderSituationalObjects();

        // Г) Кормушки и поилка
        renderFeeders();

        // Д) Три слонихи
        elephants.forEach(el => renderElephant(el));

        // Е) Кипер (Игрок)
        renderPlayer();

        // Ж) Ограждения и передние элементы (для создания глубины)
        renderFencesAndForewalls();

        // З) Частицы
        renderParticles();

        // И) Освещение времени суток
        renderAmbientLighting();

        // К) HUD (Верхний интерфейс, журнал, индикаторы)
        renderHUD();

        // Л) Модальные окна поверх канваса
        if (gameState === 'TITLE') {
          renderTitleScreen();
        } else if (gameState === 'INSPECTION_MODAL') {
          renderInspectionModal();
        } else if (gameState === 'SHIFT_TABLET') {
          renderShiftTablet();
        } else if (gameState === 'QTE_URINE') {
          renderUrineQTE();
        } else if (gameState === 'PAUSED') {
          renderPauseScreen();
        } else if (gameState === 'SHIFT_REPORT') {
          renderShiftReport();
        }

        // Синхронизация наэкранного сенсорного слоя мобильных устройств
        updateTouchControlsUI();
      }

      // Отрисовка пола (дерево в зоне кипера, соломенно-бетонный песок в загоне)
      function renderFloor() {
        // 1. Верхний коридор кипера (деревянные доски)
        ctx.fillStyle = '#654321';
        ctx.fillRect(0, 0, CANVAS_WIDTH, 195);

        // Рисуем текстуру досок
        ctx.fillStyle = '#543618';
        for (let y = 10; y < 195; y += 22) {
          ctx.fillRect(0, y, CANVAS_WIDTH, 2);
        }
        ctx.fillStyle = '#7a5229';
        for (let x = 60; x < CANVAS_WIDTH; x += 110) {
          ctx.fillRect(x, 0, 2, 195);
        }

        // 2. Основная зона слоновника (теплая песчано-бетонная основа с соломой)
        ctx.fillStyle = '#c8b693';
        ctx.fillRect(0, 195, CANVAS_WIDTH, CANVAS_HEIGHT - 195);

        // Общий соломенный настил на весь слоновник
        ctx.fillStyle = '#e5ce82';
        ctx.fillRect(40, 240, 920, 380);

        // Выделенная зона глубокого мягкого настила для отдыха (любимое место отдыха Претти, Этап 10)
        ctx.fillStyle = '#edd688';
        ctx.fillRect(720, 400, 225, 175);
        ctx.strokeStyle = '#c6ab5a';
        ctx.lineWidth = 2;
        ctx.strokeRect(720, 400, 225, 175);

        // Прорисовка мягкой золотистой соломы
        ctx.fillStyle = '#fae99e';
        for (let i = 0; i < 35; i++) {
          const bsx = 730 + ((i * 37) % 205);
          const bsy = 410 + ((i * 53) % 155);
          ctx.fillRect(bsx, bsy, 8, 2);
          ctx.fillRect(bsx + 3, bsy - 2, 2, 6);
        }
        ctx.fillStyle = 'rgba(110, 80, 35, 0.45)';
        ctx.font = 'bold 9px monospace';
        ctx.fillText('ЗОНА ОТДЫХА (МЯГКИЙ НАСТИЛ)', 740, 418);

        // Прорисовка мелких травинок и соломинок пикселями
        ctx.fillStyle = '#d4bc6c';
        for (let i = 0; i < 90; i++) {
          const sx = 40 + ((i * 123) % (CANVAS_WIDTH - 80));
          const sy = 240 + ((i * 347) % (CANVAS_HEIGHT - 280));
          ctx.fillRect(sx, sy, 6, 2);
          ctx.fillRect(sx + 2, sy - 2, 2, 5);
        }
      }

      // Отрисовка стационарных зон (фураж, отдых, утиль)
      function renderEnvironmentObjects() {
        // --- 1. Склад сена (тюки) ---
        ctx.fillStyle = '#3e2717';
        ctx.fillRect(35, 55, 90, 70);
        // Тюки сена
        ctx.fillStyle = '#e6c86e';
        ctx.fillRect(40, 60, 38, 28);
        ctx.fillRect(82, 60, 38, 28);
        ctx.fillRect(58, 92, 42, 28);
        // Веревки на тюках
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(52, 60, 3, 28);
        ctx.fillRect(94, 60, 3, 28);
        ctx.fillRect(72, 92, 3, 28);

        // UX-рефакторинг: постоянная подпись убрана; подсказка появляется
        // только когда кипер в радиусе взаимодействия (см. getKeeperContextAction).
        if (Math.hypot(player.x - 80, player.y - 90) < 65) drawInteractIcon(80, 44);

        // --- 2. Склад каши и сочных овощей ---
        ctx.fillStyle = '#3e2717';
        ctx.fillRect(145, 55, 90, 70);
        // Тазы с кашей
        ctx.fillStyle = '#3a6b88';
        ctx.beginPath();
        ctx.arc(170, 80, 18, 0, Math.PI * 2);
        ctx.arc(210, 100, 16, 0, Math.PI * 2);
        ctx.fill();
        // Каша внутри
        ctx.fillStyle = '#d89b4b';
        ctx.beginPath();
        ctx.arc(170, 80, 14, 0, Math.PI * 2);
        ctx.arc(210, 100, 12, 0, Math.PI * 2);
        ctx.fill();
        // Морковки
        ctx.fillStyle = '#e86a24';
        ctx.fillRect(166, 75, 8, 3);
        ctx.fillRect(206, 96, 7, 3);

        // UX-рефакторинг: постоянная подпись убрана, только иконка в радиусе действия.
        if (Math.hypot(player.x - 190, player.y - 90) < 65) drawInteractIcon(190, 48);

        // --- 3. Стол зоны отдыха кипера ---
        ctx.fillStyle = '#5c3a21';
        ctx.fillRect(300, 65, 100, 65);
        ctx.fillStyle = '#7a4e2d';
        ctx.fillRect(304, 69, 92, 57);
        // Журнал дежурств на столе
        ctx.fillStyle = '#f5f0db';
        ctx.fillRect(315, 78, 26, 32);
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(320, 84, 16, 2);
        ctx.fillRect(320, 90, 16, 2);
        ctx.fillRect(320, 96, 12, 2);
        // Настольная лампа
        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.arc(375, 85, 10, 0, Math.PI * 2);
        ctx.fill();
        // Кружка чая
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(355, 100, 10, 12);

        ctx.fillStyle = '#d2b48c';
        ctx.fillText('ПОСТ ДЕЖУРНОГО', 305, 58);

        // --- 3А. Стойка лабораторных ведер для анализов ---
        ctx.fillStyle = '#422817';
        ctx.fillRect(735, 60, 68, 65);
        ctx.fillStyle = '#654022';
        ctx.fillRect(738, 63, 62, 59);
        // Полки стойки
        ctx.fillStyle = '#311a0c';
        ctx.fillRect(735, 92, 68, 4);

        // Ведра на стойке (если кипер не взял ведро - оба на полках; если взял - одно отсутствует)
        const bucketsOnRack = player.carrying === 'bucket' ? 1 : 2;
        for (let bi = 0; bi < bucketsOnRack; bi++) {
          const bx = 750 + bi * 24;
          const by = 80;
          // Корпус ведра (серебристо-голубой металл)
          ctx.fillStyle = '#a6b8c7';
          ctx.beginPath();
          ctx.moveTo(bx - 6, by - 7);
          ctx.lineTo(bx + 6, by - 7);
          ctx.lineTo(bx + 4.5, by + 7);
          ctx.lineTo(bx - 4.5, by + 7);
          ctx.closePath();
          ctx.fill();
          // Ободок и ручка
          ctx.strokeStyle = '#2980b9';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          // Синяя полоса лаборатории
          ctx.fillStyle = '#3498db';
          ctx.fillRect(bx - 5, by - 2, 10, 3);
        }

        ctx.fillStyle = '#f5eedb';
        ctx.font = 'bold 10px monospace';
        ctx.fillText('ВЕДРА ПРОБ', 740, 52);

        // UX-рефакторинг: постоянная подпись «СТОЙКА [SPACE]» убрана.
        // Иконка взаимодействия появляется только в радиусе действия;
        // текстовая подсказка — тоже только рядом со стойкой.
        const distToRack = Math.hypot(player.x - 768, player.y - 120);
        if (distToRack < 55) {
          drawInteractIcon(768, 96);
          ctx.fillStyle = player.carrying === 'bucket' ? '#f39c12' : (player.carrying === 'none' ? '#3498db' : '#e74c3c');
          ctx.font = 'bold 10px monospace';
          const rackHint = player.carrying === 'bucket' ? 'ВЕРНУТЬ [SPACE]' : (player.carrying === 'none' ? 'ВЗЯТЬ [SPACE]' : 'РУКИ ЗАНЯТЫ');
          ctx.fillText(rackHint, 730, 142);
        }

        // --- 4. Контейнер утилизации навоза ---
        ctx.fillStyle = '#1e4d2b';
        ctx.fillRect(825, 55, 130, 65);
        ctx.fillStyle = '#2a693b';
        ctx.fillRect(829, 59, 122, 57);
        // Ребра жесткости контейнера
        ctx.fillStyle = '#163820';
        for (let rx = 848; rx < 945; rx += 24) {
          ctx.fillRect(rx, 59, 3, 57);
        }
        ctx.fillStyle = '#f5eedb';
        ctx.font = 'bold 11px monospace';
        ctx.fillText('КОНТЕЙНЕР НАВОЗА', 835, 48);

        const nearDumpster = player.x >= 780 && player.x <= 975 && player.y >= 50 && player.y <= 175;
        if (nearDumpster) {
          ctx.fillStyle = player.wheelbarrowKg > 0 ? '#2ecc71' : '#bbb';
          ctx.font = 'bold 10px monospace';
          ctx.fillText(player.wheelbarrowKg > 0 ? `ВЫГРУЗИТЬ (${player.wheelbarrowKg} кг) [SPACE]` : 'ТАЧКА ПУСТА', 820, 150);
        } else {
          ctx.fillStyle = '#f5eedb';
          ctx.font = '10px monospace';
          ctx.fillText('РАЗГРУЗКА ТАЧКИ [SPACE]', 825, 150);
        }

        // --- 5. Поилка для слонов внизу с водяным вентилем ---
        // Бетонная чаша поилки (координаты waterTrough)
        ctx.fillStyle = '#474747';
        ctx.fillRect(waterTrough.x, waterTrough.y, waterTrough.w, waterTrough.h);
        ctx.fillStyle = '#5c5c5c';
        ctx.fillRect(waterTrough.x + 3, waterTrough.y + 3, waterTrough.w - 6, waterTrough.h - 6);

        // Внутреннее дно поилки (сухое дно при отсутствии воды)
        ctx.fillStyle = '#383533';
        ctx.fillRect(waterTrough.x + 6, waterTrough.y + 6, waterTrough.w - 12, waterTrough.h - 12);

        // Вода внутри (уровень зависит от waterTrough.water 0..100%)
        const waterHeight = ((waterTrough.h - 14) * Math.max(0, Math.min(100, waterTrough.water))) / 100;
        if (waterHeight > 0) {
          const waterY = waterTrough.y + waterTrough.h - 7 - waterHeight;
          ctx.fillStyle = waterTrough.water > 30 ? '#2980b9' : '#1f5377';
          ctx.fillRect(waterTrough.x + 7, waterY, waterTrough.w - 14, waterHeight);

          // Светлая верхняя кромка воды
          ctx.fillStyle = '#5dade2';
          ctx.fillRect(waterTrough.x + 7, waterY, waterTrough.w - 14, 2.5);

          // Блики и волны
          ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
          const wave = Math.sin(worldAnimTime * 3.5) * 5;
          ctx.fillRect(waterTrough.x + 12 + wave, waterY + 4, 22, 2);
          ctx.fillRect(waterTrough.x + 42 - wave, waterY + 12, 18, 2);
        } else {
          // Текст сухого дна
          ctx.fillStyle = '#7f8c8d';
          ctx.font = 'bold 9px monospace';
          ctx.fillText('СУХО', waterTrough.x + 28, waterTrough.y + 36);
        }

        // Водопроводная труба и вентиль слева от поилки
        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(waterTrough.valveX - 4, waterTrough.y + 12, 8, 42); // Вертикальная труба
        ctx.fillRect(waterTrough.valveX - 4, waterTrough.y + 24, 20, 7); // Излив трубы в поилку

        // Красный вентиль подачи воды (маховик)
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.arc(waterTrough.valveX, waterTrough.valveY, 8.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(waterTrough.valveX - 6, waterTrough.valveY - 1.5, 12, 3);
        ctx.fillRect(waterTrough.valveX - 1.5, waterTrough.valveY - 6, 3, 12);

        // Струя воды при пополнении
        if (waterTrough.isRefilling) {
          ctx.strokeStyle = '#68c5ff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(waterTrough.valveX + 16, waterTrough.y + 27);
          ctx.quadraticCurveTo(waterTrough.x + 20, waterTrough.y + 20, waterTrough.x + 35, waterTrough.y + 35);
          ctx.stroke();
        }

        // Индикатор уровня воды и подсказка управления для кипера
        const distToValve = Math.hypot(player.x - waterTrough.valveX, player.y - waterTrough.valveY);
        const nearWaterZone = distToValve < 60 || (player.x >= 420 && player.x <= 560 && player.y >= 540 && player.y <= 650);

        // UX-рефакторинг: постоянный процент поилки с поля убран (доступен в
        // журнале тревог и при приближении). Рядом с кипером — компактная
        // полоска уровня воды вместо длинной надписи.
        if (nearWaterZone) {
          drawInteractIcon(waterTrough.valveX, waterTrough.valveY - 26);
          if (waterTrough.isRefilling) {
            ctx.fillStyle = '#3498db';
            ctx.font = 'bold 11px monospace';
            ctx.fillText(`💧 НАПОЛНЕНИЕ: ${Math.round(waterTrough.water)}%`, waterTrough.x - 25, waterTrough.y - 12);
          } else if (waterTrough.water >= 100) {
            ctx.fillStyle = '#2ecc71';
            ctx.font = 'bold 10px monospace';
            ctx.fillText('💧 100%', waterTrough.x - 8, waterTrough.y - 12);
          } else {
            ctx.fillStyle = '#f39c12';
            ctx.font = 'bold 10px monospace';
            ctx.fillText('💧 ДЕРЖАТЬ SPACE', waterTrough.x - 32, waterTrough.y - 12);
            // Компактная полоска уровня воды
            ctx.fillStyle = '#120e0c';
            ctx.fillRect(waterTrough.x - 32, waterTrough.y - 8, 64, 5);
            ctx.fillStyle = waterTrough.water < 30 ? '#e74c3c' : '#3498db';
            ctx.fillRect(waterTrough.x - 31, waterTrough.y - 7, 62 * Math.max(0, waterTrough.water) / 100, 3);
          }
        } else if (waterTrough.water <= 15) {
          // Вне радиуса остаётся только минимальный критический маркер —
          // он не текст-подпись на поле, а маленький значок у самой поилки.
          ctx.fillStyle = '#e74c3c';
          ctx.beginPath();
          ctx.arc(waterTrough.x + 44, waterTrough.y - 8, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        // --- 6. Бревно-чесалка и предмет обогащения среды для слоних (Этап 10) ---
        ctx.fillStyle = '#5c3a21';
        ctx.beginPath();
        ctx.arc(280, 460, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#7a4e2d';
        ctx.beginPath();
        ctx.arc(280, 460, 11, 0, Math.PI * 2);
        ctx.fill();
        // Джутовая обмотка для чесания
        ctx.strokeStyle = '#c2a677';
        ctx.lineWidth = 3;
        ctx.stroke();
        // Подвешенное канатное кольцо обогащения
        ctx.strokeStyle = '#8b6f47';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(280, 477, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#543618';
        ctx.font = '8px monospace';
        ctx.fillText('ЧЕСАЛКА', 260, 495);
      }

      // Кормушки слонов
      function renderFeeders() {
        feeders.forEach(f => {
          // Корпус кормушки (деревянно-металлический лоток)
          ctx.fillStyle = '#4a3319';
          ctx.fillRect(f.x, f.y, f.w, f.h);
          ctx.fillStyle = '#694925';
          ctx.fillRect(f.x + 3, f.y + 3, f.w - 6, f.h - 6);

          // Сено/еда внутри кормушки
          if (f.food > 0) {
            const foodH = (f.h - 8) * (f.food / f.maxFood);
            ctx.fillStyle = '#d4b34e';
            ctx.fillRect(f.x + 5, f.y + f.h - 4 - foodH, f.w - 10, foodH);
            // Фрагменты овощей
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(f.x + 12, f.y + f.h - 12, 6, 4);
            ctx.fillRect(f.x + 40, f.y + f.h - 16, 7, 5);
          }

          // Решетка кормушки
          ctx.fillStyle = '#2b2b2b';
          for (let gx = f.x + 12; gx < f.x + f.w; gx += 16) {
            ctx.fillRect(gx, f.y, 3, f.h);
          }

          // Текст названия и наполненности
          ctx.fillStyle = '#333';
          ctx.font = '10px monospace';
          ctx.fillText(`${f.name}: ${Math.round(f.food)}%`, f.x - 5, f.y - 6);
        });
      }

      // Кучи навоза
      // ЭТАП 27R.2: мокрые участки настила — потемневшее влажное сено, лежащее до
      // уборки вилами. Интенсивность затемнения пропорциональна остатку загрязнения.
      function renderWetSpots() {
        for (const w of wetSpots) {
          const frac = Math.max(0.15, Math.min(1, w.amount / w.maxAmount));
          ctx.save();
          ctx.translate(w.x, w.y);
          // Мокрое пятно (тёмный холодный оттенок поверх соломенного настила)
          ctx.fillStyle = `rgba(74, 96, 128, ${0.30 + 0.35 * frac})`;
          ctx.beginPath();
          ctx.ellipse(0, 0, w.r * (0.8 + 0.2 * frac), w.r * 0.55 * (0.8 + 0.2 * frac), 0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(46, 66, 96, ${0.18 + 0.2 * frac})`;
          ctx.beginPath();
          ctx.ellipse(-w.r * 0.25, w.r * 0.1, w.r * 0.45, w.r * 0.28, -0.3, 0, Math.PI * 2);
          ctx.fill();
          // Блик влаги
          ctx.strokeStyle = 'rgba(190, 220, 255, 0.5)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(0, 0, w.r * 0.75, w.r * 0.42, 0.2, 0.6, 1.8);
          ctx.stroke();
          ctx.restore();

          // Подсказка у участка: чем убирать и сколько осталось.
          // UX-рефакторинг: длинная надпись заменена короткой (полный
          // алгоритм уборки — в журнале тревог [J]).
          const dist = Math.hypot(player.x - w.x, player.y - w.y);
          if (dist < w.r + 40) {
            ctx.textAlign = 'center';
            if (!player.hasPitchfork) {
              ctx.fillStyle = '#f1c40f';
              ctx.font = 'bold 10px monospace';
              ctx.fillText('🛠️ НУЖНЫ ВИЛЫ', w.x, w.y - w.r * 0.7);
            } else if (player.wheelbarrowKg >= player.wheelbarrowMaxKg) {
              ctx.fillStyle = '#e74c3c';
              ctx.font = 'bold 10px monospace';
              ctx.fillText('⚠️ ТАЧКА ПОЛНА', w.x, w.y - w.r * 0.7);
            } else {
              drawInteractIcon(w.x, w.y - w.r * 0.85);
              ctx.fillStyle = '#7fd0ff';
              ctx.font = 'bold 10px monospace';
              ctx.fillText(`ДЕРЖАТЬ [SPACE] · ${Math.round(w.amount)} кг`, w.x, w.y - w.r * 0.7);
            }
            // Прогресс уборки кольцом вокруг участка
            if (player.forkProgress > 0 && player.hasPitchfork) {
              ctx.strokeStyle = '#3498db';
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.arc(w.x, w.y, w.r + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * player.forkProgress);
              ctx.stroke();
            }
            ctx.textAlign = 'left';
          }
        }
      }

      // ЭТАП 27R.2: стационарные объекты ухода — зона мойки, стол лакомств и стойка вил.
      // Координаты берутся из уже существующих констант washZone / treatTable / forkRack.
      function renderCareStations() {
        // --- Зона мойки (юго-западный угол): мокрый бетонный круг со сливом ---
        ctx.save();
        ctx.fillStyle = 'rgba(52, 152, 219, 0.16)';
        ctx.beginPath();
        ctx.arc(washZone.x, washZone.y, washZone.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#3498db';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.arc(washZone.x, washZone.y, washZone.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        // Штанга с душевой лейкой над зоной
        ctx.strokeStyle = '#7f8c8d';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(washZone.x - washZone.r + 8, washZone.y - washZone.r - 6);
        ctx.lineTo(washZone.x - washZone.r + 8, washZone.y - washZone.r - 46);
        ctx.lineTo(washZone.x - 10, washZone.y - washZone.r - 46);
        ctx.stroke();
        ctx.fillStyle = '#95a5a6';
        ctx.beginPath();
        ctx.arc(washZone.x - 10, washZone.y - washZone.r - 40, 7, 0, Math.PI * 2);
        ctx.fill();
        // Капли воды из лейки (анимация по worldAnimTime — замирает на паузе)
        ctx.fillStyle = 'rgba(104, 197, 255, 0.7)';
        for (let i = 0; i < 5; i++) {
          const dropY = ((worldAnimTime * 40 + i * 17) % 60);
          ctx.beginPath();
          ctx.arc(washZone.x - 16 + i * 3.5, washZone.y - washZone.r - 33 + dropY, 1.6, 0, Math.PI * 2);
          ctx.fill();
        }
        // UX-рефакторинг: постоянная текстовая подпись «ЗОНА МОЙКИ» убрана —
        // синяя пунктирная зона и лейка читаются визуально; значок мойки и
        // короткая подсказка появляются только при подведении грязного слона.
        const washEl = elephants.find(e => Math.hypot(e.x - washZone.x, e.y - washZone.y) < washZone.r && e.footDirt >= 25);
        if (washEl && player.carrying === 'none' && !player.isShoveling && !player.isDoingPedicure && !keeperState.washingElephant) {
          drawInteractIcon(washZone.x, washZone.y - washZone.r - 8);
          ctx.fillStyle = '#bfe3ff';
          ctx.font = 'bold 10px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('🚿 ДЕРЖАТЬ [SPACE]', washZone.x, washZone.y + 6);
          ctx.textAlign = 'left';
        }
        ctx.restore();

        // Активная мойка — кольцо прогресса вокруг промываемой слонихи
        if (keeperState.washingElephant) {
          const wel = keeperState.washingElephant;
          ctx.strokeStyle = '#3498db';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(wel.x, wel.y, wel.radius + 12, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * keeperState.washProgress);
          ctx.stroke();
          ctx.textAlign = 'center';
          ctx.fillStyle = '#7fd0ff';
          ctx.font = 'bold 10px monospace';
          ctx.fillText(`МОЙКА ${Math.round(keeperState.washProgress * 100)}% — ДЕРЖИТЕ [SPACE]`, wel.x, wel.y - wel.radius - 44);
          ctx.textAlign = 'left';
        }

        // --- Стол с лакомствами (в коридоре дежурного) ---
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(treatTable.x - 26, treatTable.y - 14, 52, 28);
        ctx.strokeStyle = '#5d3a1a';
        ctx.lineWidth = 2;
        ctx.strokeRect(treatTable.x - 26, treatTable.y - 14, 52, 28);
        // Бананы по числу запаса на столе
        for (let i = 0; i < keeperState.treatsStock; i++) {
          ctx.fillStyle = '#f5d76e';
          ctx.beginPath();
          ctx.ellipse(treatTable.x - 12 + i * 12, treatTable.y - 2, 6, 3.4, -0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#c8a412';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        // UX-рефакторинг: постоянная подпись «СТОЛ ЛАКОМСТВ [SPACE]» убрана —
        // только бананы на столе; подсказка появляется в радиусе действия.
        if (Math.hypot(player.x - treatTable.x, player.y - treatTable.y) < 55 &&
            !player.isShoveling && !player.isDoingPedicure && !player.isWashing) {
          drawInteractIcon(treatTable.x, treatTable.y - 26);
          ctx.fillStyle = '#f5d76e';
          ctx.font = 'bold 9px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(player.carrying === 'treat' ? 'ВЕРНУТЬ [SPACE]' : (keeperState.treatsStock > 0 && player.carrying === 'none' ? 'ВЗЯТЬ [SPACE]' : ''), treatTable.x, treatTable.y + 26);
          ctx.textAlign = 'left';
        }

        // --- Стойка садового инвентаря (вилы) ---
        ctx.strokeStyle = '#5d4a2f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(forkRack.x - 12, forkRack.y + 14);
        ctx.lineTo(forkRack.x - 12, forkRack.y - 22);
        ctx.lineTo(forkRack.x + 12, forkRack.y - 22);
        ctx.lineTo(forkRack.x + 12, forkRack.y + 14);
        ctx.stroke();
        if (!player.hasPitchfork) {
          // Вилы на месте — рисуем древко с рожками
          ctx.strokeStyle = '#8b5a2b';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(forkRack.x, forkRack.y + 10);
          ctx.lineTo(forkRack.x, forkRack.y - 18);
          ctx.stroke();
          ctx.strokeStyle = '#95a5a6';
          ctx.lineWidth = 2;
          for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(forkRack.x + i * 4, forkRack.y - 18);
            ctx.lineTo(forkRack.x + i * 4, forkRack.y - 28);
            ctx.stroke();
          }
        }
        // UX-рефакторинг: постоянная подпись стойки вил убрана; иконка и
        // короткая подсказка — только в радиусе взаимодействия.
        if (Math.hypot(player.x - forkRack.x, player.y - forkRack.y) < 55 &&
            !player.isShoveling && !player.isDoingPedicure && !player.isWashing) {
          drawInteractIcon(forkRack.x, forkRack.y - 38);
          ctx.fillStyle = '#cbb894';
          ctx.font = 'bold 9px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(player.hasPitchfork ? 'ВИЛЫ У ВАС · ВЕРНУТЬ [SPACE]' : 'ВЗЯТЬ ВИЛЫ [SPACE]', forkRack.x, forkRack.y + 30);
          ctx.textAlign = 'left';
        } else if (player.hasPitchfork) {
          // Вне радиуса ничего не рисуем: статус «вилы у вас» виден по
          // иконке инструмента над головой кипера (renderPlayer).
        }
      }

      function renderDungPiles() {
        dungPiles.forEach(p => {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);

          // Масштаб кучи пропорционален массе (10..20 кг базовые, при частичном заборе уменьшается)
          const pileScale = Math.max(0.48, Math.min(1.25, p.kg / 16));
          ctx.scale(pileScale, pileScale);

          // Тень кучи
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ctx.beginPath();
          ctx.ellipse(2, 4, 18, 12, 0, 0, Math.PI * 2);
          ctx.fill();

          // Несколько округлых бугорков навоза
          ctx.fillStyle = '#5c3a17';
          ctx.beginPath();
          ctx.arc(-6, 0, 10, 0, Math.PI * 2);
          ctx.arc(6, -2, 11, 0, Math.PI * 2);
          ctx.arc(0, -6, 9, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#7a4e21';
          ctx.beginPath();
          ctx.arc(-4, -2, 7, 0, Math.PI * 2);
          ctx.arc(4, -4, 8, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();

          // Если игрок рядом, рисуем подсказку «SPACE - Убрать» или «ТАЧКА ПЕРЕПОЛНЕНА»
          const dist = Math.hypot(player.x - p.x, player.y - p.y);
          if (dist < 46) {
            const isFull = player.wheelbarrowKg >= player.wheelbarrowMaxKg;
            ctx.fillStyle = isFull ? '#c0392b' : '#2c3e50';
            ctx.font = 'bold 10px monospace';
            const label = isFull ? `ТАЧКА ПОЛНАЯ! (${p.kg} кг)` : `УБОРКА [SPACE] (${p.kg} кг)`;
            ctx.fillText(label, p.x - 55, p.y - 20);

            // Индикатор прогресса уборки
            if (player.isShoveling && player.shovelProgress > 0) {
              ctx.strokeStyle = '#27ae60';
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.arc(p.x, p.y, 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * player.shovelProgress);
              ctx.stroke();
            }
          }
        });
      }

      // Отрисовка внеплановых интерактивных объектов вольера (Этап 09)
      function renderSituationalObjects() {
        // 1. Забытое лабораторное ведро на полу вольера
        if (misplacedTool && misplacedTool.active) {
          const tx = misplacedTool.x;
          const ty = misplacedTool.y;

          // Мягкая тень
          ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
          ctx.beginPath();
          ctx.ellipse(tx + 2, ty + 6, 11, 5.5, 0, 0, Math.PI * 2);
          ctx.fill();

          // Корпус ведра (слегка наклоненное серебристое ведро)
          ctx.fillStyle = '#a6b8c7';
          ctx.beginPath();
          ctx.moveTo(tx - 7, ty - 6);
          ctx.lineTo(tx + 7, ty - 6);
          ctx.lineTo(tx + 5.5, ty + 8);
          ctx.lineTo(tx - 5.5, ty + 8);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#2980b9';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Синяя полоска лаборатории
          ctx.fillStyle = '#3498db';
          ctx.fillRect(tx - 6, ty - 1, 12, 3);

          // Контекстная подсказка
          const dist = Math.hypot(player.x - tx, player.y - ty);
          if (dist < 48) {
            ctx.fillStyle = '#f39c12';
            ctx.font = 'bold 10px monospace';
            ctx.fillText('УБРАТЬ ВЕДРО [SPACE]', tx - 55, ty - 14);
          } else {
            ctx.fillStyle = '#2c3e50';
            ctx.font = '9px monospace';
            ctx.fillText('ВЕДРО НА ПОЛУ', tx - 36, ty - 12);
          }
        }

        // 2. Рассыпанное сено у кормушки
        if (scatteredHay && scatteredHay.active) {
          const sx = scatteredHay.x;
          const sy = scatteredHay.y;

          // Пятно рассыпанной соломы
          ctx.fillStyle = '#d4bc6c';
          ctx.beginPath();
          ctx.ellipse(sx, sy, 18, 12, 0.2, 0, Math.PI * 2);
          ctx.fill();

          // Отдельные соломинки
          ctx.fillStyle = '#e6c86e';
          for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2;
            const lx = sx + Math.cos(ang) * (10 + (i % 3) * 3);
            const ly = sy + Math.sin(ang) * (7 + (i % 2) * 2);
            ctx.fillRect(lx, ly, 5, 2);
          }

          const dist = Math.hypot(player.x - sx, player.y - sy);
          if (dist < 48) {
            drawInteractIcon(sx, sy - 26);
            ctx.fillStyle = '#27ae60';
            ctx.font = 'bold 10px monospace';
            ctx.fillText('СОБРАТЬ [SPACE]', sx - 38, sy - 10);
          }
          // UX-рефакторинг: постоянная подпись «РАССЫПАНО СЕНО» вне радиуса
          // убрана — сам пучок сена виден на поле, подсказка появляется при
          // приближении кипера.
        }

        // 3. Засохший бортик кормушки
        if (feederCrust && feederCrust.active) {
          const f = feeders.find(fd => fd.id === feederCrust.feederId);
          if (f) {
            const fx = f.x + f.w / 2;
            const fy = f.y + 4;

            // Пятна засохшей каши на бортике
            ctx.fillStyle = '#b7793b';
            ctx.fillRect(f.x + 8, f.y, 22, 5);
            ctx.fillRect(f.x + 40, f.y, 18, 4);

            const dist = Math.hypot(player.x - fx, player.y - (f.y + f.h / 2));
            if (dist < 55) {
              ctx.fillStyle = '#3498db';
              ctx.font = 'bold 10px monospace';
              ctx.fillText('ОЧИСТИТЬ БОРТИК [ДЕРЖАТЬ SPACE]', f.x - 45, f.y - 18);

              // Индикатор прогресса очистки
              if (feederCrust.progress > 0) {
                ctx.strokeStyle = '#3498db';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(fx, fy - 6, 12, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * feederCrust.progress);
                ctx.stroke();
              }
            }
          }
        }
      }

      // ЭТАП 27R.2: отрисовка спящей (лежащей) слонихи на мягком настиле.
      // Вызывается из renderElephant() после ctx.translate(el.x, el.y), поэтому
      // вся геометрия рисуется в локальных координатах с началом в точке стояния.
      // Поза заметно отличается от стоящей: уплощённое туловище без опорных ног,
      // голова на подстилке, закрытые глаза, «сонные» дуги над головой.
      function renderSleepingElephant(el) {
        const bw = el.radius * 1.35;   // полуширина лежащего туловища
        const bh = el.radius * 0.55;   // полуввысота (сильно уплощено)
        const breathe = Math.sin(worldAnimTime * 1.6 + el.age) * 0.04;

        // 1. Мягкая тень-подстилка под телом
        ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
        ctx.beginPath();
        ctx.ellipse(0, bh * 0.75, bw * 1.05, bh * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 2. Туловище — приплюснутый бок слонихи (без стоек на ногах)
        ctx.save();
        ctx.scale(1, 1 + breathe);
        ctx.fillStyle = el.color;
        ctx.beginPath();
        ctx.ellipse(-bw * 0.12, 0, bw, bh, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = el.darkColor;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // Склад кожи на боку — лёгкая штриховка
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.14)';
        ctx.lineWidth = 2;
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.arc(-bw * 0.12 + i * bw * 0.35, bh * 0.1, bh * 0.75, -0.9, 0.9);
          ctx.stroke();
        }

        // 3. Прижатое к телу ухо
        ctx.fillStyle = el.darkColor;
        ctx.beginPath();
        ctx.ellipse(-bw * 0.55, -bh * 0.35, el.radius * 0.34, el.radius * 0.22, -0.35, 0, Math.PI * 2);
        ctx.fill();

        // 4. Хобот, свёрнутый на подстилке перед головой
        ctx.strokeStyle = el.color;
        ctx.lineWidth = el.radius * 0.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bw * 0.62, bh * 0.1);
        ctx.quadraticCurveTo(bw * 1.05, bh * 0.35, bw * 0.85, bh * 0.72);
        ctx.quadraticCurveTo(bw * 0.62, bh * 0.95, bw * 0.45, bh * 0.7);
        ctx.stroke();
        ctx.strokeStyle = el.darkColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.lineCap = 'butt';

        // 5. Голова, опущенная на настил
        ctx.fillStyle = el.color;
        ctx.beginPath();
        ctx.ellipse(bw * 0.62, bh * 0.05, el.radius * 0.42, el.radius * 0.34, 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = el.darkColor;
        ctx.lineWidth = 2;
        ctx.stroke();

        // 6. Закрытые глаза (спокойные дуги вместо зрачков)
        ctx.strokeStyle = '#1e2022';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(bw * 0.58, -el.radius * 0.12, 3.6, 0.15, Math.PI - 0.15);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(bw * 0.82, -el.radius * 0.08, 3.2, 0.15, Math.PI - 0.15);
        ctx.stroke();

        // 7. Короткий хвост с кисточкой, прижатый к настилу
        ctx.strokeStyle = el.darkColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-bw * 0.95, bh * 0.25);
        ctx.quadraticCurveTo(-bw * 1.15, bh * 0.5, -bw * 1.05, bh * 0.75);
        ctx.stroke();
        ctx.fillStyle = '#2c3036';
        ctx.beginPath();
        ctx.arc(-bw * 1.05, bh * 0.78, 3, 0, Math.PI * 2);
        ctx.fill();

        // 8. Индикатор сна: «сонные» дуги над головой
        const sleepBob = Math.sin(worldAnimTime * 2.2) * 3;
        ctx.fillStyle = '#bfe3ff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💤', bw * 0.7, -el.radius * 0.95 + sleepBob);

        // 9. Контекстная подсказка и статус у тела
        const distToPlayer = Math.hypot(player.x - el.x, player.y - el.y);
        ctx.font = 'bold 10px monospace';
        ctx.fillStyle = '#f5eedb';
        ctx.fillText(`${el.name} · отдыхает`, 0, -el.radius * 1.15);
        if (distToPlayer < el.radius + 55) {
          ctx.fillStyle = '#9fd8a0';
          ctx.fillText(`Бодрость: ${Math.round(el.energy)}% · ОСМОТР [F]`, 0, el.radius * 0.95);
        }
        ctx.textAlign = 'left';
      }

      // Отрисовка слонихи
      function renderElephant(el) {
        ctx.save();
        ctx.translate(el.x, el.y);

        // ЭТАП 27R: поза лёжа — слониха отдыхает на мягком настиле. Рисуем
        // приплюснутое туловище без ног и компактно убираем стандартную отрисовку.
        if (el.state === 'REST') {
          renderSleepingElephant(el);
          ctx.restore();
          return;
        }

        // 1. Большая мягкая тень под слоном
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 12, el.radius * 1.05, el.radius * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();

        // 2. Хвост с кисточкой
        ctx.save();
        ctx.rotate(el.tailWiggle);
        ctx.strokeStyle = el.darkColor;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, el.radius * 0.6);
        ctx.quadraticCurveTo(8, el.radius * 0.9, 4, el.radius * 1.15);
        ctx.stroke();
        // Кисточка
        ctx.fillStyle = '#2c3036';
        ctx.fillRect(1, el.radius * 1.12, 6, 6);
        ctx.restore();

        // 3. Задние и передние толстые ноги
        const legOffset = Math.sin(el.walkCycle) * 6;
        ctx.fillStyle = el.darkColor;
        // Задние ноги
        ctx.fillRect(-el.radius * 0.65, el.radius * 0.2 + legOffset, 16, 20);
        ctx.fillRect(el.radius * 0.35, el.radius * 0.2 - legOffset, 16, 20);
        // Передние ноги
        ctx.fillRect(-el.radius * 0.75, -el.radius * 0.3 - legOffset, 16, 20);
        ctx.fillRect(el.radius * 0.45, -el.radius * 0.3 + legOffset, 16, 20);

        // Ногти (белые полукружия)
        ctx.fillStyle = '#e8ecef';
        ctx.fillRect(-el.radius * 0.63, el.radius * 0.2 + legOffset + 16, 4, 4);
        ctx.fillRect(-el.radius * 0.55, el.radius * 0.2 + legOffset + 16, 4, 4);
        ctx.fillRect(el.radius * 0.37, el.radius * 0.2 - legOffset + 16, 4, 4);
        ctx.fillRect(el.radius * 0.45, el.radius * 0.2 - legOffset + 16, 4, 4);

        // 4. Массивное туловище
        ctx.fillStyle = el.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, el.radius, el.radius * 0.82, 0, 0, Math.PI * 2);
        ctx.fill();

        // Морщины и складки кожи
        ctx.strokeStyle = el.darkColor;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(-10, -5, el.radius * 0.5, 0.4, 1.2);
        ctx.arc(8, 6, el.radius * 0.45, 0.6, 1.5);
        ctx.stroke();

        // 5. Голова слонихи
        ctx.fillStyle = el.color;
        ctx.beginPath();
        ctx.arc(0, -el.radius * 0.5, el.radius * 0.52, 0, Math.PI * 2);
        ctx.fill();

        // 6. Большие уши, покачивающиеся в такт
        // Левое ухо
        ctx.save();
        ctx.translate(-el.radius * 0.45, -el.radius * 0.6);
        ctx.rotate(-el.earAngle);
        ctx.fillStyle = el.color;
        ctx.beginPath();
        ctx.ellipse(-14, 0, 18, 26, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = el.earColor;
        ctx.beginPath();
        ctx.ellipse(-14, 0, 12, 18, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Правое ухо
        ctx.save();
        ctx.translate(el.radius * 0.45, -el.radius * 0.6);
        ctx.rotate(el.earAngle);
        ctx.fillStyle = el.color;
        ctx.beginPath();
        ctx.ellipse(14, 0, 18, 26, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = el.earColor;
        ctx.beginPath();
        ctx.ellipse(14, 0, 12, 18, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 7. Глаза (при отдыхе REST - полуприкрытые сонные веки)
        if (el.state === 'REST') {
          ctx.strokeStyle = '#1e2022';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(-12, -el.radius * 0.55, 3.5, 0.2, Math.PI - 0.2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(12, -el.radius * 0.55, 3.5, 0.2, Math.PI - 0.2);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#1e2022';
          ctx.beginPath();
          ctx.arc(-12, -el.radius * 0.55, 3.5, 0, Math.PI * 2);
          ctx.arc(12, -el.radius * 0.55, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-13, -el.radius * 0.57, 1.5, 1.5);
          ctx.fillRect(11, -el.radius * 0.57, 1.5, 1.5);
        }

        // 8. Аккуратные бивни (бивники)
        ctx.fillStyle = '#fffdf5';
        ctx.fillRect(-10, -el.radius * 0.35, 4, 10);
        ctx.fillRect(6, -el.radius * 0.35, 4, 10);

        // 9. Хобот с подвижным кончиком и позой в зависимости от действия
        ctx.save();
        ctx.strokeStyle = el.color;
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -el.radius * 0.35);

        let trunkEndOffset = Math.sin(el.trunkAngle) * 16;
        let trunkEndY = el.radius * 0.2;
        let trunkMidY = -el.radius * 0.05;

        if (el.state === 'DRINK') {
          // Хобот опущен глубоко к поилке
          trunkEndOffset = Math.sin(worldAnimTime * 5) * 5;
          trunkMidY = el.radius * 0.1;
          trunkEndY = el.radius * 0.38;
        } else if (el.state === 'EAT') {
          // Хобот поднимает корм ко рту
          trunkEndOffset = Math.sin(worldAnimTime * 4) * 8;
          trunkMidY = -el.radius * 0.25;
          trunkEndY = -el.radius * 0.1;
        }

        ctx.quadraticCurveTo(trunkEndOffset * 0.6, trunkMidY, trunkEndOffset, trunkEndY);
        ctx.stroke();

        ctx.strokeStyle = el.darkColor;
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(0, -el.radius * 0.35);
        ctx.quadraticCurveTo(trunkEndOffset * 0.6, trunkMidY, trunkEndOffset, trunkEndY);
        ctx.stroke();

        // Кольца на хоботе
        ctx.strokeStyle = '#474e55';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(trunkEndOffset * 0.3, trunkMidY, 6, 0.2, 1.2);
        ctx.stroke();
        ctx.restore();

        ctx.restore();

        // --- 10. Статусный бейдж над головой слонихи ---
        const distToPlayer = Math.hypot(player.x - el.x, player.y - el.y);

        // ЭТАП 27R: индикатор ведения — слониха следует за кипером за лакомством
        if (el.state === 'FOLLOW') {
          const bob = Math.sin(worldAnimTime * 6) * 3;
          ctx.fillStyle = '#f1c40f';
          ctx.beginPath();
          ctx.arc(el.x, el.y - el.radius - 58 + bob, 13, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('🍌', el.x, el.y - el.radius - 54 + bob);
          // UX-рефакторинг: длинная надпись «ВЕДЁТСЯ ЗА ЛАКОМСТВОМ» убрана —
          // жёлтый значок с бананом и линия привязи к киперу достаточны.
          if (distToPlayer < el.radius + 60 && player.carrying === 'treat') {
            drawInteractIcon(el.x, el.y + el.radius + 14);
          }
        }

        // UX-рефакторинг: текстовый статус «НОГИ: ...» заменён компактным
        // значком 🦶 (красный — требуется мойка, оранжевый — загрязнены).
        // Точная степень грязи доступна в карточке осмотра [F].
        if (el.footDirt >= 25 && el.state !== 'FOLLOW') {
          ctx.textAlign = 'center';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText('🦶', el.x + el.radius * 0.75, el.y + el.radius + 18);
          ctx.strokeStyle = el.footDirt >= 60 ? '#e74c3c' : '#e67e22';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(el.x + el.radius * 0.75, el.y + el.radius + 14, 9, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Имя и полоска сытости
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(el.x - 45, el.y - el.radius - 38, 90, 24);
        ctx.fillStyle = '#f5eedb';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(el.name, el.x, el.y - el.radius - 24);

        // Индикатор сытости (зеленый / желтый / красный)
        const satWidth = 80;
        ctx.fillStyle = '#333';
        ctx.fillRect(el.x - satWidth / 2, el.y - el.radius - 20, satWidth, 5);
        ctx.fillStyle = el.satiety > 65 ? '#2ecc71' : (el.satiety > 35 ? '#f39c12' : '#e74c3c');
        ctx.fillRect(el.x - satWidth / 2, el.y - el.radius - 20, satWidth * (el.satiety / 100), 5);

        // Сигнал готовности к сдаче анализа мочи!
        if (el.isWantingPee) {
          const pulse = Math.sin(worldAnimTime * 8) * 4;
          const hasBucket = player.carrying === 'bucket';
          ctx.fillStyle = hasBucket ? '#27ae60' : '#e74c3c';
          ctx.beginPath();
          ctx.arc(el.x, el.y - el.radius - 54 + pulse, 16, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 13px sans-serif';
          ctx.fillText('🧪', el.x, el.y - el.radius - 49 + pulse);

          // UX-рефакторинг: длинная надпись «НУЖЕН АНАЛИЗ! (Nc)» заменена
          // компактным счётчиком секунд в самом бейдже.
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 9px monospace';
          ctx.fillText(`${Math.max(0, Math.ceil(el.peeUrgencyTimer))}с`, el.x, el.y - el.radius - 36 + pulse);

          if (distToPlayer < el.radius + 55) {
            ctx.fillStyle = hasBucket ? '#2ecc71' : '#e74c3c';
            ctx.font = 'bold 11px monospace';
            const peeHint = hasBucket ? 'ВЗЯТЬ АНАЛИЗ [SPACE]' : 'НУЖНО ВЕДРО СО СТОЙКИ!';
            ctx.fillText(peeHint, el.x, el.y + el.radius + 20);
          }
        } else if (el.isWantingPedicure) {
          const pulse = Math.sin(worldAnimTime * 8) * 4;
          ctx.fillStyle = '#8e44ad'; // Фиолетовый кружок
          ctx.beginPath();
          ctx.arc(el.x, el.y - el.radius - 54 + pulse, 16, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 13px sans-serif';
          ctx.fillText('🦶', el.x, el.y - el.radius - 49 + pulse);

          // UX-рефакторинг: надпись «ПЕДИКЮР! (Nc)» заменена компактным
          // счётчиком секунд в бейдже.
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 9px monospace';
          ctx.fillText(`${Math.max(0, Math.ceil(el.pedicureUrgencyTimer))}с`, el.x, el.y - el.radius - 36 + pulse);

          if (distToPlayer < el.radius + 55) {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px monospace';
            ctx.fillText('РАСЧИСТИТЬ НОГТИ [ЗАЖАТЬ SPACE]', el.x, el.y + el.radius + 20);

            if (player.isDoingPedicure && player.pedicureProgress > 0) {
              ctx.strokeStyle = '#9b59b6';
              ctx.lineWidth = 5;
              ctx.beginPath();
              ctx.arc(el.x, el.y, el.radius + 10, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * player.pedicureProgress);
              ctx.stroke();
            }
          }
        } else if (distToPlayer < el.radius + 45) {
          // UX-рефакторинг: постоянный текстовый статус поведения и «Жажда: N%»
          // убраны. Рядом с кипером — только значок поведения и подсказка
          // осмотра; точные показатели доступны в карточке [F].
          const stateIcon = el.state === 'REST' ? '💤' : (el.state === 'EAT' ? '🌾' : (el.state === 'DRINK' ? '💧' : (el.thirst > 60 ? '💧' : '👁️')));
          ctx.textAlign = 'center';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText(stateIcon, el.x, el.y + el.radius + 24);
          ctx.fillStyle = '#f5eedb';
          ctx.font = '9px monospace';
          ctx.fillText('ОСМОТР [F]', el.x, el.y + el.radius + 37);
          ctx.textAlign = 'left';
        }

        ctx.textAlign = 'left';
      }

      // Отрисовка игрока (Дежурного кипера)
      function renderPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);

        // Тень кипера
        ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
        ctx.beginPath();
        ctx.ellipse(0, 10, 14, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Анимация ног при ходьбе
        const legSwing = Math.sin(player.walkAnim) * 5;

        // Ноги и сапоги
        ctx.fillStyle = '#2d4030'; // Штаны комбинезона
        ctx.fillRect(-7, 2 + legSwing, 5, 8);
        ctx.fillRect(2, 2 - legSwing, 5, 8);

        ctx.fillStyle = '#1c1b18'; // Кожаные сапоги
        ctx.fillRect(-8, 9 + legSwing, 6, 4);
        ctx.fillRect(2, 9 - legSwing, 6, 4);

        // Тело в киперской униформе (песочно-зеленый жакет)
        ctx.fillStyle = '#3a5a40';
        ctx.fillRect(-9, -10, 18, 14);

        // Желтый бейдж зоопарка на груди
        ctx.fillStyle = '#f4a261';
        ctx.fillRect(1, -7, 5, 4);

        // Голова и киперская фуражка
        ctx.fillStyle = '#f8c291'; // Кожа лица
        ctx.beginPath();
        ctx.arc(0, -14, 7, 0, Math.PI * 2);
        ctx.fill();

        // Глаза в зависимости от направления
        ctx.fillStyle = '#2c3e50';
        if (player.dir === 'down') {
          ctx.fillRect(-3, -15, 2, 2);
          ctx.fillRect(1, -15, 2, 2);
        } else if (player.dir === 'left') {
          ctx.fillRect(-5, -15, 2, 2);
        } else if (player.dir === 'right') {
          ctx.fillRect(3, -15, 2, 2);
        }

        // Зеленая кепка с козырьком
        ctx.fillStyle = '#283618';
        ctx.beginPath();
        ctx.arc(0, -17, 8, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#1f2b13';
        if (player.dir === 'down') ctx.fillRect(-7, -17, 14, 3);
        else if (player.dir === 'left') ctx.fillRect(-9, -17, 11, 3);
        else if (player.dir === 'right') ctx.fillRect(-2, -17, 11, 3);

        // Переносимый предмет
        if (player.carrying === 'hay') {
          // Тюк сена в руках
          ctx.fillStyle = '#e6c86e';
          ctx.fillRect(-12, -4, 24, 14);
          ctx.fillStyle = '#8b5a2b';
          ctx.fillRect(-3, -4, 3, 14);
        } else if (player.carrying === 'mash') {
          // Таз с кашей
          ctx.fillStyle = '#3a6b88';
          ctx.beginPath();
          ctx.arc(0, 2, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#d89b4b';
          ctx.beginPath();
          ctx.arc(0, 2, 7, 0, Math.PI * 2);
          ctx.fill();
        } else if (player.carrying === 'bucket') {
          // Лабораторное металлическое ведро в руках
          ctx.fillStyle = '#a6b8c7';
          ctx.beginPath();
          ctx.moveTo(-6, -2);
          ctx.lineTo(6, -2);
          ctx.lineTo(4.5, 9);
          ctx.lineTo(-4.5, 9);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#2980b9';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          // Ободок и ручка
          ctx.fillStyle = '#3498db';
          ctx.fillRect(-5, 2, 10, 2.5);
        } else if (player.carrying === 'treat') {
          // ЭТАП 27R: банан-лакомство в руке кипера
          ctx.strokeStyle = '#f1c40f';
          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(9, 0, 6, -Math.PI * 0.85, -Math.PI * 0.1);
          ctx.stroke();
          ctx.lineCap = 'butt';
          ctx.fillStyle = '#8b5a2b';
          ctx.fillRect(6.5, -5.5, 2, 2.5);
          ctx.fillRect(12, -2.5, 2, 2.5);
        } else if (player.hasPitchfork) {
          // UX-рефакторинг: компактный визуальный маркер — вилы взяты со
          // стойки (замена постоянной подписи «ВИЛЫ У ВАС» у стойки).
          ctx.strokeStyle = '#8b5a2b';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(9, 6);
          ctx.lineTo(9, -13);
          ctx.stroke();
          ctx.strokeStyle = '#95a5a6';
          ctx.lineWidth = 2;
          for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(9 + i * 3, -13);
            ctx.lineTo(9 + i * 3, -19);
            ctx.stroke();
          }
        } else if (player.carrying === 'none') {
          // Рабочая лопата дежурного кипера
          ctx.fillStyle = '#8b5a2b';
          ctx.fillRect(8, -12, 2.5, 18);
          ctx.fillStyle = '#7f8c8d';
          ctx.fillRect(7, 5, 5, 6);
        }

        // Визуализация тачки кипера рядом с ним
        ctx.save();
        ctx.translate(player.dir === 'left' ? -22 : 22, 2);
        // Колесо тачки
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(0, 6, 5, 0, Math.PI * 2);
        ctx.fill();
        // Металлический кузов тачки
        ctx.fillStyle = '#5c6f84';
        ctx.beginPath();
        ctx.moveTo(-10, 2);
        ctx.lineTo(10, 2);
        ctx.lineTo(7, -8);
        ctx.lineTo(-7, -8);
        ctx.closePath();
        ctx.fill();

        // Заполнение тачки навозом
        if (player.wheelbarrowKg > 0) {
          const fillFrac = player.wheelbarrowKg / player.wheelbarrowMaxKg;
          ctx.fillStyle = '#6e451b';
          ctx.beginPath();

        ctx.restore();

        let ambientColor = 'rgba(0, 0, 0, 0)';

      // Вспомогательный перенос текста по словам для Canvas 2D
      function drawWrappedText(context, text, x, y, maxWidth, lineHeight) {
        if (!text) return;
        const words = text.split(' ');
        let line = '';
        let curY = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          const metrics = context.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, curY);
            line = words[n] + ' ';
            curY += lineHeight;
          } else {
            line = testLine;
          }
        }
        context.fillText(line, x, curY);
      }

        ctx.fillRect(col1X, col1Y, col1W, 24);
        ctx.strokeStyle = '#314147';
        ctx.lineWidth = 1;
        ctx.strokeRect(col1X, col1Y, col1W, col1H);

        ctx.fillStyle = '#f4d68a';
        ctx.font = 'bold 11px monospace';
        ctx.fillText('РЕГЛАМЕНТНЫЕ ЗАДАЧИ ДЕЖУРСТВА (08:00 — 20:00)', col1X + 10, col1Y + 16);

        ctx.fillStyle = '#172023';
        ctx.fillRect(col1X, col1Y + 24, col1W, col1H - 24);

        // 16 задач в компактном виде (28px на строку) с приоритетами и дедлайнами (Этап 08)
        shiftTasks.forEach((task, idx) => {
          const rowY = col1Y + 24 + idx * 28;
          if (rowY + 28 > col1Y + col1H) return;

          // Подсветка строки
          if (task.status === 'available') {
            ctx.fillStyle = task.priority === 'urgent' ? 'rgba(231, 76, 60, 0.18)' : 'rgba(241, 196, 15, 0.10)';
            ctx.fillRect(col1X + 1, rowY, col1W - 2, 27);
          } else if (task.status === 'missed') {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.16)';
            ctx.fillRect(col1X + 1, rowY, col1W - 2, 27);
          } else if (task.status === 'recovered') {
            ctx.fillStyle = 'rgba(39, 174, 96, 0.14)';
            ctx.fillRect(col1X + 1, rowY, col1W - 2, 27);
          } else if (task.status === 'completed') {
            ctx.fillStyle = 'rgba(46, 204, 113, 0.05)';
            ctx.fillRect(col1X + 1, rowY, col1W - 2, 27);
          }

          // Бейдж приоритета (Urgent / Scheduled / Secondary)
          ctx.font = 'bold 8.5px monospace';
          if (task.priority === 'urgent') {
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(col1X + 6, rowY + 3, 54, 12);
            ctx.fillStyle = '#ffffff';
            ctx.fillText('🔥 СРОЧНО', col1X + 8, rowY + 12);
          } else if (task.priority === 'scheduled') {
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(col1X + 6, rowY + 3, 48, 12);
            ctx.fillStyle = '#ffffff';
            ctx.fillText('⏳ ПЛАН', col1X + 8, rowY + 12);
          } else {
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(col1X + 6, rowY + 3, 44, 12);
            ctx.fillStyle = '#ffffff';
            ctx.fillText('⭐ ДОП', col1X + 8, rowY + 12);
          }

          // Статус и оставшееся время
          const timeInfo = getTaskTimeRemaining(task);
          ctx.font = 'bold 9.5px monospace';
          ctx.fillStyle = timeInfo.color;
          ctx.fillText(`[${timeInfo.text}]`, col1X + 65, rowY + 12);

          // Временной слот
          ctx.font = '9px monospace';
          ctx.fillStyle = '#7a8c92';
          ctx.fillText(task.timeRange || '', col1X + 215, rowY + 12);

          // Очки
          ctx.textAlign = 'right';
          ctx.font = 'bold 10px monospace';
          if (task.status === 'completed') {
            ctx.fillStyle = '#2ecc71';
            ctx.fillText(`+${task.points}`, col1X + col1W - 8, rowY + 12);
          } else if (task.status === 'recovered') {
            ctx.fillStyle = '#27ae60';
            ctx.fillText(`+${Math.round(task.points * 0.65)} испр.`, col1X + col1W - 8, rowY + 12);
          } else if (task.status === 'missed') {
            ctx.fillStyle = '#e74c3c';
            ctx.fillText('0 очк.', col1X + col1W - 8, rowY + 12);
          } else {
            ctx.fillStyle = '#f39c12';
            ctx.fillText(`+${task.points}`, col1X + col1W - 8, rowY + 12);
          }
          ctx.textAlign = 'left';

          // Название и краткое пояснение
          ctx.font = 'bold 10.5px sans-serif';
          ctx.fillStyle = task.status === 'completed' ? '#7f8c8d' : (task.status === 'missed' ? '#e74c3c' : (task.status === 'recovered' ? '#27ae60' : (task.status === 'available' ? '#ffffff' : '#c8d1d5')));
          ctx.fillText(task.title, col1X + 8, rowY + 23);

          ctx.font = '9.5px sans-serif';
          ctx.fillStyle = '#6d7f85';
          const titleWidth = ctx.measureText(task.title).width;
          let descText = `— ${task.desc}`;
          if (col1X + 14 + titleWidth + ctx.measureText(descText).width > col1X + col1W - 8) {
            while (descText.length > 8 && col1X + 14 + titleWidth + ctx.measureText(descText + '...').width > col1X + col1W - 8) {
              descText = descText.substring(0, descText.length - 2);
            }
            descText += '...';
          }
          ctx.fillText(descText, col1X + 14 + titleWidth, rowY + 23);

          // Разделительная линия
          ctx.fillStyle = '#202a2e';
          ctx.fillRect(col1X + 4, rowY + 27, col1W - 8, 1);
        });

        // --- ПРАВАЯ КОЛОНКА: МОНИТОРИНГ И РЕСУРСЫ ---
        const col2X = 534;
        const col2Y = 108;
        const col2W = 400;
        const col2H = 472;

        // Блок 1: Состояние слоних (180px)
        ctx.fillStyle = '#222d32';
        ctx.fillRect(col2X, col2Y, col2W, 22);
        ctx.strokeStyle = '#314147';
        ctx.lineWidth = 1;
        ctx.strokeRect(col2X, col2Y, col2W, 180);

        ctx.fillStyle = '#f4d68a';
        ctx.font = 'bold 11px monospace';
        ctx.fillText('🐘 МОНИТОРИНГ ПОДОПЕЧНЫХ СЛОНИХ', col2X + 10, col2Y + 15);

        ctx.fillStyle = '#172023';
        ctx.fillRect(col2X, col2Y + 22, col2W, 158);

        elephants.forEach((el, i) => {
          const ey = col2Y + 30 + i * 50;

          // Имя, возраст и действие
          ctx.font = 'bold 12px "Segoe UI", sans-serif';
          ctx.fillStyle = '#f5eedb';
          const actLabel = el.state === 'EAT' ? 'Кормится 🌾' : (el.state === 'DRINK' ? 'Пьет воду 💧' : (el.state === 'REST' ? 'Отдыхает 💤' : 'Бродит 🐾'));
