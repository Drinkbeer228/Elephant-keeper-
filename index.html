<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Симулятор дежурного кипера слоновника</title>
    <meta name="description" content="Полноценная 2D ретро-игра в стиле пиксель-арт: уход за слонихами Одри, Марго и Претти, уборка навоза, кормление, сбор анализов и инспекция." />
    <meta property="og:title" content="Симулятор дежурного кипера слоновника" />
    <meta property="og:description" content="2D ретро-симулятор дежурного кипера слоновника: уход за слонихами, уборка, кормление, анализы и инспекция." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        background-color: #120e0c;
        color: #f5eedb;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        overscroll-behavior: none;
        padding: 0;
        margin: 0;
      }

      /* =========================================================
         1. ЭКРАН-ЗАСТАВКА «ПОВЕРНИТЕ УСТРОЙСТВО» (ДЛЯ ВЕРТИКАЛЬНОЙ ОРИЕНТАЦИИ)
         ========================================================= */
      #rotate-device-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #15100d;
        color: #f5eedb;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        touch-action: none;
      }

      .rotate-phone-anim {
        width: 96px;
        height: 96px;
        margin-bottom: 26px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .phone-outline {
        width: 44px;
        height: 76px;
        border: 3px solid #f1c40f;
        border-radius: 9px;
        position: relative;
        animation: rotatePhone 2.5s ease-in-out infinite;
        box-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        background: #241c16;
      }

      .phone-screen {
        width: 34px;
        height: 58px;
        background: rgba(241, 196, 15, 0.12);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .phone-notch {
        position: absolute;
        top: 2px;
        width: 12px;
        height: 2px;
        background: #f1c40f;
        border-radius: 1px;
      }

      @keyframes rotatePhone {
        0%, 15% {
          transform: rotate(0deg);
        }
        50%, 75% {
          transform: rotate(90deg);
        }
        90%, 100% {
          transform: rotate(0deg);
        }
      }

      #rotate-device-overlay h2 {
        font-size: 22px;
        color: #f1c40f;
        margin-bottom: 10px;
        font-weight: bold;
        letter-spacing: 0.5px;
      }

      #rotate-device-overlay p {
        font-size: 14px;
        color: #c5baaa;
        max-width: 290px;
        line-height: 1.45;
      }

      /* =========================================================
         2. ГОРИЗОНТАЛЬНОЕ ИГРОВОЕ ПОЛЕ (LANDSCAPE-FIRST)
         ========================================================= */
      #game-wrapper {
        position: relative;
        width: min(calc(100vw - var(--sal) - var(--sar)), calc((100dvh - var(--sat) - var(--sab)) * 1.470588));
        height: min(calc(100dvh - var(--sat) - var(--sab)), calc((100vw - var(--sal) - var(--sar)) * 0.68));
        max-width: 100vw;
        max-height: 100dvh;
        aspect-ratio: 1000 / 680;
        background: #000;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px #3c2a1e;
        border-radius: 4px;
        overflow: hidden;
        touch-action: none;
        margin: auto;
      }

      canvas#gameCanvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }

      /* Скрытый div root для React Vite совместимости */
      #root {
        display: none;
      }

      /* =========================================================
         3. СЕНСОРНОЕ УПРАВЛЕНИЕ ПОВЕРХ CANVAS (LANDSCAPE HUD)
         ========================================================= */
      #touch-controls-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 30;
        display: block;
      }

      /* Верхние правые кнопки быстрого доступа к HUD */
      #touch-hud-btns {
        position: absolute;
        top: 6px;
        right: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: auto;
      }

      .touch-hud-btn {
        width: 44px;
        height: 38px;
        min-width: 44px;
        min-height: 38px;
        border-radius: 8px;
        background: rgba(40, 30, 24, 0.88);
        border: 1.5px solid #4a382c;
        color: #f5eedb;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
        touch-action: manipulation;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      }
      .touch-hud-btn:active {
        background: #5c4333;
        transform: scale(0.93);
      }
      #touch-tasks-badge {
        position: absolute;
        top: -3px;
        right: -3px;
        background: #e74c3c;
        color: #fff;
        font-size: 9px;
        font-weight: bold;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        display: none;
        align-items: center;
        justify-content: center;
        border: 1px solid #14100e;
      }

      /* Виртуальный джойстик в левом нижнем углу */
      #touch-joystick-wrap {
        position: absolute;
        bottom: 12px;
        left: 14px;
        width: 108px;
        height: 108px;
        pointer-events: auto;
        touch-action: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #touch-joystick-base {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(45, 34, 26, 0.78) 0%, rgba(20, 15, 12, 0.92) 100%);
        border: 2px solid rgba(212, 175, 55, 0.5);
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.5);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }
      #touch-joystick-knob {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: radial-gradient(circle, #f1c40f 0%, #d4ac0d 60%, #b7950b 100%);
        border: 2.5px solid #ffffff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        position: absolute;
        pointer-events: none;
        transition: transform 0.04s ease-out;
      }
      .j-arrow {
        position: absolute;
        font-size: 11px;
        color: rgba(245, 238, 219, 0.55);
        pointer-events: none;
        font-weight: bold;
      }
      .j-up { top: 6px; }
      .j-down { bottom: 6px; }
      .j-left { left: 7px; }
      .j-right { right: 7px; }

      /* Кластер действий в правом нижнем углу */
      #touch-actions-wrap {
        position: absolute;
        bottom: 12px;
        right: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        pointer-events: auto;
        touch-action: none;
      }
      #touch-btn-inspect {
        width: 48px;
        height: 66px;
        border-radius: 12px;
        background: rgba(36, 51, 66, 0.88);
        border: 2px solid #3498db;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
        font-size: 18px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      }
      #touch-btn-inspect.highlighted {
        border-color: #f1c40f;
        background: rgba(46, 65, 87, 0.95);
        box-shadow: 0 0 12px rgba(241, 196, 15, 0.6);
      }
      #touch-btn-inspect small {
        font-size: 9px;
        font-family: monospace;
        margin-top: 2px;
        font-weight: bold;
      }
      #touch-btn-action {
        width: 66px;
        height: 66px;
        border-radius: 50%;
        background: radial-gradient(circle, #27ae60 0%, #1e824c 100%);
        border: 3px solid #2ecc71;
        box-shadow: 0 4px 14px rgba(46, 204, 113, 0.4);
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: none;
        transition: transform 0.08s ease, filter 0.08s ease;
      }
      #touch-btn-action:active,
      #touch-btn-action.holding {
        transform: scale(0.93);
        filter: brightness(1.2);
        border-color: #f1c40f;
        box-shadow: 0 0 18px rgba(241, 196, 15, 0.7);
      }
      #touch-action-icon {
        font-size: 22px;
        line-height: 1;
      }
      #touch-action-label {
        font-size: 9px;
        font-weight: bold;
        font-family: monospace;
        margin-top: 2px;
        text-align: center;
        max-width: 58px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Заставка «Поверните устройство» для вертикальных экранов смартфонов -->
    <div id="rotate-device-overlay">
      <div class="rotate-phone-anim">
        <div class="phone-outline">
          <div class="phone-notch"></div>
          <div class="phone-screen">
            <span>🐘</span>
          </div>
        </div>
      </div>
      <h2>Поверните устройство</h2>
      <p>Слоновник удобнее обходить в горизонтальном режиме</p>
    </div>

    <!-- Основное игровое поле -->
    <div id="game-wrapper">
      <canvas id="gameCanvas" width="1000" height="680"></canvas>

      <!-- Сенсорное управление поверх холста -->
      <div id="touch-controls-layer">
        <!-- Верхние правые кнопки быстрого доступа к HUD -->
        <div id="touch-hud-btns">
          <button id="touch-btn-tablet" class="touch-hud-btn" title="Планшет смены (Tab)">
            📋<span id="touch-tasks-badge">1</span>
          </button>
          <button id="touch-btn-sound" class="touch-hud-btn" title="Звук (M)">🔊</button>
          <button id="touch-btn-pause" class="touch-hud-btn" title="Пауза (P / Esc)">⏸️</button>
        </div>

        <!-- Нижний левый угол: Виртуальный джойстик движения -->
        <div id="touch-joystick-wrap">
          <div id="touch-joystick-base">
            <span class="j-arrow j-up">▲</span>
            <span class="j-arrow j-down">▼</span>
            <span class="j-arrow j-left">◀</span>
            <span class="j-arrow j-right">▶</span>
            <div id="touch-joystick-knob"></div>
          </div>
        </div>

        <!-- Нижний правый угол: Кнопка действия (SPACE) и осмотра (F) -->
        <div id="touch-actions-wrap">
          <button id="touch-btn-inspect" title="Осмотр слонихи (F)">
            <span>👁️</span>
            <small>F/ИНСП</small>
          </button>
          <button id="touch-btn-action" title="Действие (Пробел / Удержание)">
            <div id="touch-action-icon">🔨</div>
            <div id="touch-action-label">SPACE</div>
          </button>
        </div>
      </div>
    </div>

    <script>
      /**
       * СИМУЛЯТОР ДЕЖУРНОГО КИПЕРА СЛОНОВНИКА
       * Полностью автономная 2D ретро-игра на чистом Canvas API и Web Audio API
       */

      // ==========================================
      // 1. АУДИОСИНТЕЗАТОР (WEB AUDIO API)
      // ==========================================
      class SoundFX {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        toggleMute() {
          this.muted = !this.muted;
          return this.muted;
        }

        // Шаг кипера по соломе/бетону
        playStep() {
          if (this.muted || !this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(80, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.08);

          filter.type = 'lowpass';
          filter.frequency.value = 350;

          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        }

        // Скрежет лопаты по полу
        playShovel() {
          if (this.muted || !this.ctx) return;
          const now = this.ctx.currentTime;
          // Белый шум для шороха
          const bufferSize = this.ctx.sampleRate * 0.2;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1400, now);
          filter.Q.value = 3.0;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start(now);
        }

        // Разгрузка тачки / падение тюка сена
        playThud() {
          if (this.muted || !this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.25);
        }

        // Бульканье / всплеск ведра с анализом
        playSplash() {
          if (this.muted || !this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.25);

          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.25);
        }

        // Трубный звук слона (FM-модуляция для богатого живого рева)
        playElephantTrumpet() {
          if (this.muted || !this.ctx) return;
          const now = this.ctx.currentTime;

          const carrier = this.ctx.createOscillator();
          const modulator = this.ctx.createOscillator();
          const modGain = this.ctx.createGain();
          const mainGain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          carrier.type = 'sawtooth';
          modulator.type = 'sine';

          carrier.frequency.setValueAtTime(160, now);
          carrier.frequency.linearRampToValueAtTime(380, now + 0.3);
          carrier.frequency.linearRampToValueAtTime(440, now + 0.6);
          carrier.frequency.exponentialRampToValueAtTime(180, now + 1.1);

          modulator.frequency.setValueAtTime(35, now);
          modGain.gain.setValueAtTime(180, now);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(900, now);
          filter.frequency.linearRampToValueAtTime(2200, now + 0.4);
          filter.frequency.exponentialRampToValueAtTime(400, now + 1.1);

          mainGain.gain.setValueAtTime(0.001, now);
          mainGain.gain.linearRampToValueAtTime(0.3, now + 0.15);
          mainGain.gain.setValueAtTime(0.3, now + 0.7);
          mainGain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);

          modulator.connect(carrier.frequency);
          carrier.connect(filter);
          filter.connect(mainGain);
          mainGain.connect(this.ctx.destination);

          modulator.start(now);
          carrier.start(now);
          modulator.stop(now + 1.15);
          carrier.stop(now + 1.15);
        }

        // Победный аккорд / успешное действие
        playSuccess() {
          if (this.muted || !this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [440, 554, 659, 880];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.12, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.35);
          });
        }

        // Сигнал тревоги/внимания (нужен анализ мочи)
        playAlert() {
          if (this.muted || !this.ctx) return;
          const now = this.ctx.currentTime;
          [660, 880].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.15, now + idx * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.15);
            osc.stop(now + idx * 0.15 + 0.25);
          });
        }

        // Звук струи воды и питья
        playWaterFlow() {
          if (this.muted || !this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(260 + Math.random() * 80, now);
          osc.frequency.linearRampToValueAtTime(190 + Math.random() * 60, now + 0.14);

          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(550, now);
          filter.Q.setValueAtTime(3.5, now);

          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.15);
        }
      }

      const sfx = new SoundFX();

      // ==========================================
      // 2. ИГРОВЫЕ ДАННЫЕ И СУЩНОСТИ
      // ==========================================
      const CANVAS_WIDTH = 1000;
      const CANVAS_HEIGHT = 680;

      // Зоны и стены (AABB коллизии)
      const obstacles = [
        // Периметр здания слоновника
        { x: 0, y: 0, w: CANVAS_WIDTH, h: 48 }, // Верхняя стена
        { x: 0, y: CANVAS_HEIGHT - 20, w: CANVAS_WIDTH, h: 20 }, // Нижняя стена
        { x: 0, y: 0, w: 20, h: CANVAS_HEIGHT }, // Левая стена
        { x: CANVAS_WIDTH - 20, y: 0, w: 20, h: CANVAS_HEIGHT }, // Правая стена

        // Главное ограждение между зоной кипера и слоновником (y ~ 190)
        // Ворота находятся на x: 620..710
        { x: 20, y: 185, w: 590, h: 18 },
        { x: 720, y: 185, w: 260, h: 18 },

        // Мебель зоны кипера
        { x: 300, y: 65, w: 100, h: 65 }, // Стол дежурного кипера
        { x: 735, y: 55, w: 70, h: 65 },  // Стойка лабораторных ведер для анализов
        { x: 825, y: 55, w: 130, h: 65 }, // Контейнер навоза (компактный для удобного подъезда)

        // Склад фуража
        { x: 35, y: 55, w: 90, h: 70 },  // Склад сена
        { x: 145, y: 55, w: 90, h: 70 }, // Склад каши и овощей

        // Общий открытый вольер без внутренних перегородок
        { x: 460, y: 585, w: 85, h: 65 }, // Автопоилка внизу
      ];

      // Автопоилка вольера слонов с водяным вентилем
      const waterTrough = {
        x: 460,
        y: 585,
        w: 85,
        h: 65,

      function getCurrentPhase() {
        const curH = gameTime.hour + gameTime.minute / 60;
        const phase = shiftPhases.find(p => curH >= p.startHour && curH < p.endHour);
        return phase || shiftPhases[shiftPhases.length - 1];
      }

      function getCurrentActiveTask() {
        const curH = gameTime.hour + gameTime.minute / 60;
        // 1. Срочная доступная задача
        const urgentAvail = shiftTasks.find(t => t.status === 'available' && t.priority === 'urgent' && curH >= t.startHour);
        if (urgentAvail) return urgentAvail;
        // 2. Просроченная задача, требующая скорейшего восстановления
        const missedToRecover = shiftTasks.find(t => t.status === 'missed');
        if (missedToRecover) return missedToRecover;
        // 3. Доступная задача текущей фазы
        const currentPhaseTasks = shiftTasks.filter(t => t.status === 'available' && curH >= t.startHour && curH < t.endHour);
        if (currentPhaseTasks.length > 0) return currentPhaseTasks[0];
        // 4. Любая доступная активная задача
        const anyAvail = shiftTasks.find(t => t.status === 'available');
        if (anyAvail) return anyAvail;
        // 5. Следующая ожидающая задача
        const nextPending = shiftTasks.find(t => t.status === 'pending');
        if (nextPending) return nextPending;
        return null;
      }

      function getTaskTimeRemaining(task) {
        const curH = gameTime.hour + gameTime.minute / 60;
        if (task.status === 'completed') {
          return { text: 'вовремя', color: '#2ecc71', state: 'done' };
        }
        if (task.status === 'recovered') {
          return { text: 'исправлено', color: '#27ae60', state: 'recovered' };
        }
        if (task.status === 'missed') {
          return { text: 'исправить!', color: '#e67e22', state: 'missed' };
        }
        if (curH < task.startHour) {
          const minsToStart = Math.round((task.startHour - curH) * 60);
          const hrs = Math.floor(minsToStart / 60);
          const mins = minsToStart % 60;
          const str = hrs > 0 ? `${hrs}ч ${mins}м` : `${mins}м`;
          return { text: `через ${str}`, color: '#7f8c8d', state: 'pending' };
        }
        // Задача активна
        const minsLeft = Math.max(0, Math.round((task.endHour - curH) * 60));
        const hrs = Math.floor(minsLeft / 60);
        const mins = minsLeft % 60;
        const str = hrs > 0 ? `${hrs}ч ${mins}м` : `${mins}м`;

        if (minsLeft <= 15) {
          return { text: `срок: ${str}!`, color: '#e74c3c', state: 'urgent' };
        } else if (minsLeft <= 35) {
          return { text: `ост. ${str}`, color: '#f39c12', state: 'warning' };
        }
        return { text: `ост. ${str}`, color: '#83959b', state: 'normal' };
      }

      // Защита от штрафа: проверка блокировки задачи оперативной ситуацией
      function isTaskBlockedByEvent(task) {
        if (!activeSituationalEvent || activeSituationalEvent.status !== 'active') return false;
        // Поломка/критический уровень поилки блокирует плановое пополнение водой
        if (activeSituationalEvent.type === 'trough_low_thirst' && (task.id === 'water_morn' || task.id === 'water_morning' || task.id === 'day_water')) {
          return true;
        }
        // Засохшая кормушка или рассыпанный фураж блокирует кормление
        if ((activeSituationalEvent.type === 'feeder_crust' || activeSituationalEvent.type === 'scattered_hay') && (task.id === 'feed_morning' || task.id === 'evening_feed')) {
          return true;
        }
        // Смещенный инвентарь или скопление навоза блокирует плановую уборку
        if ((activeSituationalEvent.type === 'sanitation_cluster' || activeSituationalEvent.type === 'tool_misplaced') && (task.id === 'clean_dung_morning' || task.id === 'evening_dung')) {
          return true;
        }
        // Внеплановые клинические проверки блокируют дежурные осмотры
        if (activeSituationalEvent.type === 'vet_followup_check' && (task.id === 'day_inspection' || task.id === 'final_inspection')) {
          return true;
        }
        return false;
      }

      function updateShiftTasks() {
        const curH = gameTime.hour + gameTime.minute / 60;

        for (const task of shiftTasks) {
          if (task.status === 'completed' || task.status === 'recovered') continue;

          // 1. Активация задачи по наступлению времени
          if (task.status === 'pending') {
            if (curH >= task.startHour) {
              task.status = 'available';
            }
          }

          // 2. Проверка выполнения фактическими действиями игрока (в срок)
          if (task.status === 'available') {
            if (task.check()) {
              task.status = 'completed';
              stats.tasksCompleted++;
              stats.tasksCompletedOnTime++;
              stats.totalScore += task.points;
              sfx.playSuccess();
              const tag = task.priority === 'urgent' ? '🔥 СРОЧНАЯ' : (task.priority === 'scheduled' ? '⏳ ПЛАНОВАЯ' : '⭐ ДОПОЛНИТЕЛЬНАЯ');
              showToast(`✅ [${tag}] «${task.title}» выполнена вовремя! (+${task.points} очк.)`, '#2ecc71');
              addLog(`Выполнена регламентная задача [${tag}]: «${task.title}» вовремя. +${task.points} очков.`);
              continue;
            }
          }

          // 3. Проверка наступления дедлайна (срыв планового срока)
          if (task.status === 'available' && curH >= task.endHour && task.strict) {
            // Защита от штрафа, если задача заблокирована оперативным событием
            if (isTaskBlockedByEvent(task)) {
              continue; // Не штрафуем, пока активно блокирующее событие
            }
            task.status = 'missed';
            stats.tasksMissed++;
            sfx.playAlert();
            const tag = task.priority === 'urgent' ? '🔥 СРОЧНОЙ' : (task.priority === 'scheduled' ? 'плановой' : 'дополнительной');
            addLog(`⚠️ Пропущен регламентный срок ${tag} задачи: «${task.title}». Требуется ликвидация последствий!`);
            showToast(`⚠️ Пропущен срок: «${task.title}». Задача требует скорейшего исправления!`, '#e67e22');
            continue;
          }

          // 4. МЕХАНИКА ВОССТАНОВЛЕНИЯ (RECOVERY & REDEMPTION):
          // Опоздание не блокирует исправление ситуации. Кипер может ликвидировать последствия!
          if (task.status === 'missed') {
            if (task.check()) {
              task.status = 'recovered';
              stats.tasksRecovered++;
              const recoveryPoints = Math.round(task.points * 0.65);
              stats.totalScore += recoveryPoints;
              sfx.playSuccess();
              showToast(`✓ Ликвидация задержки: «${task.title}» (+${recoveryPoints} очк.)`, '#27ae60');
              addLog(`[Восстановление] Кипер исправил упущение: «${task.title}». Последствия устранены! (+${recoveryPoints} очков).`);

              // Положительный отклик у подопечных слоних
              elephants.forEach(el => {
                el.energy = Math.min(100, el.energy + 8);
                if (el.mood !== 'Спокойная' && Math.random() < 0.6) {
                  el.mood = 'Спокойная';
                }
              });
            }
          }
        }
      }

      // Состояния игры:
      // 'TITLE', 'PLAYING', 'INSPECTION_MODAL', 'SHIFT_TABLET', 'QTE_URINE', 'PAUSED', 'SHIFT_REPORT'
      let gameState = 'TITLE';
      let inspectingElephant = null;

      // Данные мини-игры реакции (Ловля анализа)
      const qteState = {
        active: false,
        elephant: null,
        sliderPos: 0, // 0..100
        sliderDir: 1,
        speed: 95, // Скорость бегунка
        targetMin: 38,
        targetMax: 62,
        result: null, // 'perfect', 'good', 'miss'
        endTimer: 0, // реальные мс окончания показа результата (performance.now()+1100; 0 = экран не активен)
        returnState: 'PLAYING' // состояние, в которое возвращаемся после QTE (пауза/планшет/модалка/титры/табель)
      };

      // Отложенное закрытие экрана результата QTE.
      // Таймер отвязан от игрового времени и не перебивает UI-состояния:
      // если к моменту истечения игра не в PLAYING/QTE_URINE (пауза, планшет,
      // модалка, титры, табель), экран закрывается при возврате в PLAYING
      // (проверка в update()) или через closeUrineQTE() при рестарте смены.
      let urineQtEResultTimeoutId = null;
      function clearUrineQtEResultTimeout() {
        if (urineQtEResultTimeoutId !== null) {
          clearTimeout(urineQtEResultTimeoutId);
          urineQtEResultTimeoutId = null;
        }
      }

      // ================= ЭТАП 27: физиология, мокрое сено, ведение и мойка =================

      // Оценка времени до следующего позыва по текущему наполнению мочевого пузыря
      // и индивидуальному темпу слонихи (bladderRate). Событие не вызывается каждый кадр.
      function estimateNextPeeDelay(el) {
        const rate = el.bladderRate || 0.5;
        return Math.max(12, (92 - el.bladder) / rate) + Math.random() * 15;
      }

      // Создание участка мокрого загрязнённого сена (НЕ куча навоза)
      function spawnWetSpot(el, amount) {
        if (wetSpots.length >= 6) wetSpots.shift(); // старый настил перестаёт быть заметен
        wetSpots.push({
          id: nextWetSpotId++,
          x: Math.max(70, Math.min(CANVAS_WIDTH - 70, el.x + (Math.random() - 0.5) * 40)),
          y: Math.max(250, Math.min(600, el.y + 30 + Math.random() * 15)),
          r: 30,
          amount: amount,
          maxAmount: amount,
          elephantId: el.id
        });
      }

      // Пропущенный позыв или непроизвольное мочеиспускание во время глубокого сна:
      // слониха мочится на настил — создаётся отдельный мокрый участок
      function performSleepUrination(el) {
        el.isWantingPee = false;
        el.peeUrgencyTimer = 0;
        el.bladder = 5;
        el.peeTimer = estimateNextPeeDelay(el);
        stats.missedPeeEvents++;
        spawnWetSpot(el, 14 + Math.floor(Math.random() * 6));
        sfx.playSplash();
        addLog(`💧 ${el.name} намочила мягкий настил во время отдыха — нужен уборщик вилами!`);
      }

      // Статус загрязнения ног для HUD и карточки осмотра (Этап 27)
      function getFootDirtStatus(el) {
        if (el.footDirt < 25) return 'Чистые';
        if (el.footDirt < 60) return 'Загрязнены';
        return 'Требуют мойки';
      }

      // Отмена ведения слона: животное возвращается к обычному FSM-поведению
      function cancelLeading(reason) {
        if (!keeperState.leadingElephantId) return;
        const el = elephants.find(e => e.id === keeperState.leadingElephantId);
        keeperState.leadingElephantId = null;
        if (el) {
          el.state = 'IDLE';
          el.stateTimer = 2.5 + Math.random() * 2;
          el.statusText = 'Вернулась к обычным делам';
        }
        if (reason) addLog(reason);
      }

      // Корректная остановка мойки без зависания состояния
      function stopWashing(silent) {
        if (!keeperState.washingElephant) return;
        const el = keeperState.washingElephant;
        keeperState.washingElephant = null;
        keeperState.washProgress = 0;
        if (!silent) {
          el.statusText = 'Покинула зону мойки';
          addLog(`🚿 Мойка прервана: ${el.name} ушла из зоны мойки.`);
        }
      }

      // Безопасная отмена всех активных процедур (несовместимое действие / рестарт)
      function abortActiveProcedures() {
        if (keeperState.leadingElephantId) cancelLeading('Ведение слона отменено из-за другого действия.');
        stopWashing(true);
      }

      // Клавиатурный ввод
      const keys = {};
      window.addEventListener('keydown', (e) => {
        // Предотвращаем потерю фокуса Canvas при нажатии клавиши Tab
        if (e.code === 'Tab') {
          e.preventDefault();
        }

        keys[e.code] = true;
        if (e.repeat) return;

        // ЭТАП 27R: одиночное «нажатие» действия для update() — Space/E в режиме игры.
        // Удержание (actionHeld) читается напрямую из keys/virtualKeys.
        if ((e.code === 'Space' || e.code === 'KeyE') && gameState === 'PLAYING') {
          player.actionQueued = true;
        }

        // Звуковая инициализация по первому взаимодействию
        sfx.init();

        if (e.code === 'KeyM') {
          sfx.toggleMute();
          addLog(sfx.muted ? 'Звук выключен' : 'Звук включен');
          return;
        }

        // 1. Модальное окно ветеринарного осмотра (F)
        if (gameState === 'INSPECTION_MODAL') {
          if (e.code === 'Escape' || e.code === 'KeyF') {
            gameState = 'PLAYING';
            inspectingElephant = null;
            sfx.playSuccess();
            return;
          }
          if (e.code === 'ArrowLeft') {
            if (inspectingElephant) {
              inspectingElephant.selectedObsCategory = ((inspectingElephant.selectedObsCategory || 0) + 4) % 5;
              sfx.playStep();
            }
            return;
          }
          if (e.code === 'ArrowRight') {
            if (inspectingElephant) {
              inspectingElephant.selectedObsCategory = ((inspectingElephant.selectedObsCategory || 0) + 1) % 5;
              sfx.playStep();
            }
            return;
          }
          if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyO') {
            if (inspectingElephant) {
              if (activeSituationalEvent && activeSituationalEvent.status === 'active' && activeSituationalEvent.elephantId === inspectingElephant.id && activeSituationalEvent.followUpReady && !activeSituationalEvent.followUpDone) {
                completeSituationalEventFollowUp(activeSituationalEvent);
              } else {
                recordObservationForElephant(inspectingElephant);
              }
            }
            return;
          }
          if (e.code === 'KeyP') {
            if (inspectingElephant) {
              performPedicureProcedure(inspectingElephant);
            }
            return;
          }
          return;
        }

        // 2. Планшет дежурного кипера (Tab / T)
        if (gameState === 'SHIFT_TABLET') {
          if (e.code === 'Escape' || e.code === 'Tab' || e.code === 'KeyT' || e.code === 'Enter' || e.code === 'Space') {
            gameState = 'PLAYING';
            sfx.playSuccess();
          }
          return;
        }

        // 3. Пауза дежурства (P / Esc)
        if (e.code === 'KeyP') {
          if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
          } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
          } else if (gameState === 'QTE_URINE') {
            // Пауза во время показа результата QTE: запоминаем, куда вернуться
            qteState.returnState = 'PAUSED';
            gameState = 'PAUSED';
          }
          return;
        }

        if (e.code === 'Escape') {
          if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
          } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
          } else if (gameState === 'QTE_URINE') {
            qteState.returnState = 'PAUSED';
            gameState = 'PAUSED';
          }
          return;
        }

        // 4. UX-рефакторинг: журнал дежурного (клавиша J) — поверх игры,
        // без паузы и без изменения игровой логики.
        if (e.code === 'KeyJ' && (gameState === 'PLAYING' || gameState === 'PAUSED')) {
          journalOpen = !journalOpen;
          sfx.playStep();
          return;
        }

        // 5. Открытие планшета смены во время игры
        if ((gameState === 'PLAYING' || (gameState === 'QTE_URINE' && qteState.result !== null)) && (e.code === 'Tab' || e.code === 'KeyT')) {
          if (gameState === 'QTE_URINE') qteState.returnState = 'SHIFT_TABLET';
          gameState = 'SHIFT_TABLET';
          sfx.playStep();
          return;
        }

        // 5. Старт смены на титульном экране
        if (gameState === 'TITLE' && (e.code === 'Space' || e.code === 'Enter')) {
          gameState = 'PLAYING';
          sfx.playSuccess();
          sfx.playElephantTrumpet();
          addLog('Кипер заступил на пост. Чистота и сытость слонов в ваших руках!');
          return;
        }

        // 6. Итоговый табель смены: перезапуск
        if (gameState === 'SHIFT_REPORT' && (e.code === 'Space' || e.code === 'Enter')) {
          restartShift();
          return;
        }

        // 7. Вызов осмотра слонихи (F) во время игры
        if (e.code === 'KeyF' && gameState === 'PLAYING') {
          tryInspectElephant();
          return;
        }

        // 8. Фиксация анализа мочи во время QTE
        if ((e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE') && gameState === 'QTE_URINE') {
          // Повторное нажатие во время показа результата игнорируется (как в canvas-обработчике)
          if (qteState.result === null) finishUrineQTE();
          return;
        }
      });

      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      // ==========================================
      // НАЭКРАННОЕ СЕНСОРНОЕ УПРАВЛЕНИЕ (TOUCH & MOUSE)
      // ==========================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const touchControls = {
        dpad: { cx: 95, cy: 590, r: 58, active: false },
        actionBtn: { cx: 925, cy: 590, r: 42, active: false },
        inspectBtn: { cx: 815, cy: 590, r: 32, active: false },
        knob: { x: 0, y: 0 },
        isMouseDown: false
      };

      const virtualKeys = {
        up: false,
        down: false,
        left: false,
        right: false,
        action: false
      };

      // ==========================================
      // АДАПТАЦИЯ К ОРИЕНТАЦИИ (LANDSCAPE-FIRST)
      // ==========================================
      let isRotateOverlayActive = false;

      function checkDeviceOrientation() {
        const isPortrait = window.innerHeight > window.innerWidth;
        // Показываем заставку «Поверните устройство», если устройство в портретном режиме и это мобильный экран
        const isNarrowScreen = window.innerWidth < 850 || window.innerHeight < 550;
        const shouldShowRotatePrompt = isPortrait && isNarrowScreen;

        const overlay = document.getElementById('rotate-device-overlay');
        const gameWrapper = document.getElementById('game-wrapper');

        if (shouldShowRotatePrompt) {
          if (!isRotateOverlayActive) {
            isRotateOverlayActive = true;
            // Сброс движения кипера, чтобы персонаж не продолжал идти
            virtualKeys.up = false;
            virtualKeys.down = false;
            virtualKeys.left = false;
            virtualKeys.right = false;
            virtualKeys.action = false;
          }
          if (overlay) overlay.style.display = 'flex';
          if (gameWrapper) gameWrapper.style.display = 'none';
        } else {
          if (isRotateOverlayActive) {
            isRotateOverlayActive = false;
          }
          if (overlay) overlay.style.display = 'none';
          if (gameWrapper) gameWrapper.style.display = 'block';
        }
      }

      window.addEventListener('resize', checkDeviceOrientation);
      window.addEventListener('orientationchange', () => {
        setTimeout(checkDeviceOrientation, 100);
      });

      // Контекстное действие для правой наэкранной кнопки действия
      function getKeeperContextAction() {
        if (gameState === 'QTE_URINE') {
          return { label: 'ПОЙМАТЬ!', icon: '🧪', color: '#f1c40f', hold: false };
        }
        if (gameState === 'TITLE') {
          return { label: 'СТАРТ', icon: '▶️', color: '#27ae60', hold: false };
        }
        if (gameState === 'SHIFT_REPORT') {
          return { label: 'СМЕНА', icon: '🔄', color: '#27ae60', hold: false };
        }

        // 1. Слонихи поблизости
        for (const el of elephants) {
          const dist = Math.hypot(player.x - el.x, player.y - el.y);
          if (dist < el.radius + 38) {
            if (activeSituationalEvent && activeSituationalEvent.status === 'active' && activeSituationalEvent.elephantId === el.id && activeSituationalEvent.followUpReady && !activeSituationalEvent.followUpDone) {
              return { label: 'КОНТРОЛЬ', icon: '🔍', color: '#3498db', hold: false, elephant: el };
            }
            if (el.isWantingPee && player.carrying === 'bucket') {
              return { label: 'МОЧА', icon: '🧪', color: '#f1c40f', hold: false, elephant: el };
            }
            // ЭТАП 27R.2: контекст для цикла ухода за лакомством (ведение слона)
            if (player.carrying === 'treat') {
              if (keeperState.leadingElephantId === el.id) {
                return { label: 'ДАТЬ', icon: '🍌', color: '#f1c40f', hold: false, elephant: el };
              }
              return { label: 'ВЕСТИ', icon: '🍌', color: '#f1c40f', hold: false, elephant: el };
            }
            if (player.carrying === 'hay' || player.carrying === 'mash') {
              return { label: 'КОРМ', icon: '🌾', color: '#27ae60', hold: false, elephant: el };
            }
            if (el.isWantingPedicure || !el.pedicureDone) {
              return { label: 'ПЕДИКЮР', icon: '🦶', color: '#e67e22', hold: true, elephant: el };
            }
            return { label: 'ОСМОТР', icon: '👁️', color: '#3498db', hold: false, elephant: el };
          }
        }

        // 1А. Интерактивные внеплановые объекты вольера (Этап 09)
        if (misplacedTool && misplacedTool.active) {
          const dist = Math.hypot(player.x - misplacedTool.x, player.y - misplacedTool.y);
          if (dist < 50) {
            return { label: 'ПОДНЯТЬ', icon: '🪣', color: '#f39c12', hold: false };
          }
        }
        if (scatteredHay && scatteredHay.active) {
          const dist = Math.hypot(player.x - scatteredHay.x, player.y - scatteredHay.y);
          if (dist < 50) {
            return { label: 'СОБРАТЬ', icon: '🌾', color: '#27ae60', hold: false };
          }
        }
        if (feederCrust && feederCrust.active) {
          const f = feeders.find(fd => fd.id === feederCrust.feederId);
          if (f) {
            const dist = Math.hypot(player.x - (f.x + f.w / 2), player.y - (f.y + f.h / 2));
            if (dist < 55) {
              return { label: 'ОЧИСТИТЬ', icon: '🧼', color: '#3498db', hold: true };
            }
          }
        }

        // 2. Навоз
        for (const pile of dungPiles) {
          const dist = Math.hypot(player.x - pile.x, player.y - pile.y);
          if (dist < 48) {
            if (player.wheelbarrowKg >= player.wheelbarrowMaxKg) {
              return { label: 'ПОЛНА', icon: '⚠️', color: '#e74c3c', hold: false };
            }
            // ЭТАП 28 FIX: уборка лопатой теперь непрерывная — подсказка
            // отражает удержание кнопки (ранее «ЛОПАТА» вводило в заблуждение).
            return { label: 'ДЕРЖИТЕ: ЛОПАТА', icon: '🧹', color: '#d35400', hold: true };
          }
        }

        // 2А. Мокрое сено — уборка вилами только удержанием (ЭТАП 27R.2)
        for (const w of wetSpots) {
          if (Math.hypot(player.x - w.x, player.y - w.y) < w.r + 34) {
            if (!player.hasPitchfork) {
              return { label: 'НУЖНЫ ВИЛЫ', icon: '🛠️', color: '#e67e22', hold: false };
            }
            if (player.wheelbarrowKg >= player.wheelbarrowMaxKg) {
              return { label: 'ТАЧКА ПОЛНА', icon: '⚠️', color: '#e74c3c', hold: false };
            }
            return { label: 'ВИЛЫ', icon: '🍀', color: '#2980b9', hold: true };
          }
        }

        // 2Б. Стол лакомств и стойка вил (ЭТАП 27R.2)
        if (Math.hypot(player.x - treatTable.x, player.y - treatTable.y) < 55 && !player.isShoveling && !player.isDoingPedicure && !player.isWashing) {
          if (player.carrying === 'treat') {
            return { label: 'ВЕРНУТЬ', icon: '🍌', color: '#f1c40f', hold: false };
          }
          if (keeperState.treatsStock > 0 && player.carrying === 'none') {
            return { label: 'ЛАКОМСТВО', icon: '🍌', color: '#f1c40f', hold: false };
          }
        }
        if (Math.hypot(player.x - forkRack.x, player.y - forkRack.y) < 55 && !player.isShoveling && !player.isDoingPedicure && !player.isWashing) {
          return { label: player.hasPitchfork ? 'ВЕРНУТЬ ВИЛЫ' : 'ВЗЯТЬ ВИЛЫ', icon: '🛠️', color: '#2980b9', hold: false };
        }

        // 2В. Зона мойки — удержание действия (ЭТАП 27R.2)
        if (Math.hypot(player.x - washZone.x, player.y - washZone.y) < washZone.r + 45 &&
            elephants.some(e => Math.hypot(e.x - washZone.x, e.y - washZone.y) < washZone.r && e.footDirt >= 25) &&
            player.carrying === 'none' && !player.isShoveling && !player.isDoingPedicure) {
          return { label: 'МОЙКА', icon: '🚿', color: '#3498db', hold: true };
        }

        // 3. Вентиль поилки
        const distToValve = Math.hypot(player.x - waterTrough.valveX, player.y - waterTrough.valveY);
        if (distToValve < 60 || (player.x >= 420 && player.x <= 560 && player.y >= 540 && player.y <= 650)) {
          if (activeSituationalEvent && activeSituationalEvent.type === 'trough_low_thirst' && !activeSituationalEvent.actionDone) {
            return { label: 'ДОЛИВ!', icon: '💧', color: '#f39c12', hold: true };
          }
          if (waterTrough.water >= 100) {
            return { label: 'ПОЛНА 100%', icon: '💧', color: '#2ecc71', hold: false };
          }
          return { label: 'ВЕНТИЛЬ', icon: '💧', color: '#3498db', hold: true };
        }

        // 4. Кормушки
        for (const f of feeders) {
          const dist = Math.hypot(player.x - (f.x + f.w / 2), player.y - (f.y + f.h / 2));
          if (dist < 55) {
            if (player.carrying === 'hay' || player.carrying === 'mash') {
              return { label: 'КОРМУШКА', icon: '🥣', color: '#2ecc71', hold: false };
            }
          }
        }

        // 5. Контейнер навоза
        const nearDumpster = player.x >= 780 && player.x <= 975 && player.y >= 50 && player.y <= 175;
        if (nearDumpster) {
          if (player.wheelbarrowKg > 0) {
            return { label: 'ВЫГРУЗИТЬ', icon: '♻️', color: '#27ae60', hold: false };
          }
          return { label: 'ПУСТА', icon: '🚜', color: '#7f8c8d', hold: false };
        }

        // 6. Стойка лабораторных ведер
        const distToRack = Math.hypot(player.x - 768, player.y - 120);
        if (distToRack < 55) {
          if (player.carrying === 'bucket') {
            return { label: 'ВЕДРО', icon: '🧪', color: '#f39c12', hold: false };
          }
          if (player.carrying === 'none') {
            return { label: 'ВЕДРО', icon: '🧪', color: '#3498db', hold: false };
          }
        }

        // 7. Склад сена
        const distToHay = Math.hypot(player.x - 80, player.y - 90);
        if (distToHay < 65) {
          if (player.carrying === 'hay') {
            return { label: 'СЕНО', icon: '🌾', color: '#f39c12', hold: false };
          }
          if (player.carrying === 'none') {
            return { label: 'СЕНО', icon: '🌾', color: '#27ae60', hold: false };
          }
        }

        // 8. Склад каши
        const distToMash = Math.hypot(player.x - 190, player.y - 90);
        if (distToMash < 65) {
          if (player.carrying === 'mash') {
            return { label: 'КАША', icon: '🥣', color: '#f39c12', hold: false };
          }
          if (player.carrying === 'none') {
            return { label: 'КАША', icon: '🥣', color: '#27ae60', hold: false };
          }
        }

        if (player.carrying !== 'none') {
          return { label: 'БРОСИТЬ', icon: '📦', color: '#7f8c8d', hold: false };
        }

        return { label: 'SPACE', icon: '🔨', color: '#2ecc71', hold: false };
      }

      function updateTouchControlsUI() {
        const touchLayer = document.getElementById('touch-controls-layer');
        if (!touchLayer) return;

        // Если открыто модальное окно, скрываем сенсорные кнопки, чтобы они не мешали взаимодействию с карточками
        const isModalOpen = (gameState === 'SHIFT_TABLET' || gameState === 'INSPECTION_MODAL' || gameState === 'SHIFT_REPORT' || gameState === 'PAUSED' || gameState === 'TITLE');
        if (isModalOpen) {
          touchLayer.style.display = 'none';
          return;
        } else {
          touchLayer.style.display = 'block';
        }

        // Обновляем бейдж невыполненных доступных задач на кнопке планшета
        const availCount = shiftTasks.filter(t => t.status === 'available').length;
        const badge = document.getElementById('touch-tasks-badge');
        if (badge) {
          if (availCount > 0) {
            badge.style.display = 'flex';
            badge.textContent = String(availCount);
          } else {
            badge.style.display = 'none';
          }
        }

        // Контекстное действие для кнопки SPACE
        const actionBtn = document.getElementById('touch-btn-action');

        const act = getKeeperContextAction();

        }
        if (actionBtn && act.color) {
          actionBtn.style.borderColor = act.color;
        }

        // Подсветка кнопки осмотра рядом со слонихой
        let nearElephant = false;
        for (const el of elephants) {

          if (dist < el.radius + 45) {

          }
        }
        if (inspectBtn) {
          if (nearElephant) {
            inspectBtn.classList.add('highlighted');
          } else {
            inspectBtn.classList.remove('highlighted');
          }
        }
      }

      function initTouchControls() {
        const joystickBase = document.getElementById('touch-joystick-base');
        const joystickKnob = document.getElementById('touch-joystick-knob');
        let joystickPointerId = null;
        let joystickActive = false;
        let jCenterX = 0;
        let jCenterY = 0;
        const jMaxRadius = 34;

        if (joystickBase) {
          joystickBase.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            sfx.init();
            joystickPointerId = e.pointerId;
            joystickActive = true;
            try {
              joystickBase.setPointerCapture(e.pointerId);
            } catch (err) {}
            const rect = joystickBase.getBoundingClientRect();
            jCenterX = rect.left + rect.width / 2;
            jCenterY = rect.top + rect.height / 2;
            handleJoystickPointer(e);
          });

          joystickBase.addEventListener('pointermove', (e) => {
            if (!joystickActive || e.pointerId !== joystickPointerId) return;
            e.preventDefault();
            handleJoystickPointer(e);
          });

          function handleJoystickPointer(e) {
            const dx = e.clientX - jCenterX;
            const dy = e.clientY - jCenterY;
            const dist = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);
            const clampedDist = Math.min(dist, jMaxRadius);
            const kx = Math.cos(angle) * clampedDist;
            const ky = Math.sin(angle) * clampedDist;

            if (joystickKnob) {
              joystickKnob.style.transform = `translate(${kx}px, ${ky}px)`;
            }

            const deadzone = 8;
            virtualKeys.up = dy < -deadzone;
            virtualKeys.down = dy > deadzone;
            virtualKeys.left = dx < -deadzone;
            virtualKeys.right = dx > deadzone;
          }

          function resetJoystick(e) {
            if (e && e.pointerId !== undefined && joystickPointerId !== null && e.pointerId !== joystickPointerId) return;
            joystickActive = false;
            joystickPointerId = null;
            if (joystickKnob) {
              joystickKnob.style.transform = 'translate(0px, 0px)';
            }
            virtualKeys.up = false;
            virtualKeys.down = false;
            virtualKeys.left = false;
            virtualKeys.right = false;
          }

          joystickBase.addEventListener('pointerup', resetJoystick);
          joystickBase.addEventListener('pointercancel', resetJoystick);
          joystickBase.addEventListener('lostpointercapture', resetJoystick);
        }

        // Кнопка действия (SPACE / удержание)
        const actBtn = document.getElementById('touch-btn-action');
        if (actBtn) {
          actBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            sfx.init();
            try {
              actBtn.setPointerCapture(e.pointerId);
            } catch (err) {}
            virtualKeys.action = true;
            actBtn.classList.add('holding');

            // ЭТАП 27R: одиночное «нажатие» действия для update() на сенсорном вводе
            if (gameState === 'PLAYING') player.actionQueued = true;

            if (gameState === 'QTE_URINE') {
              finishUrineQTE(); // защита от повторного начисления внутри самой функции (result !== null)
              return;
            }
            if (gameState === 'TITLE') {
              gameState = 'PLAYING';
              sfx.playSuccess();
              sfx.playElephantTrumpet();
              addLog('Кипер заступил на пост. Чистота и сытость слонов в ваших руках!');
              return;
            }
            if (gameState === 'SHIFT_REPORT') {
              restartShift();
              return;
            }
          });

          function releaseAction() {
            virtualKeys.action = false;
            if (actBtn) actBtn.classList.remove('holding');
          }

          actBtn.addEventListener('pointerup', releaseAction);
          actBtn.addEventListener('pointercancel', releaseAction);
          actBtn.addEventListener('lostpointercapture', releaseAction);
        }

        // Кнопка осмотра (F)
        const inspBtn = document.getElementById('touch-btn-inspect');
        if (inspBtn) {
          inspBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            sfx.init();
            if (gameState === 'PLAYING') {
              tryInspectElephant();
            }
          });
        }

        // Кнопка планшета (Tab)
        const tabBtn = document.getElementById('touch-btn-tablet');
        if (tabBtn) {
          tabBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            sfx.init();
            if (gameState === 'PLAYING') {
              gameState = 'SHIFT_TABLET';
              sfx.playStep();
            } else if (gameState === 'SHIFT_TABLET') {
              gameState = 'PLAYING';
              sfx.playStep();
            }
          });
        }

        // Кнопка паузы (P)
        const pauseBtn = document.getElementById('touch-btn-pause');
        if (pauseBtn) {
          pauseBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            sfx.init();
            if (gameState === 'PLAYING') {
              gameState = 'PAUSED';
            } else if (gameState === 'PAUSED') {
              gameState = 'PLAYING';
            }
          });
        }

        // Кнопка звука (M)
        const sndBtn = document.getElementById('touch-btn-sound');
        if (sndBtn) {
          sndBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            sfx.init();
            sfx.toggleMute();
            sndBtn.textContent = sfx.muted ? '🔇' : '🔊';
            addLog(sfx.muted ? 'Звук выключен' : 'Звук включен');
          });
        }

        // Сброс виртуального ввода при потере фокуса окна браузера
        window.addEventListener('blur', () => {
          virtualKeys.up = false;
          virtualKeys.down = false;
          virtualKeys.left = false;
          virtualKeys.right = false;
          virtualKeys.action = false;
          if (joystickKnob) joystickKnob.style.transform = 'translate(0px, 0px)';
          if (actBtn) actBtn.classList.remove('holding');
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            virtualKeys.up = false;
            virtualKeys.down = false;
            virtualKeys.left = false;
            virtualKeys.right = false;
            virtualKeys.action = false;
            if (joystickKnob) joystickKnob.style.transform = 'translate(0px, 0px)';
            if (actBtn) actBtn.classList.remove('holding');
          }
        });
      }

      function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return { x: 0, y: 0 };
        const scaleX = CANVAS_WIDTH / rect.width;
        const scaleY = CANVAS_HEIGHT / rect.height;
        return {
          x: Math.max(0, Math.min(CANVAS_WIDTH, (clientX - rect.left) * scaleX)),
          y: Math.max(0, Math.min(CANVAS_HEIGHT, (clientY - rect.top) * scaleY))
        };
      }

      function processTouchPoints(pointList, isStart) {
        sfx.init();

        for (let i = 0; i < pointList.length; i++) {
          const pt = pointList[i];

          // 1. Проверка интерактивных экранов (Start, Pause, Tablet, Reset, QTE, Modals, Sound)
          if (isStart) {
            // Кнопка звука в HUD (x: 935..985, y: 8..40)
            if (pt.x >= 935 && pt.x <= 985 && pt.y >= 8 && pt.y <= 40) {
              sfx.toggleMute();
              addLog(sfx.muted ? 'Звук выключен' : 'Звук включен');
              continue;
            }

            // Кнопка паузы в HUD (x: 880..930, y: 8..40)
            if (pt.x >= 880 && pt.x <= 930 && pt.y >= 8 && pt.y <= 40) {
              if (gameState === 'QTE_URINE') {
                // Пауза доступна и на экране результата QTE — возврат после паузы в PLAYING
                qteState.returnState = 'PLAYING';
                gameState = 'PAUSED';
              } else {
                gameState = gameState === 'PLAYING' ? 'PAUSED' : 'PLAYING';
              }
              continue;
            }

            // Кнопка планшета в HUD (x: 825..875, y: 8..40) или клик по нижнему журналу (x: 180..750, y: CANVAS_HEIGHT - 82..CANVAS_HEIGHT)
            if ((pt.x >= 825 && pt.x <= 875 && pt.y >= 8 && pt.y <= 40) ||
                (pt.x >= 180 && pt.x <= 750 && pt.y >= CANVAS_HEIGHT - 82 && pt.y <= CANVAS_HEIGHT - 10)) {
              if (gameState === 'PLAYING') {
                gameState = 'SHIFT_TABLET';
                sfx.playStep();
              } else if (gameState === 'SHIFT_TABLET') {
                gameState = 'PLAYING';
                sfx.playStep();
              } else if (gameState === 'QTE_URINE' && qteState.result !== null) {
                // Планшет поверх экрана результата QTE: возврат в PLAYING после закрытия
                qteState.returnState = 'PLAYING';
                gameState = 'SHIFT_TABLET';
                sfx.playStep();
              }
              continue;
            }

            if (gameState === 'TITLE') {
              if (pt.x >= 380 && pt.x <= 620 && pt.y >= 480 && pt.y <= 540) {
                gameState = 'PLAYING';
                sfx.playSuccess();
                sfx.playElephantTrumpet();
                addLog('Кипер заступил на пост. Удачи на смене!');
              }
              continue;
            }

            if (gameState === 'SHIFT_REPORT') {
              if (pt.x >= 380 && pt.x <= 620 && pt.y >= 565 && pt.y <= 625) {
                restartShift();
              }
              continue;
            }

            if (gameState === 'INSPECTION_MODAL') {
              const el = inspectingElephant;
              // 1. Стрелочка [◄] влево переключения категории наблюдения (x: 512..555, y: 270..305)
              if (el && pt.x >= 512 && pt.x <= 555 && pt.y >= 270 && pt.y <= 305) {
                el.selectedObsCategory = ((el.selectedObsCategory || 0) + 4) % 5;
                sfx.playStep();
                continue;
              }
              // 2. Стрелочка [►] вправо переключения категории наблюдения (x: 815..858, y: 270..305)
              if (el && pt.x >= 815 && pt.x <= 858 && pt.y >= 270 && pt.y <= 305) {
                el.selectedObsCategory = ((el.selectedObsCategory || 0) + 1) % 5;
                sfx.playStep();
                continue;
              }
              // 3. Кнопка «Внести наблюдение в журнал» или «Подтвердить контрольную проверку» (x: 515..855, y: 365..405)
              if (el && pt.x >= 515 && pt.x <= 855 && pt.y >= 365 && pt.y <= 405) {
                if (activeSituationalEvent && activeSituationalEvent.status === 'active' && activeSituationalEvent.elephantId === el.id && activeSituationalEvent.followUpReady && !activeSituationalEvent.followUpDone) {
                  completeSituationalEventFollowUp(activeSituationalEvent);
                } else {
                  recordObservationForElephant(el);
                }
                continue;
              }
              // 4. Кнопка «Провести педикюр» (x: 695..855, y: 128..162)
              if (el && pt.x >= 695 && pt.x <= 855 && pt.y >= 128 && pt.y <= 162) {
                performPedicureProcedure(el);
                continue;
              }
              // 5. Закрытие карточки по кнопке [✕] в шапке (820..875, 35..85), по нижней кнопке (340..660, 575..630),
              // либо клику вне окна (x < 115 || x > 885 || y < 30 || y > 650)
              if ((pt.x >= 820 && pt.x <= 875 && pt.y >= 35 && pt.y <= 85) ||
                  (pt.x >= 340 && pt.x <= 660 && pt.y >= 575 && pt.y <= 630) ||
                  (pt.x < 115 || pt.x > 885 || pt.y < 30 || pt.y > 650)) {
                gameState = 'PLAYING';
                inspectingElephant = null;
                sfx.playSuccess();
              }
              continue;
            }

            if (gameState === 'SHIFT_TABLET') {
              // Закрытие планшета по кнопке закрытия или клику вне планшета (50..950, 20..660)
              if ((pt.x >= 340 && pt.x <= 660 && pt.y >= 585 && pt.y <= 645) ||
                  (pt.x < 50 || pt.x > 950 || pt.y < 20 || pt.y > 660)) {
                gameState = 'PLAYING';
                sfx.playSuccess();
              }
              continue;
            }

            if (gameState === 'QTE_URINE') {
              // Любой тап по экрану QTE: повторный клик во время показа результата игнорируется
              if (qteState.result === null) finishUrineQTE();
              continue;
            }

            if (gameState === 'PAUSED') {
              gameState = 'PLAYING';
              continue;
            }
          }
        }
      }

      // События Touch для смартфонов и планшетов (Multi-touch)

      // ==========================================
      // 3. ФИЗИКА, КОЛЛИЗИИ И ВЗАИМОДЕЙСТВИЯ
      // ==========================================
      function checkCollision(x, y, radius) {
        // Проверка со статическими препятствиями
        for (const obs of obstacles) {
          const closestX = Math.max(obs.x, Math.min(x, obs.x + obs.w));
          const closestY = Math.max(obs.y, Math.min(y, obs.y + obs.h));
          const dx = x - closestX;
          const dy = y - closestY;
          if (dx * dx + dy * dy < radius * radius) {
            return true;
          }
        }
        // Проверка со слонами (чтобы кипер не наступал на туловище)
        for (const el of elephants) {
          const dx = x - el.x;
          const dy = y - el.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < radius + el.radius * 0.7) {
            return true;
          }
        }
        return false;
      }

      // Этап 26: выталкивание кипера из перекрытий (защита от застревания внутри слона).
      // Позиция считается недопустимой не только через checkCollision до шага, но и
      // когда слон сам подошёл к стоящему персонажу или когда персонаж уже оказался
      // между препятствиями. Коррекция минимальным сдвигом вдоль вектора «слон -> кипер»,
      // поэтому телепортаций и прохода сквозь стены не происходит.
      function resolveKeeperCollisions() {
        for (const el of elephants) {
          const minDist = player.radius + el.radius * 0.7;
          let dx = player.x - el.x;
          let dy = player.y - el.y;
          let dist = Math.hypot(dx, dy);
          if (dist >= minDist) continue;

          if (dist < 0.01) {
            // Полный совпад центров — выталкиваем вверх (в сторону зоны кипера)
            dx = 0; dy = -1; dist = 0.01;
          }
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = minDist - dist;
          const maxStep = Math.max(overlap, player.speed * 0.05); // плавная коррекция <= ~8 px/кадр

          // Проверяем позиции по мере удаления от слона и занимаем первую свободную:
          // если кипер прижат к стене/объекту, он выходит вдоль преграды, а не сквозь неё.
          let resolved = false;
          for (let s = maxStep; s >= 1; s -= 1) {
            const tx = player.x + nx * s;
            const ty = player.y + ny * s;
            if (!checkCollision(tx, ty, player.radius)) {
              player.x = tx;
              player.y = ty;
              resolved = true;
              break;
            }
          }
          if (!resolved && !checkCollision(player.x, player.y, player.radius)) {
            // Текущая позиция формально допустима (слон вошёл в персонаж) — выходим на дистанцию контакта
            player.x = el.x + nx * minDist;
            player.y = el.y + ny * minDist;
          }
        }
      }

      // Проверка доступности точки для перемещения слонихи (не заходить в стены, поилку и туловища подруг)
      function canElephantMoveTo(x, y, radius, ignoreElId) {
        // Границы вольера
        if (x < 50 || x > CANVAS_WIDTH - 50 || y < 240 || y > 580) {
          return false;
        }

        // Проверка с препятствиями (стены, кормушки, поилка)
        for (const obs of obstacles) {
          const closestX = Math.max(obs.x, Math.min(x, obs.x + obs.w));
          const closestY = Math.max(obs.y, Math.min(y, obs.y + obs.h));
          const dx = x - closestX;
          const dy = y - closestY;
          if (dx * dx + dy * dy < (radius * 0.65) * (radius * 0.65)) {
            return false;
          }
        }

        // Проверка с другими слонихами (не допускаем застреваний при случайном сближении)
        const currentEl = elephants.find(e => e.id === ignoreElId);
        for (const el of elephants) {
          if (el.id === ignoreElId) continue;
          const dist = Math.hypot(x - el.x, y - el.y);
          const minAllowed = (radius + el.radius) * 0.7;
          if (dist < minAllowed) {
            // Если слонихи уже оказались ближе нормы (например, после огибания навоза),
            // не блокируем шаг, если он увеличивает дистанцию (позволяет разойтись)
            if (currentEl) {
              const currentDist = Math.hypot(currentEl.x - el.x, currentEl.y - el.y);
              if (dist > currentDist) continue;
            }
            return false;
          }
        }

        return true;
      }

      // Выбор следующего состояния и целевой точки слонихи на основе ее характера и потребностей (Этап 10)
      function chooseNextElephantState(el) {
        // ЭТАП 27R.2: режим ведения за лакомством имеет приоритет над обычным
        // выбором поведения — обычный FSM не должен сбрасывать FOLLOW.
        if (el.state === 'FOLLOW' && keeperState.leadingElephantId === el.id) return;

        const myFeeder = feeders.find(f => f.id === el.id);

        // Вспомогательная функция поиска чистой точки без навоза
        function findCleanWanderPoint(minX, maxX, minY, maxY) {
          let tries = 0;
          while (tries < 16) {
            const rx = minX + Math.random() * (maxX - minX);
            const ry = minY + Math.random() * (maxY - minY);
            const nearTrough = (rx > 420 && rx < 570 && ry > 520);
            const nearDung = dungPiles.some(p => Math.hypot(rx - p.x, ry - p.y) < 65);
            if (!nearTrough && !nearDung && canElephantMoveTo(rx, ry, el.radius, el.id)) {
              return { x: rx, y: ry };
            }
            tries++;
          }
          return { x: minX + (maxX - minX) * 0.5, y: minY + (maxY - minY) * 0.5 };
        }

        // ЭТАП 27: поиск подходящего места для сна на мягком настиле — безопасно
        // (не у кипера, других слонов, стен, интерактивных объектов и мокрого сена)
        function findSleepSpot(e, prefX, prefY) {
          let best = null;
          let bestDist = Infinity;
          for (let tries = 0; tries < 24; tries++) {
            const ang = Math.random() * Math.PI * 2;
            const rad = tries < 12 ? Math.random() * 140 : 140 + Math.random() * 260;
            const rx = Math.max(90, Math.min(CANVAS_WIDTH - 90, prefX + Math.cos(ang) * rad));
            const ry = Math.max(265, Math.min(560, prefY + Math.sin(ang) * rad));
            if (!canElephantMoveTo(rx, ry, e.radius, e.id)) continue;
            if (Math.hypot(player.x - rx, player.y - ry) < 110) continue; // не ложимся на кипера
            if (wetSpots.some(w => Math.hypot(rx - w.x, ry - w.y) < w.r + 55)) continue; // не спим в луже
            if (dungPiles.some(p => Math.hypot(rx - p.x, ry - p.y) < 70)) continue;
            if (rx > washZone.x - washZone.r - 40 && rx < washZone.x + washZone.r + 40 &&
                ry > washZone.y - washZone.r - 40) continue; // не перекрываем зону мойки
            const d = Math.hypot(rx - e.x, ry - e.y);
            if (d < bestDist) { bestDist = d; best = { x: rx, y: ry }; }
          }
          return best;
        }

        // 1. Потребность в воде (жажда > 45 и в поилке есть вода)
        if (el.thirst > 45 && waterTrough.water > 5) {
          // Марго может по пути отвлечься на чесание или внешние звуки
          if (el.id === 'margo' && Math.random() < (el.distractionChance || 0.35)) {
            el.state = 'IDLE';
            el.stateTimer = 3.0 + Math.random() * 2.5;
            el.statusText = 'По пути к поилке отвлеклась и чешет бок';
            el.earAngle = Math.sin(worldAnimTime * 3) * 0.18;
            return;
          }
          el.state = 'WANDER';
          el.targetX = 475 + (Math.random() - 0.5) * 45;
          el.targetY = 535 + (Math.random() - 0.5) * 15;
          el.stateTimer = 11;
          el.statusText = 'Идёт к поилке';
          return;
        }

        // 2. Потребность в корме при наличии еды в кормушке
        if (el.satiety < 60 && myFeeder && myFeeder.food > 5) {
          if (el.id === 'margo' && Math.random() < 0.25) {
            el.state = 'IDLE';
            el.stateTimer = 2.5 + Math.random() * 2.5;
            el.statusText = 'Приостановилась по пути к кормушке';
            return;
          }
          el.state = 'WANDER';
          el.targetX = myFeeder.x + myFeeder.w / 2;
          el.targetY = myFeeder.y + 70;
          el.stateTimer = 11;
          el.statusText = 'Идёт к кормушке';
          return;
        }

        // 2А. Голодное кормовое поведение: если сытость < 45% или кормушка пуста, слониха активнее ищет корм
        if ((el.satiety < 45 || (myFeeder && myFeeder.food <= 5)) && Math.random() < 0.65) {
          el.state = 'WANDER';
          const targetOffset = (Math.random() - 0.5) * 44;
          el.targetX = myFeeder ? myFeeder.x + myFeeder.w / 2 + targetOffset : 240;
          el.targetY = myFeeder ? myFeeder.y + 70 + (Math.random() - 0.5) * 20 : 360;
          el.stateTimer = 9.0;
          el.statusText = myFeeder && myFeeder.food > 5 ? 'Ищет корм у кормушки' : 'Принюхивается к пустой кормушке';
          return;
        }

        // 3. Индивидуальные особенности слоних (Этап 10):
        // А) Претти (14 лет, Прэтти): склонность к более длительному отдыху, мягкий настил и аппетит
        if (el.id === 'pretty') {
          const needRest = el.energy < 60 || Math.random() < el.restChance;
          if (needRest) {
            const fatigueBonus = el.energy < 40 ? 6.0 : 0;
            // ЭТАП 27: весь пол — мягкий настил. Претти ищет чистое свободное место
            // рядом с привычным уголком, а не одну маленькую зону отдыха.
            const spot = findSleepSpot(el, 780, 470);
            if (spot && (Math.hypot(spot.x - el.x, spot.y - el.y) > 90 || Math.random() < 0.5)) {
              el.state = 'WANDER';
              el.targetX = spot.x;
              el.targetY = spot.y;
              el.stateTimer = 8.0;
              el.statusText = 'Ищет удобное место на мягком настиле для сна';
              return;
            } else {
              el.state = 'REST';
              el.stateTimer = el.restDurationMin + fatigueBonus + Math.random() * (el.restDurationMax - el.restDurationMin);
              el.statusText = fatigueBonus > 0 ? 'Глубокий восстановительный сон' : 'Спокойный длительный отдых на настиле';
              return;
            }
          }
        }

        // Б) Одри (42 года, матриарх): любопытство, исследование вольера, интерес к предметам обогащения
        if (el.id === 'audrey' && Math.random() < el.curiosityRate) {
          el.state = 'WANDER';
          const interestRoll = Math.random();
          if (interestRoll < 0.35) {
            // Исследование бревна-чесалки и подвесного кольца обогащения среды (x: 280, y: 460)
            el.targetX = 275 + (Math.random() - 0.5) * 35;
            el.targetY = 460 + (Math.random() - 0.5) * 25;
            el.statusText = 'Исследует бревно-чесалку и обогащение среды';
          } else if (interestRoll < 0.65) {
            // Осмотр бассейна и поилки
            el.targetX = 470 + (Math.random() - 0.5) * 40;
            el.targetY = 515 + (Math.random() - 0.5) * 20;
            el.statusText = 'Осматривает зону поилки и настил';
          } else if (interestRoll < 0.85) {
            // Периметр вольера
            el.targetX = 860 + (Math.random() - 0.5) * 40;
            el.targetY = 310 + (Math.random() - 0.5) * 30;
            el.statusText = 'Осматривает периметр вольера';
          } else {
            const pt = findCleanWanderPoint(100, 900, 260, 540);
            el.targetX = pt.x;
            el.targetY = pt.y;
            el.statusText = 'Любознательно исследует вольер';
          }
          el.stateTimer = el.wanderDurationMin + Math.random() * (el.wanderDurationMax - el.wanderDurationMin);
          return;
        }

        // В) Марго (28 лет): переменчивость поведения, периодическая смена занятий, отвлечения
        if (el.id === 'margo' && Math.random() < (el.distractionChance || 0.35)) {
          const mRoll = Math.random();
          if (mRoll < 0.5) {
            el.state = 'IDLE';
            el.stateTimer = 2.5 + Math.random() * 3.0;
            el.statusText = 'Отвлеклась на шорох и чешет бок о брус';
            el.earAngle = Math.sin(worldAnimTime * 3) * 0.2;
            return;
          } else {
            // Внезапная смена занятия и направления прогулки
            el.state = 'WANDER';
            const pt = findCleanWanderPoint(180, 820, 280, 520);
            el.targetX = pt.x;
            el.targetY = pt.y;
            el.stateTimer = 3.5 + Math.random() * 3.0;
            el.statusText = 'Сменила занятие, исследует настил';
            return;
          }
        }

        // 4. Потребность в отдыхе (длительная активность повышает потребность в отдыхе).
        // ЭТАП 27: сон возможен на любом мягком настиле — слониха сначала ищет
        // чистую свободную область (без кипера, слонов, стен, объектов и луж).
        const dynamicRestChance = el.restChance + Math.max(0, (60 - el.energy) * 0.008);
        if (el.energy < 35 || Math.random() < dynamicRestChance) {
          const fatigueBonus = el.energy < 40 ? 5.0 : 0;
          const spot = findSleepSpot(el, el.x, el.y);
          if (spot && (Math.hypot(spot.x - el.x, spot.y - el.y) > 70)) {
            el.state = 'WANDER';
            el.targetX = spot.x;
            el.targetY = spot.y;
            el.stateTimer = 9.0;
            el.statusText = 'Ищет чистое место на настиле, чтобы лечь';
            return;
          }
          el.state = 'REST';
          el.stateTimer = el.restDurationMin + fatigueBonus + Math.random() * (el.restDurationMax - el.restDurationMin);
          el.statusText = fatigueBonus > 0 ? 'Глубокий отдых после активности' : 'Спокойно отдыхает на мягком настиле';
          return;
        }

        // 5. Прогулка по вольеру (с обязательным поиском чистой точки)
        if (Math.random() < el.curiosityRate) {
          el.state = 'WANDER';
          const pt = findCleanWanderPoint(80, 920, 270, 550);
          el.targetX = pt.x;
          el.targetY = pt.y;
          el.stateTimer = el.wanderDurationMin + Math.random() * (el.wanderDurationMax - el.wanderDurationMin);
          el.statusText = 'Гуляет по вольеру';
          return;
        }

        // 6. Спокойное стояние на месте (IDLE)
        el.state = 'IDLE';
        el.stateTimer = el.idleDurationMin + Math.random() * (el.idleDurationMax - el.idleDurationMin);
        el.statusText = 'Наблюдает за окружением';
      }

      // ==========================================
      // МЕХАНИКА ОПЕРАТИВНЫХ СИТУАЦИЙ И ЦЕПОЧЕК (ЭТАП 07–09)
      // ==========================================
      function startSituationalEvent(ev) {
        activeSituationalEvent = ev;
        situationalEvents.push(ev);
        stats.situationalEventsOccurred++;

        const el = elephants.find(e => e.id === ev.elephantId);
        if (el) {
          if (ev.type === 'trough_low_thirst') {
            el.statusText = 'Ждёт воду у пустой поилки';
            sfx.playAlert();
          } else if (ev.type === 'pretty_low_activity') {
            el.statusText = 'Долгий отдых, вялый аппетит';
          } else if (ev.type === 'margo_distracted') {
            el.statusText = 'Чешет бок о брус ограды';
          } else if (ev.type === 'sanitation_cluster') {
